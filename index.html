pure dance” movement.",111],["e","Karana Mudra",112],["i","i431.webp",112],["f",["English","“of the senses,” “the cause,” “the reason,” or “an instrument”"],112],["f",["Devanagari","deva112.webp"],112],["f",["Transliteration","trans112.webp"],112],["p","<b>Description <\/b><i>Karana Mudra<\/i> is a single-hand gesture (<i>asamyukta hasta<\/i>) used in Indian Tantrism and <i>Vajrayana<\/i> (Tantric) Buddhism. It is employed as a ritual instrument to cast out demons and protect the <i>Dharma<\/i> against corruption. It is similar in appearance to the <i>Venu Mudra<\/i> (p.277)<i>, <\/i>and may also be used in Indian dance to depict the drum held by <i>Shiva Nataraja<\/i> or the flute held by Lord <i>Krishna<\/i>.",112],["p","<b>Technique <\/b>With the pad of the thumb, cover the tips of the middle and ring fingers. Extend the index and little fingers.",112],["p","<b>Application <\/b>For physical and mental benefits, sit in a comfortable position with the spine erect. Form the mudra with each hand, resting the hands on the lap, palms up. Breathe naturally, and hold for 5 to 45 minutes.",112],["p","<b>Benefits <\/b>Cleansing and purifying, benefits the bladder, colon, and large intestine, detoxifies body and mind, assists with the release of negative patterns and habits.",112],["p","<b>Note <\/b>For clearing space or cleansing a room of unwanted energies, form <i>Karana Mudra<\/i> with the right hand and <i>Kashyapa Mudra<\/i> (p.119) with the left hand. Hold <i>Karana Mudra<\/i> firmly against the small of your lower back, and use <i>Karana Mudra<\/i> in front of you, similar to the way you might use a bundle of dried sage to clean and clear the space of unwanted energies. Conclude by opening all the doors and windows, lighting incense, and filling the space with sacred sound (ringing a bell or Tibetan bowl, or chanting HONG loudly).",112],["e","Karatala Milita Mudra",113],["i","i435.webp",113],["f",["English","“hand-palms joined”"],113],["f",["Devanagari","deva113.webp"],113],["f",["Transliteration","trans113.webp"],113],["p","<b>Description <\/b><i>Karatala Milita Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) mentioned in the <i>Odissi Dance Pathfinder Vol. II<\/i>. It is used mostly in <i>Pallavis<\/i>.20",113],["p","<b>Technique <\/b>Join the hands palm to palm, with fingertips facing opposite directions.",113],["p","<b>Application <\/b>Held above the head, to frame the face and highlight expression, or in front of the waistline, to draw attention to the feminine curvature of the dancer’s figure.",113],["e","Karkata Mudra",114],["i","i439.webp",114],["f",["English","“crab”"],114],["f",["Devanagari","deva114.webp"],114],["f",["Transliteration","trans114.webp"],114],["p","<b>Additional names <\/b><i>Lina Karata<\/i>, <i>Badha<\/i>",114],["p","<b>Description <\/b><i>Karkata Mudra<\/i> is the third hand gesture of the twenty-four joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya Darpana. <\/i> It is also noted in the <i>Natya Shastra<\/i>. The patron deity associated is <i>Vishnu<\/i>.",114],["p","<b>Technique <\/b>Extend and interlock the fingers of both hands, maintaining ample space between the palms.",114],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Samuha-agamane<\/i> (“arrival of a group” or “coming together as a group”); <i>Tunda-darshana<\/i> (“stomach” or “stout”); <i>Shanka-purana<\/i> (“blowing the conch”); <i>Anganam-mootana<\/i> (“limbs stretching” or “fingers cracking”); <i>Shakha-unamana<\/i> (“bending a branch”). Additional usages denote: lamentation, yawning, striking, breathing hard, and crab.",114],["e","Karkatika Mudra",115],["i","i443.webp",115],["f",["English","“kernel”"],115],["f",["Devanagari","deva115.webp"],115],["f",["Transliteration","trans115.webp"],115],["p","<b>Description <\/b><i>Karkatika Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) noted in the <i>Abhinaya Chandrika.<\/i>",115],["p","<b>Technique <\/b>Interlace the fingers and clasp the hands. Extend the thumbs upward. Stretch your arms forward, keeping the mudra in front of your torso.",115],["p","<b>Application <\/b>Commonly held during dance conditioning exercises to help develop strength and focus.",115],["p","<b>Benefits <\/b>Aids in the development of strength, stamina, and concentration.",115],["e","Kartaridanda Mudra",116],["i","i447.webp",116],["f",["English","“arrow shaft”"],116],["f",["Devanagari","deva116.webp"],116],["f",["Transliteration","trans116.webp"],116],["p","<b>Description <\/b><i>Kartaridanda Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the dance tradition. In the <i>Abhinaya Darpana,<\/i> it is noted as one of the gestures that indicate “water animals.”",116],["p","<b>Technique <\/b>Assume <i>Kartarimukha Mudra I<\/i> (p.115) with your right hand and <i>Katakamukha Mudra III <\/i>(p.122) with your left hand. Cross the right forearm on top of the left, and turn both palms to face up.",116],["p","<b>Application <\/b>Denotes a water snake (<i>dundubha<\/i>).",116],["e","Kartarimukha Mudra I",117],["i","i451.webp",117],["f",["English","“arrow face”"],117],["f",["Devanagari","deva117.webp"],117],["f",["Transliteration","trans117.webp"],117],["p","<b>Description <\/b><i>Kartarimukha Mudra I<\/i> is the fourth hand gesture of the twentyeight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana<\/i>. It is also noted in <i>Natya Shastra<\/i> and <i>Abhinaya Chandrika<\/i>. According to mythology, this mudra originated from <i>Shiva<\/i> when he set out to slay the demon <i>Jatadhara<\/i>. According to legend, he fixed his middle finger in the center of the earth and drew a circle around the circumference of the earth with his index finger, and this is how <i>Kartarimukha Mudra<\/i> was created. The associated sage is <i>Parjanya<\/i> (“rain god”), race is <i>Kshatriya, <\/i>color is copper, and patron deity is <i>Vishnu<\/i>.",117],["p","<b>Technique <\/b>Raise your hand with the palm facing forward, fingers pointing upward. Separate the index and middle fingers into a scissor-like shape. Join the tips of the thumb with the tips of the ring and little finger.",117],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Stri-pumsayu-vishlasya <\/i> (“separation of man and woman”); <i>Viparyasapaday-piva<\/i> (“opposition” or “overturning”); <i>Luntana<\/i> (“stealing” or “rolling”); <i>Nayana-amtam<\/i> (“corner of the eye”); <i>Marana<\/i> (“death”); <i>Bheda-bhavana<\/i> (“disagreement”); <i>Vidhyu-dartha <\/i> (“lightning”); <i>Yekashiya-viraha<\/i> (“laying in separation from the loved one”); <i>Patana <\/i>(“falling”); <i>Latayan<\/i> (“creeper”). According to the <i>Natya Shastra<\/i>, when the fingers are pointing downward it can indicate walking, painting the feet, decorating the body, and dancing. When the fingers point upward it can represent biting, blowing a horn, or painting a picture. Additional usages are: lightning, buffalo, deer, flywhisk, hilltop, elephant, bull, cow, coil of hair, scissors, tower.",118],["p","<b>Note <\/b>In the <i>Hasta Lakshana Deepika<\/i>, this mudra is described as a different formation, similar to <i>Chatura Mudra<\/i> of <i>Abhinaya Darpana<\/i> and <i>Natya Shastra<\/i>.",118],["e","Kartarimukha Mudra II",119],["i","i457.webp",119],["f",["English","“arrow face”"],119],["f",["Devanagari","deva119.webp"],119],["f",["Transliteration","trans119.webp"],119],["p","<b>Description <\/b><i>Kartarimukha Mudra II<\/i> is the fourth hand gesture of the twentyeight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana<\/i>. According to mythology, this mudra originated from <i>Shiva<\/i> when he set out to slay the demon <i>Jatadhara<\/i>. According to legend, he fixed his middle finger in the center of the earth and drew a circle around the circumference of the earth with his index finger, and this is how <i>Kartarimukha Mudra<\/i> was created. The associated sage is <i>Parjanya<\/i> (“rain god”), race is <i>Kshatriya<\/i>, color is copper, and patron deity is <i>Vishnu<\/i>.",119],["p","<b>Technique <\/b>Raise your hand with the palm facing forward, fingers pointing upward. Bend the little and ring fingers 90 degrees at the lower joint. Separate the index and middle fingers into a scissor-like shape. Keep the thumb flush against the side of the hand.",119],["p","<b>Application <\/b>See <i>Kartarimukha Mudra I<\/i>.",119],["p","<b>Note <\/b>Another variation, mentioned in the<i> Odissi Dance Pathfinder<\/i>,21 is with fingers and thumb extended upward; bend the middle and ring fingers deep toward the palm.",119],["e","Kartarisvastika Mudra",120],["i","i461.webp",120],["f",["English","“crossed arrows”"],120],["f",["Devanagari","deva120.webp"],120],["f",["Transliteration","trans120.webp"],120],["p","<b>Description <\/b><i>Kartarisvastika Mudra<\/i> is the tenth hand gesture of the twentyfour joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana.<\/i>",120],["p","<b>Technique <\/b>Form <i>Kartarimukha Mudra I<\/i> or <i>II <\/i>(p.115/p.117) with each hand. Cross the wrists and keep the gesture about 6 inches from your chest.",120],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Shakha<\/i> (“branches of a tree”); <i>Adri-Shikhara<\/i> (“summit or hill top”); <i>Vriksha<\/i> (“tree”).",120],["p","<b>Note <\/b>This mudra is also noted in the <i>Abhinaya Darpana<\/i> as describing a specific type of tree named <i>Shami<\/i>.",120],["e","Kashyapa Mudra",121],["i","i465.webp",121],["f",["English","“turtle/tortoise gesture”"],121],["f",["Devanagari","deva121.webp"],121],["f",["Transliteration","trans121.webp"],121],["p","<b>Description <\/b><i>Kashyapa Mudra<\/i> is a single-hand gesture (<i>asamyukta hasta<\/i>) used in the Hindu tradition to depict the union of <i>linga<\/i> and <i>yoni, <\/i>and to symbolize <i>Kashyapa Rishi.<\/i>22",121],["p","<b>Technique <\/b>Place the tip of the thumb in the web between the middle and ring fingers. Close the remaining fingers as if making a fist.",121],["p","<b>Application <\/b>In a comfortable seated position, form the mudra with each hand and place the hands on the thighs, palms facing up. Relax the throat, chest, and belly. Breathe naturally and hold for 5 to 45 minutes.",121],["p","<b>Benefits <\/b>Grounding and centering, balances masculine and feminine qualities, protects against negative energies and unfriendly or confused spirits (sometimes called “orphan spirits”).",121],["p","<b>Note <\/b><i>Kashyapa Mudra<\/i> can also be used as a protective seal placed in the small of the lower back during energetic purification of a room or building (a practice similar to what is commonly called “smudging” in Native American traditions). In this case, the mudra is formed with the left hand while the right holds a stick of incense or bundle of dried sage.",121],["e","Katakamukha Mudra I",122],["i","i469.webp",122],["f",["English","“link in a chain”"],122],["f",["Devanagari","deva122.webp"],122],["f",["Transliteration","trans122.webp"],122],["p","<b>Description <\/b><i>Katakamukha Mudra I <\/i>is the twelfth hand gesture of the twentyeight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana<\/i>. According to mythology, this mudra originated from <i>Guha<\/i>23 when he practiced archery in front of <i>Shiva. <\/i>The associated sage is <i>Bhargava<\/i>, race is <i>Deva<\/i>, color is gold, and patron deity is <i>Raghu Rama<\/i>.",122],["p","<b>Technique <\/b>Join the pad of the thumb to the upper joint creases of the index and middle fingers. Stretch the ring and little fingers upward.",122],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. It is one of the most common mudras used in <i>Pallavis<\/i> (“pure dance”). <i>Viniyoga<\/i>: <i>Kusuma-apachaye<\/i> (“plucking flowers”); <i>Mukta-srak-damnam-dharanam<\/i> (“wearing a necklace of pearls or flowers”); <i>Nagavalli-pradhanam<\/i> (“offering betel leaves”); <i>Kasturika-adivastunam<\/i>-<i>peshana <\/i> (“preparing paste for musk, etc.”); <i>Gandhavasana<\/i> (“to smell”); <i>Vachana<\/i> (“to speak”); <i>Drishti<\/i> (“glancing”).",122],["e","Katakamukha Mudra II",123],["i","i473.webp",123],["f",["English","“link in a chain”"],123],["f",["Devanagari","deva123.webp"],123],["f",["Transliteration","trans123.webp"],123],["p","<b>Description <\/b><i>Katakamukha Mudra II<\/i> is the twelfth hand gesture of the twentyeight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana<\/i>. According to mythology, this mudra originated from <i>Guha <\/i>when he practiced archery in front of <i>Shiva. <\/i>The associated sage is <i>Bhargava<\/i>, race is <i>Deva<\/i>, color is gold, and patron deity is <i>Raghu Rama<\/i>.",123],["p","<b>Technique <\/b>Join the tip of the thumb, index, and middle finger, keeping them extended and active. Tuck the ring and little finger into the palm.",123],["p","<b>Application <\/b>See <i>Katakamukha Mudra I<\/i>.",123],["p","<b>Note <\/b>This version is mentioned in the <i>Odissi Dance Pathfinder Vol. I.<\/i>24",123],["e","Katakamukha Mudra III",124],["i","i477.webp",124],["f",["English","“link in a chain”"],124],["f",["Devanagari","deva124.webp"],124],["f",["Transliteration","trans124.webp"],124],["p","<b>Description <\/b><i>Katakamukha Mudra III<\/i> is a single-hand gesture (<i>asamyukta <\/i> <i>hasta<\/i>) noted in the <i>Natya Shastra<\/i>. Like <i>Kataka<\/i>m<i>ukha Mudra I<\/i>, it is often used in <i>Pallavis<\/i> (“pure dance”).",124],["p","<b>Technique <\/b>Straighten the thumb and place the pad of the index finger on top of it. Point the middle finger downward, and stretch the ring and little fingers upward.",124],["p","<b>Application <\/b><i>Sara-madhya-akarshanam<\/i> (“drawing the arrow in the center of the bow”); holding a mirror, fanning, holding reins, breaking a twig, cleaning the teeth, plucking flowers, embracing, holding a disc, pulling a rope, and tucking or holding the loose end of a veil or a robe.",124],["e","Katakavardhana Mudra",125],["i","i481.webp",125],["f",["English","“link of increase”"],125],["f",["Devanagari","deva125.webp"],125],["f",["Transliteration","trans125.webp"],125],["p","<b>Description <\/b><i>Katakavardhana Mudra<\/i> is the ninth hand gesture of the twentyfour joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana.<\/i> It is also noted in the <i>Natya Shastra<\/i>. The patron deity associated with it is <i>Yaksharaja<\/i>.25",125],["p","<b>Technique <\/b>Form <i>Katakamukha Mudra I <\/i>(p.115) with each hand and cross at the wrists. Keep the gesture a hand’s distance away from your body.",125],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Pattabhisheke<\/i> (“coronation”); <i>Pujayam<\/i> (“ritual”); <i>Vivaha-ashishi<\/i> (“marriage blessings”). Additional usages denote: deliberation, erotic mood, pacification, certainty, and the dances known as <i>Jakkini-natana<\/i> and <i>Danda-lasya<\/i>.",125],["e","Ketaki Mudra",126],["i","i485.webp",126],["f",["English","“screw-pine tree”"],126],["f",["Devanagari","deva126.webp"],126],["f",["Transliteration","trans126.webp"],126],["p","<b>Description <\/b><i>Ketaki Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the dance tradition. In the <i>Abhinaya Darpana<\/i>, it is noted as one of the gestures that indicate “trees.”",126],["p","<b>Technique <\/b>Assume <i>Pataka Mudra<\/i> (p.186) with your left hand and <i>Chatura <\/i> <i>Mudra<\/i> (p.73) with your right hand. Cross the wrists and turn both palms to face upward.",126],["p","<b>Application <\/b>Used in the dance tradition to denote the flower of the screwpine tree.",126],["e","Ketu Mudra",127],["i","i489.webp",127],["f",["English","“dragon’s tail”"],127],["f",["Devanagari","deva127.webp"],127],["f",["Transliteration","trans127.webp"],127],["p","<b>Description <\/b><i>Ketu Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of the nine planets (<i>Nava-<\/i> <i>Graha Hastas<\/i>) as described in the <i>Abhinaya Darpana. <\/i>In Vedic astrology, <i>Ketu<\/i> is the Moon’s south (descending) node. <i>Ketu<\/i> is generally referred to as a “shadow” planet.",127],["p","<b>Technique <\/b>Assume <i>Suchi Mudra<\/i> (p.240) with your left hand and <i>Pataka <\/i> <i>Mudra <\/i>(p.186) with your right hand. Place your hands in front of your chest. Evoke a cruel gaze and mood.",127],["p","<b>Application <\/b>To denote the descending (south) lunar node, <i>Ketu<\/i>.",127],["e","Khatva Mudra",128],["i","i493.webp",128],["f",["English","“cot”"],128],["f",["Devanagari","deva128.webp"],128],["f",["Transliteration","trans128.webp"],128],["p","<b>Description <\/b><i>Khatva Mudra<\/i> is the twenty-second hand gesture of the twentyfour joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana.<\/i>",128],["p","<b>Technique <\/b>Join the pad of the thumb with the pads of the middle and ring fingers. Connect the two hands by joining the tips of thumbs, middle, and ring fingers at the center. Turn the hands palms up and extend the index and little fingers downward like the legs of a bed or cot. Hold the mudra at hip height.",128],["p","<b>Application <\/b>Used to denote a cot, a bed, or a bench. In dance, it is often used to show the sitting place of the various deities.",128],["p","<b>Note <\/b>In a variation of this mudra, the tips of the thumbs touch the base of the middle and ring fingers.",128],["e","Kilaka Mudra I",129],["i","i497.webp",129],["f",["English","“bond”"],129],["f",["Devanagari","deva129.webp"],129],["f",["Transliteration","trans129.webp"],129],["p","<b>Description <\/b><i>Kilaka Mudra I<\/i> is the sixteenth hand gesture of the twenty-four joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya Darpana.<\/i>",129],["p","<b>Technique <\/b>With each hand, fold the index, middle, and ring fingers into the palm and place the thumb on top. Interlock the little fingers at the top joint.",129],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Snehe<\/i> (“affection,” or “in love”); <i>Narmanulapa<\/i> (“lovers’ conversation”).",129],["e","Kilaka Mudra II",130],["i","i501.webp",130],["i","i501.webp",130],["f",["English","“bond”"],130],["f",["Devanagari","deva130.webp"],130],["f",["Transliteration","trans130.webp"],130],["p","<b>Description <\/b><i>Kilaka Mudra II<\/i> is a joint-hand mudra (<i>samyukta hasta<\/i>) commonly used to indicate the energy of intimacy and amorous relations. The version presented here is more commonly seen in the context of Japanese Tantric Buddhism.",130],["p","<b>Technique <\/b>Cross the wrists with the hands back to back. Hook the little fingers with the tips pointing upward. Join the thumb, index, and middle finger on each hand. Extend the ring fingers upward at about a 45-degree angle.",130],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the heart. Relax the throat, chest, and belly. Breathe naturally and hold for 5 to 45 minutes.",130],["p","<b>Benefits <\/b>Tonifies the Water Element in the body, improves the function of the kidneys, bladder, and sexual glands, fosters a sense of emotional safety and comfort around intimacy and sexuality, can also be used as a devotional gesture to express or evoke the union of masculine (<i>Shiva<\/i>) and feminine (<i>Shakti<\/i>).26",130],["e","Kirita Mudra",131],["i","i505.webp",131],["f",["English","“crown”"],131],["f",["Devanagari","deva131.webp"],131],["f",["Transliteration","trans131.webp"],131],["p","<b>Description <\/b><i>Kirita Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the dance tradition.",131],["p","<b>Technique <\/b>With both palms facing forward, connect the pads of the thumbs. The fingers of one hand will cover those of the other.",131],["p","<b>Application <\/b>Used in the dance tradition to denote a crown (or a king) when placed above the head.",131],["e","Kubera Mudra I",132],["i","i509.webp",132],["f",["English","“god of wealth”"],132],["f",["Devanagari","deva132.webp"],132],["f",["Transliteration","trans132.webp"],132],["p","<b>Description <\/b><i>Kubera Mudra I<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of sixteen<i> Deva Hastas<\/i>, denoting Hindu gods and goddesses as described in the <i>Abhinaya Darpana<\/i>. It indicates the form and character of the Hindu deity <i>Kubera<\/i>.",132],["p","<b>Technique <\/b>Assume <i>Alapadma Mudra <\/i>(p.41) with your left hand and <i>Mushti <\/i> <i>Mudra<\/i> (p.163) with your right hand. Hold your hands about 6 inches in front of your body.",132],["p","<b>Application <\/b>Used to indicate <i>Kubera<\/i>, the Hindu god of wealth.",132],["p","<b>Note <\/b>There are several combinations of mudras used to express the various traits and emblems of <i>Kubera Deva<\/i>. The gesture indicated here appears to be the most common.",132],["e","Kubera Mudra II",133],["i","i513.webp",133],["f",["English","“god of wealth”"],133],["f",["Devanagari","deva133.webp"],133],["f",["Transliteration","trans133.webp"],133],["p","<b>Description <\/b><i>Kubera Mudra II<\/i> is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the Hindu tradition. It is used to create abundance, to evoke blessings from the “god of wealth,” and to symbolize the northern direction. <i>Kubera<\/i> is known in the Buddhist tradition as <i>Vaishravana<\/i>, chief of the Four Heavenly Kings.",133],["p","<b>Technique <\/b>Join the tips of the thumb, index, and middle finger. Curl the ring and little fingers into the palm.",133],["p","<b>Application <\/b>In a comfortable seated position, form the mudra with each hand, resting the hands in your lap, palms up. Soften the belly and breathe naturally. Focus on what you would like to attract more of in your life. Feel the mudra serving as a magnet, helping you manifest your desires. Hold for 5 to 45 minutes.",133],["p","<b>Benefits <\/b>Clears the frontal sinuses and helps to balance left and right nostrils, improves sense of smell, sharpens “inner vision” and ability to more clearly see your path in life, helps create abundance, especially related to virtuous desires that take into consideration the welfare of all beings.",133],["e","Kurma Mudra I",134],["i","i517.webp",134],["f",["English","“tortoise”"],134],["f",["Devanagari","deva134.webp"],134],["f",["Transliteration","trans134.webp"],134],["p","<b>Description <\/b><i>Kurma Mudra I<\/i> is the eighteenth hand gesture of the twenty-four joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya Darpana.<\/i>",134],["p","<b>Technique <\/b>Place your right palm across your left palm. Bend the index, middle, and ring fingers of each hand, lightly clasping the other hand. Keep the little fingers and thumbs of both hands extended outward.",134],["p","<b>Application <\/b>Denotes a tortoise, known in Hindu mythology as the second incarnation (“<i>avatara<\/i>”) of <i>Vishnu<\/i>. To convey the movement of the tortoise, move your wrists back and forth.",134],["e","Kurma Mudra II",135],["i","i521.webp",135],["f",["English","“tortoise”"],135],["f",["Devanagari","deva135.webp"],135],["f",["Transliteration","trans135.webp"],135],["p","<b>Description <\/b><i>Kurma Mudra II<\/i> is a less common variation of the eighteenth hand gesture of the twenty-four joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>.",135],["p","<b>Technique <\/b>With each hand, fold the index, middle, and ring fingers into the palm. Extend the thumbs and little fingers away from each other. Join the two hands together as mirror images with the right on top of the left. The tips of the little fingers and thumbs touch, and the knuckles press together firmly.",135],["p","<b>Application <\/b>See <i>Kurma Mudra I<\/i>.",135],["e","Kurma Mudra III",136],["i","i525.webp",136],["f",["English","“tortoise”"],136],["f",["Devanagari","deva136.webp"],136],["f",["Transliteration","trans136.webp"],136],["p","<b>Description <\/b><i>Kurma Mudra III <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition where it represents one of the auspicious forms <i>Vishnu<\/i> assumed to benefit humanity. It is found in the Y<i>oga Tattva <\/i> <i>Mudra Vijnana<\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the nineteenth gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>. The mudra is unique energetically in that it forms a triangular relationship between Air, Water, and Fire Elements, which serves to harmonize <i>ojas<\/i>, <i>tejas<\/i>, and <i>prana<\/i> in the body (see Appendix A).",136],["p","<b>Technique <\/b>Turn the left palm up, folding the middle, ring, and little fingers into the palm. Extend the thumb and index finger. Turn the right palm down, folding the middle and ring fingers into the palm. Extend the thumb, index, and little finger. Rest the right hand on top of the left. Join the right index with the left thumb, and the right little finger with the left index. The right thumb rests against the base of the left thumb, near the wrist.",136],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of your solar plexus (below the sternum). Soften your belly, chest, and shoulders. Breathe naturally, settling into relaxed stillness. Hold for 5 to 45 minutes.",136],["p","<b>Benefits <\/b>Activates the body’s self-healing power, balances the immune system (reducing the negative effects of hypo- or hyper-immunity), harmonizes the relationship between the heart (Fire) and the kidneys (Water).",136],["p","<b>Note <\/b>According to the yogic tradition, it is said that <i>Kurma Mudra <\/i>can be used for assisting the healing of major diseases, especially cancer.",136],["e","Kuruvaka Mudra",137],["i","i529.webp",137],["f",["English","“henna plant”"],137],["f",["Devanagari","deva137.webp"],137],["f",["Transliteration","trans137.webp"],137],["p","<b>Description <\/b><i>Kuruvaka Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the dance tradition. In the<i> Abhinaya Darpana<\/i>, it is noted as one of the gestures that indicate “trees.”",137],["p","<b>Technique <\/b>Assume <i>Tripataka Mudra<\/i> (p.253) with your right hand and <i>Kartarimukha Mudra I <\/i>(p.115) with your left hand. Both hands are held in front of the chest, palms facing outward.",137],["p","<b>Application <\/b>Used in the dance tradition to denote the henna plant.",137],["e","Lakshmi Mudra",138],["i","i537.webp",138],["f",["English","“goddess of fortune, wealth, and grace”"],138],["f",["Devanagari","deva138.webp"],138],["f",["Transliteration","trans138.webp"],138],["p","<b>Additional Name<\/b><i> Mahalakshmi<\/i>",138],["p","<b>Description <\/b><i>Lakshmi Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of sixteen <i>Deva Hastas<\/i>, denoting Hindu gods and goddesses as described in the <i>Abhinaya Darpana. <\/i> It indicates the form and character of the Hindu deity <i>Lakshmi<\/i>.",138],["p","<b>Technique <\/b>Form <i>Kapittha Mudra <\/i>(p.106) with each hand, holding the hands near the shoulders.",138],["p","<b>Application <\/b>Used to indicate <i>Lakshmi<\/i>, the Hindu goddess of wealth, prosperity (both material and spiritual), light, wisdom, fortune, fertility, generosity, and courage; and the embodiment of beauty, grace, and charm. She is the consort of <i>Vishnu<\/i>.",138],["p","<b>Note <\/b>There are several combinations of mudras used to express the various traits and emblems of <i>Lakshmi Devi<\/i>. The gesture indicated here appears to be the most common.",138],["e","Linalapadma Mudra",139],["i","i544.webp",139],["f",["English","“bees clinging to the lotus flower”"],139],["f",["Devanagari","deva139.webp"],139],["f",["Transliteration","trans139.webp"],139],["p","<b>Description <\/b><i>Linalapadma Mudra <\/i>is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the dance tradition. In the <i>Abhinaya Darpana<\/i>, it is noted as one of the gestures that indicate “flying creatures.”",139],["p","<b>Technique <\/b>Touch the tip of the little finger to the palm. Extend the thumb and remaining fingers outward and maintain space between them.",139],["p","<b>Application <\/b>Used in the dance tradition to denote the curlew bird, or a blossoming flower attracting bees.",139],["p","<b>Note <\/b>This mudra is similar to <i>Alapadma<\/i> and <i>Baka<\/i>.",139],["e","Linga Mudra",140],["i","i548.webp",140],["f",["English","“phallus,” “divine masculine,” or “cosmic consciousness”"],140],["f",["Devanagari","deva140.webp"],140],["f",["Transliteration","trans140.webp"],140],["p","<b>Description <\/b><i>Linga Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana<\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the seventh gesture in the sub-set of eight mudras practiced after meditation or recitation of the <i>Gayatri Mantra<\/i>.",140],["p","<b>Technique <\/b>Interlock the fingers of both hands with the left index finger on top. Extend the right thumb straight up. Join the tips of the left thumb and index finger, forming a circle around the extended thumb.",140],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the abdomen. Relax the chest, belly, and throat. Breathe naturally. Hold for 5 to 45 minutes.",140],["p","<b>Benefits <\/b>Warms the body, relieves cold and flu symptoms, reduces lethargy and laziness, increases self-confidence and willpower.",140],["e","Lolita Mudra",141],["i","i552.webp",141],["f",["English","“moved hither and thither”"],141],["f",["Devanagari","deva141.webp"],141],["f",["Transliteration","trans141.webp"],141],["p","<b>Description <\/b><i>Lolita Mudra <\/i>is a single-hand gesture (<i>asamyukta hasta<\/i>) noted in the <i>Abhinaya Chandrika<\/i>. It is similar to <i>Dola Mudra<\/i> but performed with a single hand rather than two hands.",141],["p","<b>Technique <\/b>Relax your wrist, letting the hand drop. The hand sways gently resembling a swing with the movement of walking or dancing.",141],["p","<b>Application <\/b>Used to denote the graceful movement of women. Expresses grace, beauty, young women, etc. To accentuate the grace and sensual nuance of <i>Pallavi<\/i>s (“pure form”) dances, the performer will often use <i>Lolita Mudra <\/i> while depicting a female character. Often held low by one’s side while relaxing the shoulder and arm.",141],["e","Madhyapataka Mudra",142],["i","i556.webp",142],["f",["English","“middle flag”"],142],["f",["Devanagari","deva142.webp"],142],["f",["Transliteration","trans142.webp"],142],["p","<b>Description <\/b><i>Madhyapataka Mudra <\/i>is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the dance tradition. In the <i>Abhinaya Darpana<\/i>, it is noted as one of the gestures that indicate “wild animals.”",142],["p","<b>Technique <\/b>Fold the little finger toward the palm and extend the remaining fingers upward.",142],["p","<b>Application <\/b>Used in the dance tradition to denote a dog. When used with both hands connected at the wrist, this mudra denotes the open mouth of a crocodile.",142],["e","Mahakranta Mudra",143],["i","i560.webp",143],["f",["English","“supreme power”"],143],["f",["Devanagari","deva143.webp"],143],["f",["Transliteration","trans143.webp"],143],["p","<b>Description <\/b><i>Mahakranta Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the twenty-second gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>.",143],["p","<b>Technique <\/b>Raise the hands to the height of the face. With the elbows pointing down, turn the palms toward the face. Keep the hands about shoulder width apart.",143],["p","<b>Application <\/b>Sit in a quiet place, facing east (preferably at sunrise). Relax the shoulders and raise the hands into position. Feel your hands become soft and warm. Visualize the light of the rising sun shining upon your body. Imagine that this warm light radiates through your palms into your face, filling your body with light from head to toe.",143],["p","<b>Benefits <\/b>Activates the body’s self-healing capacity, strengthens the immune system, assists the healing of serious diseases such as cancer, evokes feelings of devotion and surrender.",143],["e","Mahashirsha Mudra",144],["i","i564.webp",144],["f",["English","“great head”"],144],["f",["Devanagari","deva144.webp"],144],["f",["Transliteration","trans144.webp"],144],["p","<b>Description <\/b><i>Mahashirsha Mudra<\/i> is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the yoga tradition. It is used to relieve tension and balance the body’s various energies.",144],["p","<b>Technique <\/b>Join the tips of the index and middle fingers together with the thumb. Curl the ring finger down into the palm of the hand and extend the little finger.",144],["p","<b>Application <\/b>In a comfortable seated position, form the mudra with each hand, resting the hands in the lap, palms up. Place the tip of the tongue on the upper palate. Relax the eyes, lips, and throat. Breathe naturally, resting your attention lightly on the navel. Hold for 5 to 20 minutes.",144],["p","<b>Benefits <\/b>Relieves headaches, reduces tension in the eyes, breaks up congestion in the frontal sinuses, improves mental clarity.",144],["p","<b>Note <\/b>For chronic headaches, practice three shorter sessions of 5 to 10 minutes throughout the day. You may also practice the mudra lying down, followed by a brisk walk.",144],["e","Mahatrika Mudra",145],["i","i568.webp",145],["f",["English","“great sacrum,” “triangular,” or “trinity”"],145],["f",["Devanagari","deva145.webp"],145],["f",["Transliteration","trans145.webp"],145],["p","<b>Description <\/b><i>Mahatrika Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used in the yoga tradition to activate the healing energy of the pelvic area. This gesture works with the relationship between the Elements of Water (little finger), Fire (thumb), and Earth (ring finger) to harmonize the related organ systems inside the body.",145],["p","<b>Technique <\/b>With the palms of both hands facing each other, join the tips of the ring fingers. Then, touch the tips of the thumbs and little fingers, forming two rings. When performed correctly, the mudra resembles the bony structure of the human pelvis (as if looking from above down into the pelvic bowl).",145],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the pubic bone. Soften the pelvic floor, belly, and chest. Place the tip of the tongue lightly against the upper palate. Breathe naturally. Hold for 5 to 45 minutes. To increase the healing potential of this mudra, practice 2 to 3 shorter sessions per day.",145],["p","<b>Benefits <\/b>Reduces menstrual cramping, regulates menstrual cycle, relieves pelvic congestion and constipation, benefits the prostate and bladder, aids the healing of hemorrhoids, assists the release of past emotions related to unconscious sex or sexual abuse.",145],["e","Makara Mudra I",146],["i","i572.webp",146],["f",["English","“crocodile”"],146],["f",["Devanagari","deva146.webp"],146],["f",["Transliteration","trans146.webp"],146],["p","<b>Description <\/b><i>Makara Mudra I<\/i> is a joint-hand dance gesture (<i>samyukta hasta<\/i>) noted in the <i>Natya Shastra <\/i>and in the<i> Abhinaya Darpana. <\/i>The patron deity associated with it is<i> Mahendra<\/i>.27",146],["p","<b>Technique <\/b>Palms facing downward, form <i>Ardhachandra Mudra <\/i>(p.48) with each hand and cross the wrists. Thumbs move in circular motion.",146],["p","<b>Application <\/b>Used to denote the sea, flow of the river, prosperity, solidarity, platform, crocodile, shark, fish, lion, tiger, elephant, and deer.",146],["e","Makara Mudra II",147],["i","i576.webp",147],["f",["English","“crocodile” or “mythical sea creature”"],147],["f",["Devanagari","deva147.webp"],147],["f",["Transliteration","trans147.webp"],147],["p","<b>Description <\/b><i>Makara Mudra II<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used in the yoga tradition to symbolize water and fertility, and as a way to access the hidden mystical power of the Water Element. In Hindu and Buddhist art and architecture, <i>Makara<\/i> is considered an auspicious symbol, which represents the confluence of the <i>Ganga<\/i> and <i>Varuna<\/i> rivers, the sign of Capricorn, and the emblem of <i>Kama<\/i>, the god of love. This mythological sea creature can be seen carved in the cross bars of temples and monuments such as the <i>Great <\/i> <i>Stupa at Sanchi<\/i>.28",147],["p","<b>Technique <\/b>Join the tips of the thumb and ring finger of your left hand. Insert the right thumb into the web between the left little and ring fingers, resting the tip of the right thumb at the base of the left thumb. Hold the right palm against the back of your left hand.",147],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the navel. Soften the belly and adjust your breathing to be slow, smooth, and deep. Feel the navel rising with the inhalation and descending with the exhalation. Expand your attention to include your lower back. Feel your kidneys and adrenal glands. Visualize an ocean of deep blue water there. Imagine that the power of this water is nourishing your kidneys and your entire body. Hold for 5 to 45 minutes.",147],["p","<b>Benefits <\/b>Improves memory, strengthens the kidneys, benefits the sexual organs, helps to relieve low back pain, nourishes the hair, restores energy reserves.",147],["e","Mandala Mudra",148],["i","i580.webp",148],["f",["English","“circular,” “complete orbit,” “essential ground,” or “circling the center”"],148],["f",["Devanagari","deva148.webp"],148],["f",["Transliteration","trans148.webp"],148],["p","<b>Additional Name <\/b><i>Tantra Linga<\/i> Front view",148],["p","<b>Description <\/b><i>Mandala Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the traditions of Indian Tantrism and <i>Vajrayana<\/i> Buddhism. It is a ritual gesture representing a complete picture of the universe with Mount Meru29 in the center and the four directions all around. It also symbolizes the ground of all creation, and the manifestation of specific deities such as <i>Tara <\/i> (in the context of Tantric Buddhism).",148],["p","<b>Technique <\/b>With the palms facing up, cross the little fingers and hold them down firmly with the thumbs. Cross the middle fingers and extend them straight. Hook the middle fingers with the index and root them down toward the palm. Press the backs of the ring fingers together, pointing them straight up.",148],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the",148],["i","i582.webp",148],["p","solar plexus (below the sternum). Lengthen the spine and relax the shoulders. Tuck the chin toward the chest gently, lengthening the back of the neck. Breathe naturally. Looking down, lightly focus your gaze on the tips of the extended ring fingers. You are looking at a symbolic model of the whole universe. Feeling the sincere wish for the welfare of all beings, offer this mandala to the limitless compassion — Top view residing in the center of your own heart—your own Original Nature. Rest in this contemplation for 5 to 45 minutes.",149],["p","<b>Benefits <\/b>Awakens supreme devotion and enlightened attitude, improves concentration, evokes insight into the transitory nature of all things, serves as a physical expression of our own Original Nature.",149],["e","Manipura Chakra Mudra",150],["i","i588.webp",150],["f",["English","“filled with jewels”"],150],["f",["Devanagari","deva150.webp"],150],["f",["Transliteration","trans150.webp"],150],["p","<b>Description <\/b><i>Manipura Chakra Mudra<\/i> is a complex joint-hand gesture (<i>samyukta hasta<\/i>) found in the yoga tradition and in esoteric Japanese martial arts. It relates to the <i>Manipura Chakra <\/i>(the navel center) in Indian Tantrism.",150],["p","<b>Technique <\/b>With both palms facing down, extend the index finger of the left hand and lift the left middle finger a little. Place the right index on top of the left index, slide it under the right middle finger, and rest the pad on top of the left ring finger. Bend the left middle finger down and curl the right middle finger over the top of the left index, so the two middle fingers sit side by side, and the tip of the left index finger sits on top of the right ring finger. Extend and join the tips of the thumbs, middle, and little fingers.",150],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the solar plexus. Imagine a glowing ball of golden-red light in your belly. Rest in stillness and breathe naturally. Hold for 5 to 30 minutes.",150],["p","<b>Benefits <\/b>Strengthens digestion, improves the health of the liver, gall bladder, spleen, stomach, pancreas, and small and large intestine, bolsters willpower, improves martial ability, increases personal magnetism.",150],["e","Manmatha Mudra",151],["i","i592.webp",151],["f",["English","“god of love and passion” or “churner of hearts”"],151],["f",["Devanagari","deva151.webp"],151],["f",["Transliteration","trans151.webp"],151],["p","<b>Additional names <\/b><i>Kamadeva<\/i>, <i>Makaradhwaja<\/i>, <i>Manasija<\/i>, <i>Pushpabana<\/i>, <i>Madana<\/i>",151],["p","<b>Description <\/b><i>Manmatha Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of sixteen <i>Deva <\/i> <i>Hastas<\/i>, denoting Hindu gods and goddesses as described in the <i>Abhinaya <\/i> <i>Darpana.<\/i> It indicates the form and character of the Hindu deity <i>Manmatha<\/i>. He is most commonly depicted holding a bow and arrow, as he is known for shooting the five flower-arrows of sensual desire, intoxicating his “victims” with uncontrollable love and passion.",151],["p","<b>Technique <\/b>Assume <i>Shikhara Mudra <\/i>(p.225) with your left hand and <i>Katakamukha Mudra III <\/i>(p.122) with your right hand. Hold the hands either across from each other, or with the left arm stretched obliquely to your left at shoulder height, and the right hand held by the right shoulder as if shooting an arrow.",151],["p","<b>Application <\/b>Used to indicate <i>Manmatha<\/i>, the Hindu god of love and passion.",151],["p","<b>Note <\/b>There are several combinations of mudras used to express the various traits and emblems of <i>Manmatha Deva<\/i>. The one indicated here appears to be the most common.",151],["e","Matangi Mudra",152],["i","i596.webp",152],["f",["English","“<i>devi<\/i> of inner harmony” or “guardian of outsiders and misfits”"],152],["f",["Devanagari","deva152.webp"],152],["f",["Transliteration","trans152.webp"],152],["p","<b>Description <\/b><i>Matangi Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used in yoga and Indian Tantrism to evoke the power of <i>Devi Matangi<\/i>, one of the ten <i>Mahavidyas<\/i>, or manifestations of the Divine Mother. <i>Matangi<\/i> is said to be the guardian of misfits and outsiders, who frowns upon the orthodox system of castes and the hypocrisy of society’s high culture.",152],["p","<b>Technique <\/b>Interlace the fingers of both hands. Extend the middle fingers straight up, with the pads of the two fingers touching. Form two rings with the index fingers and thumbs of both hands.",152],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the solar plexus. Lengthen the spine, and relax the chest and belly. Adjust your breathing to be slow, smooth, and deep. Use your inner power of discrimination to see through all the trappings of chasing status and position. In the silence of your own heart, release all contrivance and return to your original innocence. Hold for 5 to 45 minutes.",152],["p","<b>Benefits <\/b>Facilitates diaphragmatic breathing, benefits the abdomen and abdominal organs of digestion, assimilation, and elimination, activates the power of spirit, improves discernment and self-honesty, improves the voice and ability to communicate inner feelings.",152],["e","Matri Mudra",153],["i","i600.webp",153],["f",["English","“mother”"],153],["f",["Devanagari","deva153.webp"],153],["f",["Transliteration","trans153.webp"],153],["p","<b>Description <\/b><i>Matri Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of the eleven relationships (<i>Bandava Hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>. It indicates mother.",153],["p","<b>Technique <\/b>Assume <i>Ardhachandra Mudra<\/i> (p.48) with your left hand and <i>Samdamsha Mudra<\/i> (p.206) with your right hand. The left hand can be placed on the stomach indicating <i>Stri<\/i> (woman), which can mean daughter or mother, depending on the context.",153],["p","<b>Application <\/b>This gesture denotes mother or daughter.",153],["e","Matsya Mudra I",154],["i","i604.webp",154],["f",["English","“fish”"],154],["f",["Devanagari","deva154.webp"],154],["f",["Transliteration","trans154.webp"],154],["p","<b>Description <\/b><i>Matsya Mudra I<\/i> is the seventeenth hand gesture of the twentyfour joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana.<\/i>",154],["p","<b>Technique <\/b>Place the right palm over the back your left hand, both palms facing downward. Keep all fingers collected, while extending the thumbs to the sides.",154],["p","<b>Application <\/b>This mudra denotes a fish. Move your thumbs in circles to create a wave-like motion to express the movement of swimming. <i>Matsya<\/i> is known in the Hindu tradition as the first incarnation (“<i>avatara<\/i>”) of <i>Vishnu<\/i>.",154],["p","<b>Note <\/b>This mudra resembles <i>Makara Mudra<\/i>.",154],["e","Matsya Mudra II",155],["i","i608.webp",155],["f",["English","“fish”"],155],["f",["Devanagari","deva155.webp"],155],["f",["Transliteration","trans155.webp"],155],["p","<b>Description <\/b><i>Matsya Mudra II<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition where it symbolizes one of the auspicious forms<i> Vishnu <\/i> assumed to benefit humanity. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudra<\/i>s, specifically the eighteenth gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra.<\/i>",155],["p","<b>Technique <\/b>Place your right palm over the back of your left hand, both palms facing downward. Keep all fingers collected, while extending the thumbs to the sides.",155],["p","<b>Application <\/b>In a comfortable seated position, lengthen the spine and relax the chest, shoulders, and belly. Hold the mudra in front of the abdomen and breathe naturally. Hold for 5 to 30 minutes.",155],["p","<b>Benefits <\/b>Activates the body’s self-healing potential, increases suppleness, improves concentration, generates feelings of devotion and compassion.",155],["e","Mayura Mudra I",156],["i","i612.webp",156],["f",["English","“peacock”"],156],["f",["Devanagari","deva156.webp"],156],["f",["Transliteration","trans156.webp"],156],["p","<b>Additional Name <\/b><i>Vajrapataka<\/i>",156],["p","<b>Description <\/b><i>Mayura Mudra I<\/i> is the fifth hand gesture of the twenty-eight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>. The name <i>Vajrapataka Mudra <\/i>is common to the Hindu tradition and it denotes the <i>vajra<\/i> (thunderbolt, weapon of <i>Indra<\/i>).",156],["p","<b>Technique <\/b>Raise the hand, palm facing forward, fingers collected and extended upward. Maintain active fingers and a flat palm. Join the tips of the ring finger and the thumb.",156],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Mayurasyam<\/i> (“peacock beak”); <i>Latayancha<\/i> (“creeper vine”); <i>Shakuna<\/i> (“bird of omen”); <i>Vamana <\/i> (“vomiting”); <i>Alakashya-apanayana<\/i> (“stroking the hair” or “decorating the forehead”); <i>Lalata-tilakam-shucha<\/i> (“placing <i>tilak<\/i>30 on the forehead”); <i>Nadi-<\/i> <i>udakasya-niksheypam<\/i> (“sprinkling holy water over the head”); <i>Shastra-vada <\/i> (“discussing the <i>shastras<\/i>”); <i>Prasidhaka<\/i> (“renown”).",156],["e","Mayura Mudra II",157],["i","i616.webp",157],["f",["English","“peacock”"],157],["f",["Devanagari","deva157.webp"],157],["f",["Transliteration","trans157.webp"],157],["p","<b>Description <\/b>This variation of <i>Mayura Mudra<\/i> is a joint-hand gesture (<i>samyukta <\/i> <i>hasta<\/i>) used in the dance tradition to depict a peacock.",157],["p","<b>Technique <\/b>Raise your left hand by your chest; palm faces outward, fingers spread wide to resemble the open tail of a peacock. Place your right hand in front of your left, forming<i> Mayura Mudra I<\/i> or <i>Kapittha Mudra<\/i> (p.106)<i>.<\/i>",157],["p","<b>Application <\/b>Used in the dance tradition to depict a peacock, an iconographic symbol of immortality and love in Indian tradition.",157],["e","Meshayudha Mudra",158],["i","i620.webp",158],["f",["English","“mighty deed” or “sheep fighting”"],158],["f",["Devanagari","deva158.webp"],158],["f",["Transliteration","trans158.webp"],158],["p","<b>Description <\/b><i>Meshayudha Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) noted in the <i>Abhinaya Chandrika<\/i>.",158],["p","<b>Technique <\/b>Form <i>Mushti Mudra <\/i>(p.163) with each hand, pressing the knuckles of the two hands together.",158],["p","<b>Application <\/b>Used in the dance tradition to illustrate struggle, war, forceful actions, or fighting between two entities.",158],["e","Milita Ardhapataka Mudra",159],["i","i624.webp",159],["f",["English","“joint half-flag”"],159],["f",["Devanagari","deva159.webp"],159],["f",["Transliteration","trans159.webp"],159],["p","<b>Description <\/b><i>Milita Ardhapataka Mudra <\/i>is a joint-hand gesture (<i>samyukta <\/i> <i>hasta<\/i>) mentioned in the <i>Odissi Dance Pathfinder Vol. II<\/i>.",159],["p","<b>Technique <\/b>Form <i>Ardhapataka Mudra <\/i>(p.50) with each hand, joining the tips of the index and middle fingers of the two hands. Hold one hand facing upward, the other downward.",159],["p","<b>Application <\/b>This mudra is used in a common <i>chari<\/i> (transitional phrase) known as <i>Kutana. <\/i>Alternate the hands from downward facing to upward facing while dancing.",159],["e","Mrigashirsha Mudra",160],["i","i628.webp",160],["f",["English","“deer head”"],160],["f",["Devanagari","deva160.webp"],160],["f",["Transliteration","trans160.webp"],160],["p","<b>Additional Name<\/b><i> Chandra-mriga<\/i>",160],["p","<b>Description <\/b><i>Mrigashirsha Mudra<\/i> is the seventeenth hand gesture of the twenty-eight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>. It is also noted in the <i>Natya Shastra<\/i>. According to mythology, this mudra originated from <i>Gauri<\/i>,31 when she drew three lines on her forehead while practicing <i>tapas<\/i>32 to attract S<i>hiva’<\/i>s attention. The associated sage is <i>Markandeya<\/i>, race is <i>Rishi<\/i>, color is white, and patron deity is <i>Maheshvara<\/i>.",160],["p","<b>Technique <\/b>Raise your hand to face away from your body. Bend the ring, middle, and index fingers down 90 degrees to the palm, extend the little finger and thumb straight up.",160],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Strinam-artha<\/i> (“women’s reproductive organs”); <i>Kapoola<\/i> (“cheek”); <i>Maryadayoh<\/i> (“traditional manners” or “limit”); <i>Bhityam<\/i> (“fear”); <i>Vivadam<\/i> (“argument”); <i>Nepathya<\/i> (“costume and make-up”); <i>Ahwane<\/i> (“calling” or “residence”); <i>Tripundraka<\/i> (drawing three lines on forehead”); <i>Mriga-mukha<\/i> (“deer face”); <i>Rangavalayam<\/i> (“decorating the ground with patterns”); <i>Pada-samvahanam<\/i> (“foot massage”); <i>Sarvasammelane <\/i> <i>Karya<\/i> (“gathering all”); <i>Mandire<\/i> (“house”); <i>Chatra-dharana<\/i> (“holding an umbrella”); <i>Sopane<\/i> (“stairs”); <i>Padvinyasa<\/i> (“movement of the feet”); <i>Priya-<\/i> <i>ahvana<\/i> (“inviting the beloved”); <i>Samchara<\/i> (“roaming”). Additional usages denote: wall, deliberation, opportunity, screen, order, and body.",160],["e","Mritsamjivani Mudra",161],["i","i632.webp",161],["f",["English","“lifesaving gesture”"],161],["f",["Devanagari","deva161.webp"],161],["f",["Transliteration","trans161.webp"],161],["p","<b>Additional Name <\/b><i>Apana Vayu<\/i>",161],["p","<b>Description <\/b><i>Mritsamjivani Mudra <\/i>is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the <i>Yoga Tattva Mudra Vijnana<\/i> form. It is used in the yoga tradition to benefit the heart, and as first aid for acute heart problems.",161],["p","<b>Technique <\/b>Place the index finger against the base of the thumb. Lightly join the tips of the middle and ring fingers with the tip of the thumb. Extend the little finger.",161],["p","<b>Application <\/b>In a comfortable seated position, form the mudra with each hand and rest the hands lightly on the thighs. Adjust your breathing to become slow and silent. Feel the chest and abdomen become soft and spacious. Hold for 5 to 45 minutes.",161],["p","<b>Benefits <\/b>Strengthens the heart and pericardium, regulates blood pressure, improves circulation and the health of arteries and veins, awakens the spirit of self-care and self-reflection, serves as a reminder to slow down and nurture body, mind, and spirit.",161],["p","<b>Note <\/b>To aid recovery of chronic heart disease, and generally to increase the self-healing effects of this mudra, practice 2 to 3 sessions per day for a period of 100 days. In case of acute heart trouble, <i>Mritsamjivani Mudra <\/i>may be used as temporary support while awaiting help from an authorized medical professional.",161],["e","Mudgara Mudra",162],["i","i636.webp",162],["f",["English","“hammer-like weapon” or “club of Hanuman”"],162],["f",["Devanagari","deva162.webp"],162],["f",["Transliteration","trans162.webp"],162],["p","<b>Additional Name <\/b><i>Mugdharam<\/i>",162],["p","<b>Description <\/b><i>Mudgara Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the twenty-third gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>.",162],["p","<b>Technique <\/b>Place the left palm under the right side of the chest. Form a fist with the right hand, resting the right elbow in the palm of the left hand. Keep the right forearm vertical.",162],["p","<b>Application <\/b>In a comfortable seated position, relax the shoulders and breathe naturally. Imagine you are holding a weapon that defeats all your “inner demons” and reveals your true grace and talent. Hold for 5 to 30 minutes.",162],["p","<b>Benefits <\/b>Increases courage, virtue, and loyalty, stimulates the immune system, activates the body’s self-healing power, and, according to the yoga tradition, facilitates the healing of major diseases such as cancer.",162],["e","Mukula Mudra",163],["i","i640.webp",163],["f",["English","“bud” or “closed”"],163],["f",["Devanagari","deva163.webp"],163],["f",["Transliteration","trans163.webp"],163],["p","<b>Additional Name <\/b><i>Sukri<\/i>",163],["p","Image I",163],["p","<b>Description <\/b><i>Mukula Mudra <\/i>is the twenty-sixth hand gesture of the twentyeight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana<\/i>. It is also noted in the <i>Natya Shastra. <\/i>According to mythology, this mudra originated from the monkey-god<i> Hanuman<\/i> when he attempted to seize the sun from the sky, mistaking it for a ripe <i>bimba<\/i> fruit. The associated sage is <i>Visakhila<\/i>, race is <i>Sankirna<\/i>, color is white, and patron deity is <i>Chandra<\/i>, the moon.",163],["p","<b>Technique <\/b>Variation 1: Join the tips of all five fingers (Image I). Variation 2: Bring the tips of all the fingers close together without touching (Image II)",163],["p","<b>Application <\/b>Primarily used by performing",163],["i","i642.webp",163],["p","artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: — <i>Kumudha <\/i> — (“water-lily”); <i>Bhoojana<\/i> (“eating”); <i>Pancha-bhana<\/i> (“five flower arrows of the god of love”); <i>Mudra-<\/i> <i>adi-dharana<\/i> (“holding a seal”); <i>Nabhi <\/i> (“navel”); <i>Kadli-pushspa<\/i> (“plantain flower”). Additional usages denote: charity, prayer, humbleness, lotus bud, self, life, passion, kissing children, folding an umbrella, and Image II — accepting fruit.",163],["e","Muladhara Mudra",164],["i","i646.webp",164],["f",["English","“root support”"],164],["f",["Devanagari","deva164.webp"],164],["f",["Transliteration","trans164.webp"],164],["p","<b>Description <\/b><i>Muladhara Mudra<\/i> is a lesser-known joint-hand mudra (<i>samyukta <\/i> <i>hasta<\/i>) used in Tantric Yoga and esoteric Japanese martial arts. It is related to the <i>Muladhara Chakra <\/i>(root center, the energy center at the base of the spine) in the Indian Tantric tradition.",164],["p","<b>Technique <\/b>Turn both palms to face upward. Interlace the little and ring fingers of both hands, so that the fingers fold inward toward the palms. Extend the middle fingers, joining them at the tips. Join the tips of the index fingers and thumbs of both hands, forming two interlocking rings.",164],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in the lap, in front of the pubic bone. Relax the belly and breathe naturally. Bring your attention to the perineum, located between the genitals and anus. Begin to contract and release the musculature of the pelvic floor and anus at about one contraction per second. Rest when you feel tired. Practice 2 to 3 sessions per day, increasing the duration of your sessions as your strength improves.",164],["p","<b>Benefits <\/b>Improves elimination of waste, tones the muscles and organs of the pelvis, heals incontinence and hemorrhoids, increases sexual hormone production, increases fertility, creates stability and centeredness.",164],["p","<b>Note <\/b>For women, the ideal point of contraction is located more deeply inside the vaginal canal, near the cervix. To develop sensitivity, and confirm you are contracting the correct area, gently insert one finger into the vagina as far as it will go. Then, contract the vaginal muscles in and upward against your finger multiple times.",164],["e","Mushti Mudra I",165],["i","i650.webp",165],["f",["English","“fist”"],165],["f",["Devanagari","deva165.webp"],165],["f",["Transliteration","trans165.webp"],165],["p","<b>Description <\/b><i>Mushti Mudra I<\/i> is the ninth hand gesture of the twenty-eight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>. It is also noted in the <i>Natya Shastra<\/i>. According to mythology, this mudra originated from <i>Vishnu<\/i>, who used <i>Mushti Mudra<\/i> while fighting with the demon <i>Madhu<\/i>. The associated sage is <i>Indra<\/i>, race is <i>Shudra<\/i>, color is indigo, and patron deity is <i>Chandra<\/i>, the Moon.",165],["p","<b>Technique <\/b>Form a fist with the thumb on the outside of the other fingers.",165],["p","<b>Application <\/b><i>Viniyoga<\/i>: <i>Sthiram<\/i> (“steadiness”); <i>Kachagraha<\/i> (“grasping one’s hair”); <i>Dardhya<\/i> (“courage” or “firmness”); <i>Vasthvadeenamcha-dharana <\/i> (“holding things”); <i>Malianam-yudhabava<\/i> (“wrestling”). Additional usages denote: grasping, without bias, fruit, agreement, saying “very well,” sacrificial offering, greeting common people, strong hold, holding a bell, running, lightness, holding a shield, fisticuffs, and grasping a spear.",165],["e","Mushti Mudra II",166],["i","i654.webp",166],["f",["English","“fist”"],166],["f",["Devanagari","deva166.webp"],166],["f",["Transliteration","trans166.webp"],166],["p","<b>Description <\/b><i>Mushti Mudra II<\/i> is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the yoga tradition where it is used to consolidate <i>prana<\/i> (life force) in the <i>kanda<\/i> (lower belly).33",166],["p","<b>Technique <\/b>Touch the tip of the thumb to the base of the ring finger. Close the remaining fingers around the thumb to form a fist.",166],["p","<b>Application <\/b>In a comfortable seated position, form the mudra with each hand, resting the hands against the lower belly. Lightly contract the anus, while relaxing the belly and breathing naturally. Rest your attention on the space inside the body above the anus and below the navel. Hold for 5 to 45 minutes.",166],["p","<b>Benefits <\/b>Reduces anxiety and nervousness, strengthens digestion and assimilation, eliminates nightmares, calms the mind, imparts a sense of centeredness within the body, reduces fatigue and increases overall vitality.",166],["p","<b>Note <\/b>For improved results, hold this mudra with each hand three times a day for 5 to 15 minutes. May be practiced while seated, standing, walking, or reclining.",166],["e","Mushtika Mudra",167],["i","i658.webp",167],["f",["English","“joined fist offering”"],167],["f",["Devanagari","deva167.webp"],167],["f",["Transliteration","trans167.webp"],167],["p","<b>Description <\/b><i>Mushtika Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the seventeenth gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>.",167],["p","<b>Technique <\/b>With each hand, bring the pads of the fingers toward the heel of the hand. Join the hands together with the thumbs side by side.",167],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra lightly against your chest. Relax the shoulders, throat, and neck. Breathe naturally. Imagine there is a precious jewel of incalculable value inside your hands. This represents who you truly are, your unique gifts and talents. With sincerity in your heart, make an offering of the jewel internally as a commitment to live your life for the welfare of all beings. Do this repeatedly until tears of compassion flow from your eyes.",167],["p","<b>Benefits <\/b>Weakens ego-grasping and self-defeating habits, awakens enlightened attitude and the heart of compassion, reduces anxiety and self-doubt, calms the spirit, clears the mind, benefits the heart and vascular system.",167],["p","<b>Note <\/b>As you make the offering internally, you may also whisper the incantation, “I dedicate my thoughts, words, and actions to the welfare of all beings.”",167],["e","Mushtimriga Mudra",168],["i","i662.webp",168],["f",["English","“fist deer”"],168],["f",["Devanagari","deva168.webp"],168],["f",["Transliteration","trans168.webp"],168],["p","<b>Description <\/b><i>Mushtimriga Mudra <\/i>is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the dance tradition. In the <i>Abhinaya Darpana,<\/i> it is noted as one of the gestures that indicate “wild animals.”",168],["p","<b>Technique <\/b>Fold the ring, middle, and index fingers into the palm, and extend the thumb and little finger outward and upward.",168],["p","<b>Application <\/b>Used in the dance tradition to denote a black antelope.",168],["e","Nagabandha Mudra",169],["i","i666.webp",169],["f",["English","“serpent tie”"],169],["f",["Devanagari","deva169.webp"],169],["f",["Transliteration","trans169.webp"],169],["p","<b>Description <\/b><i>Nagabandha Mudra<\/i> is the twenty-first hand gesture of the twenty-four joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana.<\/i>",169],["p","<b>Technique <\/b>Cross your hands at the wrists with the two hands facing opposite each other. Curve your fingers to form the hood of a snake, as in <i>Sarpashirsha <\/i> <i>Mudra <\/i>(p.213).",169],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Bhujanga-dampatibhava <\/i> (“pair of snakes”); <i>Nikunjanam Darshana<\/i> (“bowers”); <i>Atharvanasya Mantreshu <\/i> (“<i>Atharva-Veda<\/i> chants”).",169],["e","Nalini Padmakosha Mudra",170],["i","i670.webp",170],["f",["English","“fragrant lotus buds”"],170],["f",["Devanagari","deva170.webp"],170],["f",["Transliteration","trans170.webp"],170],["p","<b>Description <\/b><i>Nalini Padmakosha Mudra<\/i> is a joint-hand gesture (<i>samyukta <\/i> <i>hasta<\/i>) common to the dance tradition. It is noted in the <i>Abhinaya Darpana<\/i>. The patron deity associated with this mudra is <i>Shesha<\/i>.34",170],["p","<b>Technique <\/b>Cross the wrists and turn your palms outward. Separate your fingers and thumb and gently curl them inward toward the hollowed palms without touching the tips. Keep your hands in front of your torso, about 6 inches away from your body.",170],["p","<b>Application <\/b>Used to denote entwined snakes, flower buds, a cluster of flowers, making equal distributions, the number ten, and a type of bird.",170],["e","Nanandri Mudra",171],["i","i674.webp",171],["f",["English","“sister-in-law”"],171],["f",["Devanagari","deva171.webp"],171],["f",["Transliteration","trans171.webp"],171],["p","<b>Description <\/b><i>Nanandri Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of the eleven relationships (<i>Bandava Hastas<\/i>) as described in the <i>Abhinaya Darpana. <\/i>It indicates sisterin-law.",171],["p","<b>Technique <\/b>Form <i>Mrigashirsha Mudra <\/i>(p.158) with your left hand and place it on your stomach (this is called the <i>stri<\/i> “feminine” hand). Form <i>Kartarimukha <\/i> <i>Mudra<\/i> (p.115) or<i> Shikhara Mudra<\/i> (p.225) with your right hand.",171],["p","<b>Application <\/b>This gesture denotes sister-in-law.",171],["e","Netra Mudra I",172],["i","i678.webp",172],["f",["English","“eye”"],172],["f",["Devanagari","deva172.webp"],172],["f",["Transliteration","trans172.webp"],172],["p","<b>Description <\/b><i>Netra Mudra I <\/i>is a single-hand gesture (<i>asamyukta hasta<\/i>) common to Hindu and Buddhist traditions. It is a ritual gesture used to represent an eye, usually symbolizing the power of a particular deity to see through confusion and ignorance.",172],["p","<b>Technique <\/b>Join the tips of the thumb and little finger. Extend the remaining fingers upward.",172],["p","<b>Application <\/b>Hold the mudra in front of the eye, so that you can see through the hole.",172],["p","<b>Note <\/b>This mudra is primarily used in the context of ritual and is not described as having particular healing benefits for the individual.",172],["e","Netra Mudra II",173],["i","i682.webp",173],["f",["English","“eye”"],173],["f",["Devanagari","deva173.webp"],173],["f",["Transliteration","trans173.webp"],173],["p","<b>Description <\/b><i>Netra Mudra II <\/i>is the joint-hand version (<i>samyukta hasta<\/i>) of <i>Netra Mudra I<\/i>. It is a ritual gesture used in Hindu and Buddhist traditions during <i>puja<\/i> or <i>yajna<\/i> to depict the eyes of a deity such as <i>Kali<\/i> or <i>Tara<\/i>.",173],["p","<b>Technique <\/b>Join the tips of the thumbs and little fingers of each hand. Extend the remaining fingers upward. Bring the two hands together, touching the tips of the little fingers and thumbs in the center.",173],["p","<b>Application <\/b>Raise the mudra in front of the eyes.",173],["p","<b>Note <\/b>This mudra is primarily used in the context of ritual and is not described as having particular healing benefits for the individual.",173],["e","Nimbasala Mudra",174],["i","i686.webp",174],["f",["English","“type of tree”"],174],["f",["Devanagari","deva174.webp"],174],["f",["Transliteration","trans174.webp"],174],["p","<b>Description <\/b><i>Nimbasala Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the dance tradition. In the <i>Abhinaya Darpana<\/i>, it is noted as one of the gestures that indicate “trees.”",174],["p","<b>Technique <\/b>Assume <i>Shukatunda Mudra<\/i> (p.229) with both hands, and cross at the wrists. Palms face outward.",174],["p","<b>Application <\/b>Used in the dance tradition to denote the <i>Nimbasala<\/i> tree.",174],["p","<b>Note <\/b>The word <i>nimba<\/i> by itself refers to the neem tree, which has many healing benefits and serves as a natural pesticide when planted near gardens.",174],["e","Nirriti Mudra",175],["i","i690.webp",175],["f",["English","“goddess of death and corruption”"],175],["f",["Devanagari","deva175.webp"],175],["f",["Transliteration","trans175.webp"],175],["p","<b>Additional Name <\/b><i>Rakshasa<\/i>",175],["p","<b>Description <\/b><i>Nirriti Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of sixteen <i>Deva Hastas<\/i>, denoting Hindu gods and goddesses as described in the <i>Abhinaya Darpana<\/i>. It indicates the form and character of the Hindu deity <i>Nirriti<\/i>.",175],["p","<b>Technique <\/b>Form <i>Khatva Mudra<\/i> (p.126) with your left hand and <i>Shakata <\/i> <i>Mudra<\/i> (p.214) with your right hand. Hold the left hand in front of your waist and the right hand in front of your chest.",175],["p","<b>Application <\/b>Used to indicate <i>Nirriti<\/i>, the goddess of death and corruption, and the guardian of the southwest direction. See Appendix C for a chart of the Guardians of the Eight Directions.",175],["p","<b>Note <\/b>There are several combinations of mudras used to express the various traits and emblems of <i>Nirriti Devi<\/i>. The one indicated here appears to be the most common.",175],["e","Nirvana Mudra",176],["f",["English","“liberation”"],176],["i","i696.webp",176],["f",["Devanagari","deva176.webp"],176],["f",["Transliteration","trans176.webp"],176],["p","<b>Description <\/b><i>Nirvana Mudra<\/i> is an intricate joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana<\/i> form, and is final gesture in the set of thirty-two traditional <i>Gayatri Mudras<\/i>, specifically the eighth mudra of the sub-set of eight gestures practiced after meditation or recitation of the <i>Gayatri Mantra<\/i>. — Image I",176],["i","i694.webp",176],["p","<b>Technique <\/b>Turn the left palm up and the right palm down. Move the right hand under the left, hooking the little, ring, and middle fingers of each hand. Move the left hand up in an arc, so that the palms of the two hands come together. Extend the index fingers, and join the tips together. Bring the thumbs side by side in the hollow space created by the index fingers. Gently rotate the mudra toward your body and upward, until the index fingers point straight up (Image I). Bow the head forward, touching",176],["p","Image II the “third-eye center” to the tips of the index fingers. Hold for 1 to 2 minutes (longer if desired). Then, reverse the rotation, letting the mudra unwind itself. Form two <i>Jnana Mudras<\/i> (p.100), with the wrists crossed (Image II). Rotate the hands toward your body, bringing the hands palms up, little fingers touching. Conclude by bowing the head to the heels of the hands (Image III).",177],["p","<b>Application <\/b>Use <i>Nirvana Mudra<\/i> as a ritual",177],["i","i700.webp",177],["p","gesture, symbolizing your commitment to realizing your own Original Nature in this very lifetime. Dedicate the benefit of your practice to the welfare of all beings. After a session of meditation or recitation of mantra, perform the movements of the mudra slowly and meticulously. Mentally gather all the benefits of your <i>sadhana <\/i> (personal practice) into the mudra and offer them to all beings.",177],["p","<b>Benefits <\/b>Weakens ego grasping, reduces selfish desire for personal gain from spiritual practice, awakens the heart of — Image III compassion, serves as a ritual gesture to conclude any practice, as well as a simple way to “dedicate the merit.”",177],["p","<b>Note <\/b>While performing <i>Nirvana Mudra<\/i>, you may also chant the prayer, <i>Lokah Samasthah <\/i> <i>Sukhino Bhavantu Om Shanti Shanti Shanti <\/i>(“May all beings everywhere be happy! Om Peace Peace and Eternal Peace”). This will add additional power and devotion to the application of the mudra.",177],["e","Nishedha Mudra",178],["i","i704.webp",178],["f",["English","“defense”"],178],["f",["Devanagari","deva178.webp"],178],["f",["Transliteration","trans178.webp"],178],["p","<b>Description <\/b><i>Nishedha Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) noted in the <i>Abhinaya Darpana<\/i> and <i>Natya Shastra.<\/i> The patron deity associated with this gesture is <i>Tumburu<\/i>.35",178],["p","<b>Technique <\/b>Form <i>Mukula Mudra<\/i> (p.161) with your left hand and press the tips of your fingers against your right palm held in <i>Kapittha Mudra<\/i> (p.106).",178],["p","<b>Application <\/b>Indicates grasping, receiving, preserving, convention, truthfulness, and compression. Also used to worship the <i>Shivalinga <\/i>in <i>Anga <\/i> <i>Puja.<\/i>36",178],["e","Nitamba Mudra",179],["i","i708.webp",179],["f",["English","“buttock”"],179],["f",["Devanagari","deva179.webp"],179],["f",["Transliteration","trans179.webp"],179],["p","<b>Description <\/b><i>Nitamba Mudra<\/i> is a joint-hand dance gesture (<i>samyukta hasta<\/i>) noted in the <i>Natya Shastra <\/i>and <i>Abhinaya Darpana. <\/i>The patron deity associated is<i> Agastya<\/i>.37",179],["p","<b>Technique <\/b>Form <i>Pataka Mudra<\/i> (p.186) with each hand and place the hands behind the buttocks, palms up. Arms are extended downward. The dynamic version is to move your upward facing palms from shoulders to buttocks.",179],["p","<b>Application <\/b>In the dance tradition it is used to denote weariness, descent, astonishment, and ecstasy.",179],["e","Padma Mudra",180],["i","i712.webp",180],["f",["English","“lotus flower”"],180],["f",["Devanagari","deva180.webp"],180],["f",["Transliteration","trans180.webp"],180],["p","<b>Additional names <\/b><i>Pankajam<\/i>, <i>Panka<\/i>, <i>Kamala <\/i> <i>Ghumana<\/i>",180],["p","<b>Description <\/b><i>Padma Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the Hindu, yoga, Tantric, and dance traditions. It is found in the <i>Yoga <\/i> <i>Tattva Mudra Vijnana<\/i> form and is one of the thirty-two traditional <i>Gayatri <\/i> <i>Mudras<\/i>, specifically the sixth gesture in the sub-set of eight mudras practiced after meditation or recitation of the <i>Gayatri Mantra<\/i>.",180],["p","<b>Technique <\/b>Raise the hands in front of the heart center. Join the heels of the two palms while spreading the fingers upward to create a hollow space between the palms. The little fingers and thumbs may touch or stay slightly apart.",180],["p","<b>Application (yoga)<\/b> In a comfortable seated position, hold the mudra in front of the heart. Soften the chest and belly, and adjust your breathing to be slow, smooth, and deep. With the eyelids half-drawn, gaze into the center of the lotus flower formed by the hands. Discard all contrivance and release all ambitions that are not in harmony with your “heart of hearts.” Do this honestly within yourself. Resolve to make your life an offering for the benefit of all beings. Stay with this feeling for 5 to 45 minutes.",180],["p","<b>Application (dance)<\/b> In dance, there is a dynamic application of this gesture executed by turning the wrists round and round each other continuously in a soft manner without losing contact. This is known as the offering of the “Heart Lotus.” It is used to denote spiritual feelings of love, beauty, and grace.",180],["p","<b>Benefits <\/b>Weakens ego grasping, opens <i>Anahata Chakra<\/i>, settles the mind, benefits the heart and pericardium, balances the immune system, awakens the body’s self-healing power, ignites spiritual devotion.",181],["p","<b>Note <\/b>Although <i>Padma Mudra <\/i>is used in all forms of Classical Indian Dance, it is especially common to the North Indian dance, <i>Kathak<\/i>. The name <i>Kamala Ghumana <\/i>is derived from that tradition.",181],["e","Padmakosha Mudra",182],["i","i718.webp",182],["f",["English","“lotus bud”"],182],["f",["Devanagari","deva182.webp"],182],["f",["Transliteration","trans182.webp"],182],["p","<b>Description <\/b><i>Padmakosha Mudra <\/i>is the fifteenth hand gesture of the twentyeight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana<\/i>. It is also noted in the <i>Natya Shastra<\/i>. According to mythology, it originated from <i>Narayana<\/i> when he was worshiping <i>Shiva<\/i> with lotus flowers to obtain his discus (“<i>sudarshana<\/i>-<i>chakra<\/i>”). The associated sage is <i>Padmadhara<\/i>, race is <i>Yaksha-Kinnara<\/i>, color is white, and patron deity is <i>Bhargava<\/i>.",182],["p","<b>Technique <\/b>Place your hand palm up with the fingers apart. Slightly bend all five fingers keeping the palm hollow.",182],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Phale bilva-kapittha <\/i> (“various fruits”); <i>Strinam-cha-kutcha-kumbhayoh<\/i> (“round breasts of a woman”); <i>Avartake<\/i> (“circular movement”); <i>Kanduke<\/i> (“ball”); <i>Sthalyam <\/i> (“bowl”); <i>Bhojane<\/i> (“food”); <i>Pushpa-koraka<\/i> (“flower garland”); <i>Shakaraphala <\/i> (“mango”); <i>Pushpavarsha<\/i> (“showering flowers”); <i>Manjarika-adishu<\/i> (“cluster of flowers”); <i>Japakusuma<\/i> (“Hibiscus flower”); <i>Gantarupa Vidhanaka<\/i> (“bell shape” or “preparing a big bowl of food for elephants”); <i>Valmika<\/i> (“ant-hill”); <i>Kamala<\/i> (“lotus”); <i>Anda<\/i> (“egg”). Additional usages denote: elephant trunk, brilliance, vessel of gold or silver, coil of hair, moderation, charm, bending a bough, and coconut.",182],["e","Pallava Mudra I",183],["i","i722.webp",183],["f",["English","“leaf”"],183],["f",["Devanagari","deva183.webp"],183],["f",["Transliteration","trans183.webp"],183],["p","<b>Description <\/b><i>Pallava Mudra I<\/i> is noted in the <i>Abhinaya Darpana<\/i> and in the <i>Nat
