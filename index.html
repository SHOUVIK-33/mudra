logical bird”",320],["p","21. <i>Nagabandha<\/i>—“serpent tie”",320],["p","22. <i>Khatva<\/i>—“cot”",320],["p","23. <i>Bherunda<\/i>—“pair of birds” or “two-headed bird”",320],["p","24. <i>Avahita<\/i>—“dissimulation” or “holding things”",320]]}]},{"t":"Endnotes","p":321,"s":[{"t":"","p":321,"b":[]},{"t":"Introduction","p":321,"b":[["p","Literally, <i>yoga<\/i> (“union”), <i>tattva<\/i> (“principle/element”), <i>mudra<\/i> (“hand position”), <i>vijnana<\/i> (“science” or “knowledge”)—the science and discipline of maintaining harmony by using finger positions related to the elements. One of the most important texts of the Kaula School of Tantrism. Literally (“the fourth”), meaning the realm of Immediate Presence beyond the normal three states of being: waking, sleeping, and dreaming. <i>Kanaphata<\/i> (“ear split”) refers to the large earrings they wear. They are sometimes referred to as Tantric <i>sannyasins<\/i> (ascetics), because of their emphasis in acquiring <i>siddhis<\/i> (supernatural powers) in contrast to more orthodox practices of purification, devotion, and meditation. See: Dor-je, Wan-ch’ug. <i>The Mahamudra: Eliminating the Darkness of Ignorance. <\/i> New Delhi, India: Library of Tibetan Works and Archives, 1978. Such as <i>Ashvini Mudra<\/i>,<i> Bhujangini Mudra<\/i>, <i>Khecari Mudra<\/i>, <i>Maha Mudra<\/i>, <i>Manduki Mudra<\/i>, <i>Matangi Mudra<\/i>, <i>Sahajoli Mudra<\/i>, <i>Shakticalani Mudra<\/i>, <i>Shambhavi Mudra<\/i>, <i>Vajroli Mudra<\/i>, <i>Yoni Mudra<\/i>, and so forth. Literally (“first lord”), another name for <i>Shiva.<\/i> See: Muktibodhananda, Swami, trans. <i>Hatha Yoga Pradipika: Light on Hatha <\/i> <i>Yoga<\/i>. Bihar, India: Bihar School of Yoga, 1993, pp.286–290. Satchidananda, Swami. <i>Integral Yoga Hatha<\/i>. New York: Hold, Rinehart and Winston, 1970, p.156. 10 See: Apparao, P.S.R., trans. <i>Abhinaya Darpanam of Nandikeswara.<\/i> Hyderabad, India: Natyamala Publications, 1997, p.44. 11 See: Iyengar, B.K.S. <i>Light on Yoga<\/i>. New York: Stockton Books, 1979, p.131. 12 See: Iyengar, B.K.S. <i>Light on Yoga<\/i>. New York: Stockton Books, 1979, p.120.",321]]},{"t":"The Mudras","p":321,"b":[["p","Synonymous with the idea of Original Nature. Earth, Water, Fire, Air, and Ether. A treatise on dance from Kerala that informs the usage of hand gestures in <i>Katahkhali<\/i> and <i>Mohiniyattam<\/i> dance. “Lord of the farmland,” a deity who was originally considered the local spirit of the farmland, particularly in southern India. His image is generally placed on the northeastern corner of temples devoted to <i>Shiva<\/i>, and he is worshipped prior to each ritual to ensure efficacy. “Mover of mountains,” a famous sage revered in southern India. He is said to have introduced the Vedic tradition and was instrumental in the formation of language and literature. “Good,” “beneficial,” or “divine (being),” an ancient god of western India. Also known as <i>Krishna<\/i>’s father. Sometimes used synonymously with the name <i>Krishna<\/i>. A short treatise on Odissi Dance allegedly completed in 1670. The seven accoutrements a universal monarch must possess to stay in power: the precious queen, the precious general, the precious horse, the precious jewel, the precious minister, the precious elephant, and the precious wheel. A sage and devotee of <i>Vishnu. <\/i>According to legend, his devotion was so strong that it moved <i>Vishnu<\/i> to save him during the great flood. 10 “Unlimited,” “free,” or “unbounded,” the Vedic goddess of space (<i>Kasha<\/i>), the mother of all creatures and gods. 11 See: Apparao, P.S.R., trans. <i>Abhinaya Darpanam of Nandikeswara.<\/i> Hyderabad, India: Natyamala Publications, 1997, p.392. 12 An emanation of <i>Shiva<\/i> from southern India emphasizing his dancing form. His right leg is firmly placed on the personification of <i>apasmarapurusha<\/i> (ignorance), and his left leg is raised halfway into the air as he begins to dance. 13 Aspect of the <i>Devi<\/i>, and one of the <i>Saptamatrikas<\/i> (eight matriarchs). Generally represented as a woman with a boar’s head. 14 A short Sanskrit text epitomizing the non-dual teachings of <i>Advaita Vedanta<\/i>. 15 The absolute soul or supreme spirit concept in Vedanta and Yoga philosophies. 16 An ancient Indian stringed instrument that the goddess <i>Sarasvati<\/i> is often depicted playing. 17 “The south-facing image of <i>Shiva<\/i>”—the aspect of <i>Shiva<\/i> as the ultimate ascetic and quintessential guru of music, philosophy, and yoga. 18 Literally “reality,” or “principles of reality.” Traditionally, the <i>Samkya<\/i> system of philosophy recognizes twenty-four <i>tattvas<\/i>; such as <i>buddhi<\/i> (higher mind), <i>manas <\/i> (lower mind), <i>indriya<\/i> (senses), and so forth. 19 The sound and vibration of Om. Meditation on Om, as the primal sound of creation, is a technique described in numerous Sanskrit texts on yoga, such as the <i>Bhagavad Gita<\/i>, <i>Upanishads<\/i>, and <i>Yoga Sutras of Patanjali.<\/i> 20 Pure Dance, lyrical variations of a musical raga. 21 See: Odissi Research Centre. <i>Odissi Dance Pathfinder Vol. I.<\/i> Bhubaneswar, India: Smt. Kum Kum Mohanty, 1998, p.42. 22 A prominent sage from ancient times referred to as “Old Tortoise Man,” considered to be the ancestral father of the <i>devas<\/i>, <i>asuras<\/i>, <i>nagas<\/i>, and human beings. 23 Another name for <i>Kartikeya<\/i>, the son of <i>Shiva<\/i>, and the commander of the army of the gods.",322],["p","24 See: Odissi Research Centre. <i>Odissi Dance Pathfinder Vol. I.<\/i> Bhubaneswar, India:",323],["p","Smt. Kum Kum Mohanty, 1998, p.43. 25 Alternative name for <i>Kubera<\/i>, the god of wealth. Represented as “the king of nature-spirits.” 26 In the Tantric tradition, <i>Shiva<\/i> represents intrinsic clarity, pristine awareness, unborn, unchanging, unswerving acceptance. <i>Shakti<\/i> represents primal creativity, birth, life, and death, limitless manifestations, and constant change. 27 A king who had attained heaven. 28 Originally commissioned by Emperor Ashoka in the third century bce to contain relics of the historical Buddha, and as an emblem of his newly aroused affection for Buddhism. It is considered one of the oldest stone temple structures in India. 29 The mythological center of the universe, located in the Himalayan mountains (in modern Tibet), believed to be the abode of <i>Shiva<\/i>. Also called the Golden Mountain. 30 A mark on the forehead representing the “third eye,” or the idea of spiritual vision. Usually made with sandalwood paste, sindhur, or ashes (<i>vibhuti<\/i>) from the sacred fire. 31 “Brilliant,” “golden,” or “yellow”—synonymous with <i>Parvati<\/i>, consort of <i>Shiva<\/i>. She is reputed as the embodiment of motherhood. 32 Ascetic spiritual discipline. 33 Mentioned in the <i>Shiva Samhita<\/i>, <i>Hatha Yoga Pradipika<\/i>, and <i>Yoga Yajnyavalaya<\/i>, <i>kanda<\/i> literally means “bulb,” and is the name given to the energetic structure in the lower abdomen considered to be the origin of the <i>nadis <\/i>(energy channels). 34 A <i>naga<\/i> (snake) that takes human birth through <i>Devaki<\/i>, one of the primal beings of creation. In the <i>Puranas<\/i>, <i>Shesha<\/i> is said to hold all the planets of the universe on his hoods and to constantly sing of the glory of <i>Vishnu<\/i> from all his mouths. 35 Musician to the gods, lead singer of the <i>Gandharvas<\/i> (celestial musicians). 36 Literally “worship of the limbs of the body,” a ritual practice of remembering the preciousness of human life and the sacredness of the human body. 37 A revered Vedic <i>siddha<\/i> (adept) credited with uncovering many of the mantras of the <i>Rig Veda.<\/i> 38 As performed in the <i>arti<\/i> ritual, where the Five Elements (in the form of fire, incense, flowers, peacock fan, and yak-tail whisk) are offered in devotion to the Divine. 39 <i>Sarasvati<\/i>: literally <i>saras<\/i>, “flow,” and <i>vati<\/i>, “woman.” The unfolding of knowledge is likened to a flowing river that nourishes those who seek it. To those who desire knowledge it is said to be supremely alluring, like a beautiful woman. 40 The powerful king of the <i>asuras<\/i> (demons). 41 Another name for the deity <i>Kartikeya<\/i>, who was born from <i>Shiva<\/i>’s concentration as a spark of fire from his “third eye.” 42 See Note 30.",323],["p","43 In the context of Hindu mythology it is believed to be a cosmic column. The",324],["p","<i>stambha<\/i> symbolizes the bond which joins heaven and earth. A number of Hindu scriptures, including the <i>Atharva Veda<\/i>, have references to <i>stambha<\/i>. 44 “All-maker,” the architect of the universe, <i>Vishvakarma<\/i> represents the supreme creative power, knowledge, and wisdom. 45 See: Apparao, P.S.R., trans. <i>Abhinaya Darpanam of Nandikeswara.<\/i> Hyderabad, India: Natyamala Publications, 1997, p.391. 46 See note 23. 47 The incarnation of <i>Vishnu<\/i> as a tortoise. 48 He is the great king of the <i>nagas<\/i> (“mythological serpent”) who wears a gem (<i>nagamani<\/i>) on his head. 49 For example, <i>Narasimha<\/i> is described as using his hands to tear the <i>raksasa<\/i>’s (demon) chest in a fierce battle to protect devotees from evil. 50 Alternate nostril breathing. 51 There are numerous subtleties to this application of <i>Vishnu Mudra<\/i> that are too complex to explain here. Such nuances are best learned from a competent teacher of yoga and pranayama.",324]]},{"t":"Appendix A","p":324,"b":[["p","For information on traditional chakra colors, see: Avalon, Arthur. <i>The Serpent <\/i> <i>Power: The secrets of Tantric and Shaktic Yoga<\/i>. Madras, India: Dover Publications, 1974.",324]]}]},{"t":"Glossary","p":325,"s":[{"t":"","p":325,"b":[["p","Abhinaya (“lead toward”) The concept in Indian dance and drama referring to the art of dramatic expression. Etymologically it is derived from the Sanskrit <i>abhi <\/i> (“toward”) and <i>nii <\/i>(“leading/guide”), literally meaning “to lead toward,” as in leading the audience toward a particular sentiment. <i>Abhinaya<\/i> is an integral part of all the Indian Classical Dance styles, where hand mudras as well as facial expression are heavily utilized as instruments of story telling.",325],["p","Abhinaya Chandrika A regional treatise on dance written by Maheshvara Mohapatra circa 1670 ce. It includes a detailed description of the various movements of the feet and hands, as well as the postures and movements unique to the region of modern-day Orissa.",325],["p","Abhinaya Darpana A treatise written in third or fourth century ce by Nandikeshvara. This text’s main focus is the techniques of communication in dance, and is widely followed by South Indian dance forms.",325],["p","Advaita Vedanta (“non-dual Vedanta”) One of India’s most influential philosophical systems.",325],["p","Agni (“fire”) One of the <i>pancha mahabhuta<\/i>, “five elemental principles,” of the Indian cosmological system.",325],["p","Ajna Chakra (“command center”) The energy center located between the eyebrows, commonly called the “third eye,” related to the pineal gland.",325],["p","Akasha (“space”) One of the <i>pancha mahabhuta<\/i>, “five elemental principles,” of the Indian cosmological system.",325],["p","Anahata Chakra (“un-struck sound”) The energy center located behind the heart, at the center of the chest, related to the cardiac plexus and the thymus gland.",325],["p","Angikabhinaya (“physical expression”) The usage of hand mudras in Indian dance and drama to convey an elaborate repertoire of meaning.",325],["p","Apana (“downward moving force”) Refers to <i>apana vayu<\/i>, one of the Five Vital Winds (<i>pancha vayu<\/i>) inside the human body.",325],["p","Ashtavakragita (“song of Ashtavakra”) A short Sanskrit text epitomizing the nondual teachings of <i>Advaita Vedanta<\/i>.",325],["p","Asura (“unwise deity”) A class of beings (lesser deities) in Hindu cosmology characterized by greed, jealousy, paranoia, and constant quarreling.",325],["p","Ayurveda (“science of life”) <i>Ayu<\/i> (“longevity”), <i>veda<\/i> (“knowledge”); the traditional system of holistic medicine native to India.",326],["p","Bhava (“sentiment”) Status of being, a subjective becoming, states of mind; from the Sanskrit <i>bhu<\/i> (“to become”). Most frequently translated as feeling, emotion, mood, and devotional state.",326],["p","Bindu (“point” or “drop”) The central point of focus in a geometric figure, a point of concentration, a drop of semen representing the primal creative force.",326],["p","Dedicate the Merit The ritual of sharing the benefit of one’s practice with all beings. In Buddhist and yogic traditions, this is traditionally included at the conclusion of every practice session.",326],["p","Deva (“celestial” or “shining”) A class of benevolent supernatural beings, or gods in the Hindu pantheon; sometimes called nature spirits.",326],["p","Durga (“inaccessible”) One of the many aspects of Devi (the divine feminine principal), the creator and destroyer of humanity and nature, known as a fierce warrior against enemies of the <i>Dharma<\/i>, she is considered matriarch of the sixtyfour yoginis.",326],["p","Earth Element (“<i>prithvi<\/i>”) One of the <i>pancha mahabhuta<\/i>, “five elemental principles,” used in Indian cosmology to describe the densest of elements.",326],["p","Ether Element (“<i>akasha<\/i>”) One of the <i>pancha mahabhuta<\/i>, “five elemental principles,” of the Indian cosmological system employed by yoga and Ayurveda used to describe the lightest of elements.",326],["p","Fire Element (“<i>agni<\/i>”) One of the <i>pancha mahabhuta<\/i>, “five elemental principles,” associated with heat and brightness, internally with digestion and the power to transform.",326],["p","Great Stupa at Sanchi A sacred Buddhist historical site located in the Indian state of Madhya Pradesh.",326],["p","Gyatri Mantra A poetic Sanskrit verse from the Rig Veda consisting of twenty-four syllables, addressing the Sun (<i>Savitar<\/i>). Used as a mantra, this famous verse is chanted morning and evening by millions of people each day.",326],["p","Hasta (“hand”) Relating to the hand or hands. Hasta is also a synonym for hand mudra in the dance tradition, and is the preferred term among scholars to describe the many hand gestures of Indian dance.",326],["p","Jala (“water”) One of the <i>pancha mahabhuta<\/i>, “five elemental principles,” of the Indian cosmological system.",326],["p","Kali (“dark”) Perhaps the most famous goddess of the Indian pantheon, depicted as dark-skinned, naked, and ferocious, all traits that hint at the dissolution of all things into the vastness of time and space; the consort of Lord Shiva, personifying both the creative and destructive forces of nature.",326],["p","Ki (“vital force”) The Japanese term for “vital energy,” similar to <i>prana<\/i> in Sanskrit.",327],["p","Lasya (“feminine dance”) According to Indian mythology, <i>lasya<\/i> describes a graceful and sensual dance originally performed by the goddess Parvati in response to the primal male energy created by Lord Shiva’s Tandava dance.",327],["p","Linga (“generative organ”) The most common symbol associated with Shiva, usually made from an erect stone (loosely resembling a phallus), that represents the creative forces supporting all creation, the beginning and end of the manifest world, usually depicted as <i>linga<\/i> and <i>yoni <\/i>together, symbolizing the manifest and unmanifest aspects of reality.",327],["p","Mandala (“circular” or “heavenly orbit”) A concentric diagram or cosmological chart used in Hindu and Buddhist ritual as a visual representation of a specific spiritual state, realm, or deity. Often used by practitioners as an object of contemplation designed to take the mind into progressively deeper states of absorption.",327],["p","Manipura Chakra (“city of jewels”) The energy center located behind the navel, related to the solar plexus and adrenal glands.",327],["p","Mount Meru The mythological center of the universe, the Golden Mountain, located in the Himalayan mountains (in modern Tibet), believed to be the abode of Shiva.",327],["p","Naga (“serpent”) Most commonly a cobra, a term used in Hindu, Buddhist, and Jain legends to describe a class of semi-divine beings that are half-human and halfserpent, highly intelligent, beautiful, and possessing super-human powers. They are said to dwell in underwater caves and are the guardians of precious metals, gems, and other riches of the earth.",327],["p","Natya (“dance” or “performance”) A term denoting “drama,” includes expressive dance as a key component. Rhythm and lyrical elements preponderate traditional Hindu plays.",327],["p","Natya Shastra Ascribed to Bharata Muni, and considered the original available treatise on the arts of music, dance, and theatre. It is generally agreed upon to have been written between 200 bce and 200 ce.",327],["p","Nritta (“pure dance”) Technical movement within specific rhythm patterns of Indian dance.",327],["p","Nritya The dramatic miming aspect of India dance. Also referred to as <i>Abhinaya <\/i> or <i>Angikabhinaya<\/i>.",327],["p","Ojas (“vitality”) The term used in Ayurveda and yoga to describe the storehouse of vigor in the human body, commonly called “the fluid of life.”",327],["p","Om The primordial sound of creation, the seed mantra from which all other mantras originate.",327],["p","Openness A term used to denote the quality of total acceptance, and the insight of the self-resolving nature of all phenomena; a synonym for Original Nature.",328],["p","Pallavi (“pure dance”) Lyrical variations of a musical raga.",328],["p","Perineum The diamond shaped region of the human body located between the pubic symphysis and the coccyx, inferior to the pelvic diaphragm.",328],["p","Prana (“vital breath” or “life-force”) Generally used to denote the basic energy of the universe. Specifically used in the yogic system to describe one of the Five Vayus; <i>Prana Vayu<\/i> is the energy located in the region of the chest and is associated with the heart and lungs.",328],["p","Pranayama (“breath control”) The elaborate system of breathing exercises employed in yoga to induce various internal states and affect the nervous, endocrine, circulatory, and respiratory systems.",328],["p","Pratyahara (“interiorization of the senses”) One of the limbs of the Eight-Fold Path of yoga, where the aspirant reduces their attachment to sensory stimuli in an effort to lead the mind into subtler states of mediation.",328],["p","Prayoga (“proper action”) Denotes the “right” way of applying any art or action.",328],["p","Prithivi (“earth”) One of the <i>pancha mahabhuta<\/i>, “five elemental principles,” of the Indian cosmological system.",328],["p","Puja (“worship”) The performance specific ritual for a deity, aspect of nature, or guru.",328],["p","Qi (“fragrant steam”) The Chinese word for life-force, poetically symbolized by the aromatic steam rising from freshly cooked rice. The energy animating the universe and flowing within the human body, similar to <i>prana<\/i> in Sanskrit, or <i>ki<\/i> in Japanese.",328],["p","Rasa (“juice” or “essence”) Generally refers to the inner emotional experience created by <i>bhavas.<\/i>",328],["p","Sahasrara Chakra (“thousand-petalled lotus”) The energy center located at the crown of the head, related to the pituitary gland and hypothalamus.",328],["p","Shakamuni Buddha The historical Buddha, Siddhartha Gautama, a spiritual teacher from ancient India (the region is now within the borders of modern Nepal), upon whose teachings Buddhism is founded.",328],["p","Shavasana (“corpse pose”) The reclining rest posture commonly used in Hatha Yoga at the conclusion of a series of <i>asanas<\/i> (postures).",328],["p","Shiva (“benign”) The Hindu deity of Absolute Reality, model of the perfect yogi.",328],["p","Solar plexus A complex network of nerves located behind the stomach.",328],["p","Sushumna Nadi (“central channel”) The energy pathway containing the seven chakras of the Indian Tantric tradition, that runs through the center of the spine, from the pelvic floor to the top of the head.",328],["p","Svadhisthana Chakra (“one’s own abode”) The energy center located behind the pubic bone, associated with the coccyx, testes, and ovaries.",329],["p","Tantra (“net” or “loom”) The spiritual path of ritual and transformation, emphasizing worship of feminine principal (<i>Shakti<\/i>), employs a wide range of diverse methods to awaken the latent potential of body, mind, and spirit.",329],["p","Tantric Buddhism (“<i>Vajrayana<\/i>”) One of the traditional vehicles of Buddhist practice.",329],["p","Tejas (“brightness”) According to the traditions of yoga and Ayurveda, <i>tejas<\/i> is the force of transformation within the body/mind of the individual, responsible for mental clarity, digestion, assimilation, motivation, regulating body heat, etc.",329],["p","Vahana (“vehicle”) Describes the animal or mythological creature a <i>deva<\/i> uses for transportation.",329],["p","Vajrasana (“thunderbolt pose”) A traditional posture used in Hatha Yoga to improve digestion and increase suppleness in the lower body. Performed by kneeling with the inner thighs together and the buttocks resting lightly on the heels.",329],["p","Vajrayana (“diamond vehicle”) The path of Tantric Buddhism.",329],["p","Vasudeva (“supreme being”) The father of Krishna, and also used as an alternate name for Krishna himself.",329],["p","Vayu (“air”) One of the <i>pancha mahabhuta<\/i>, “five elemental principles,” of the Indian cosmological system.",329],["p","Viniyoga (“right application”) The traditional dance and theatre usages of hand gestures described in the <i>Abhinaya Darpana<\/i> and the <i>Natya Shastra.<\/i>",329],["p","Vishnu (“preserver”) The Hindu deity worshiped in many forms or incarnations (<i>avataras<\/i>), the two most common being Rama and Krishna.",329],["p","Vishuddha Chakra (“wheel of nectar”) The energy center located in the pit of the throat, associated with the thyroid gland, pharynx, and larynx.",329],["p","Water Element (“<i>jala<\/i>”) One of the <i>pancha mahabhuta<\/i>, “five elemental principles,” of the Indian cosmological system.",329],["p","Yajna (“sacrifice”) The practice of ritual offering central to Hindu religion.",329],["p","Yantra (“instrument”) A geometric symbol used for visualization and meditation usually representing the manifestation of a specific deity or spiritual realm.",329],["p","Yoga Tattva Mudra Vijnana A branch of yogic knowledge used for healing and spiritual cultivation that deals with the relationship between the five fingers and Five Elements (<i>pancha mahabhuta<\/i>), and how to employ this knowledge to form hand gestures to create specific desired effects.",329],["p","Yoni (“source” or “vagina”) The symbol of the divine feminine principle, and the source of all creation.",329]]}]},{"t":"Bibliography","p":330,"s":[{"t":"","p":330,"b":[["p","For a complete annotated bibliography, please visit www.mudrasofindia.com.",330]]}]},{"t":"About the Authors","p":331,"s":[{"t":"","p":331,"b":[["i","i1250.webp",331]]},{"t":"Cain Carroll","p":331,"b":[["p","Cain Carroll teaches yoga, qigong, meditation, and self-healing worldwide. He has trained extensively under the guidance of Daoist, Buddhist, and Indian yoga masters. His journeys have taken him to remote areas of India, China, Nepal, Tibet, Thailand, and South America, where he received private instruction in numerous systems of practice. Cain is co-author of <i>Partner Yoga: <\/i> <i>Making Contact for Physical, Emotional and Spiritual Growth<\/i> (Rodale 2000) and creator of three self-healing DVDs: <i>Pain-Free Joints<\/i>, <i>Heal Neck and Shoulder <\/i> <i>Pain<\/i>, and <i>Digestive Power<\/i>. He served for two years as the Director of Yoga Teacher Training at Southwest Institute of Healing Arts (Tempe, AZ), and four years as Yoga Director and co-owner of Yoga Shala (Prescott, AZ). Please visit www.caincarroll.com for more information.",331]]},{"t":"Revital Carroll","p":332,"b":[["p","Native to the land of Israel, Revital has been dedicated to the study of Indian spiritual arts since childhood. Intensive study and practice of yoga and meditation in the Himalayas led her to discover her passion for Indian dance where she finds the sensual and the spiritual expressing as one. She is the creator of three instructional DVDs: <i>Temple Goddess Workout<\/i>, <i>Odissi Dance Foundations<\/i>, and<i> Odissi Dance Spins and Choreography<\/i>, and her articles about Classical Indian Dance and yoga appeared in numerous magazines. Revital offers classes, workshops and performances worldwide. She was the co-owner of Yoga Shala in Prescott, AZ, and the director of several yoga programs in North California. She draws her inspiration from the elements of nature, the wisdom of her own body, and the rich spiritual heritage of ancient India. She currently lives and teaches in the bay area of San Francisco. Visit www.shaktibhakti.com for more information.",332]]}]},{"t":"Index","p":333,"s":[{"t":"","p":333,"b":[["p","Anjali Mudra 44",333],["p","Ankusha Mudra <i>see<\/i> Kappittha",333],["p","Mudra; Shukachanchu",333],["p","Mudra",333],["p","ant-hill (denotation) 180",333],["p","anxiety-reducing mudras 34, 35,",333],["p","98, 108, 164, 165, 192",333],["p","apana and prana vayus",333],["p","harmonizing 78",333],["p","Apana Mudra 21, 45",333],["p","Apana Vayu Mudra <i>see <\/i>",333],["p","Mritsamjivani Mudra",333],["p","appearance 204",333],["p","appetite-increasing 219",333],["p","Arala Mudra 46",333],["p","Aratrika Mudra <i>see<\/i> Shikhara",333],["p","Mudra",333],["p","Archaka Mudra 47",333],["p","Ardhachandra Mudra 48",333],["p","Ardhamukula Mudra 49",333],["p","Ardhanarishwara Mudra <i>see <\/i>",333],["p","Shiva Mudra",333],["p","Ardhapataka Mudra 22, 50",333],["p","Ardharechita Mudra 51",333],["p","Ardhasuchi Mudra 52",333],["p", <script>
const DATA = JSON.parse(document.getElementById('bookdata').textContent);
const BOOK = DATA.chapters, MUD = DATA.mudras, IMG = DATA.img;
const $ = s => document.querySelector(s);
const content = $('#content'), sidebar = $('#sidebar');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let curCh = -1;
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

/* ---------- sidebar ---------- */
function buildSidebar(){
  let h = '<h4>Contents</h4>';
  BOOK.forEach((c,i)=>{
    h += '<div class="navch-wrap" data-i="'+i+'"><button class="navch" data-ch="'+i+'">' +
      '<span class="num">'+String(i+1).padStart(2,'0')+'</span><span>'+c.t+'</span></button><ul class="secs">';
    if(c.t === 'The Mudras'){
      MUD.forEach(m=>{ h += '<li><a href="#/m/'+slug(m.n)+'">'+m.n+'</a></li>'; });
    } else {
      c.s.forEach((s,j)=>{ if(s.t) h += '<li><a href="#/c/'+i+'/s/'+j+'">'+s.t+'</a></li>'; });
    }
    h += '</ul></div>';
  });
  sidebar.innerHTML = h;
  sidebar.addEventListener('click', e=>{
    if(e.target.closest('a[href^="#/m/"]')){ closeDrawer(); return; }
    const b = e.target.closest('button.navch');
    if(b){ const i = +b.dataset.ch, w = b.parentElement;
      if(curCh === i) w.classList.toggle('open'); else go('#/c/'+i); }
  });
}
function markSidebar(ci){
  sidebar.querySelectorAll('.navch').forEach(b=>b.classList.toggle('on', +b.dataset.ch===ci));
  sidebar.querySelectorAll('.navch-wrap').forEach(w=>w.classList.toggle('open', +w.dataset.i===ci));
}

/* ---------- home ---------- */
function renderHome(){
  curCh = -1; markSidebar(-1);
  const nm = MUD.length;
  let h = '<section class="hero"><h1>Mudras of India</h1>' +
    '<div class="sub">A Comprehensive Guide to the Hand Gestures of Yoga and Indian Dance — Cain Carroll &amp; Revital Carroll</div>' +
    '<p>Complete reading edition: every mudra with its photograph, English meaning, Devanagari and transliteration, plus technique, application and benefits. Search works across the whole book.</p>' +
    '<div class="stats"><div class="stat"><b>'+nm+'</b><span>Mudras</span></div>' +
    '<div class="stat"><b>'+BOOK.length+'</b><span>Chapters</span></div>' +
    '<div class="stat"><b>346</b><span>Book pages</span></div></div></section><div class="cards">';
  BOOK.forEach((c,i)=>{
    const label = c.t === 'The Mudras' ? nm+' mudras with photographs' : c.s.length+' sections';
    h += '<button class="card" data-ch="'+i+'"><div class="k">'+String(i+1).padStart(2,'0')+'</div>' +
      '<h3>'+c.t+'</h3><div class="meta">'+label+' · from p. '+c.p+'</div></button>';
  });
  h += '</div><div class="foot">Text and photographs from <b>Mudras of India</b> (Expanded Edition) by Cain Carroll and Revital Carroll, reproduced for personal study. All rights remain with the authors and publisher.</div>';
  content.innerHTML = h;
  content.querySelectorAll('.card').forEach(el=>el.onclick=()=>go('#/c/'+el.dataset.ch));
  window.scrollTo(0,0);
  document.title = 'Mudras of India — Reading Edition';
  document.body.classList.remove('idx');
}

/* ---------- reader ---------- */
function pageTag(p, last){ return last !== p ? '<span class="pm">p. '+p+'</span>' : ''; }

function renderChapter(ci, secIdx){
  curCh = ci; markSidebar(ci);
  const c = BOOK[ci], isMudras = c.t === 'The Mudras';
  let h = '<div class="chead"><div class="kicker">'+String(ci+1).padStart(2,'0')+' of '+BOOK.length+'</div>' +
    '<h1>'+c.t+'</h1><div class="meta">From book page '+c.p + (isMudras ? ' · '+MUD.length+' mudras' : ' · '+c.s.length+' sections')+'</div>';
  if(isMudras) h += '<div class="tools"><button class="btn" id="gridBtn">Show all '+MUD.length+' mudras as a gallery</button>' +
    '<button class="btn" id="azBtn">A–Z jump</button></div>';
  h += '</div>';
  if(isMudras) h += '<div id="gallery"></div><div id="azbar"></div>';
  let lastPage = -1, inEntry = false, fields = [];
  const flushFields = ()=>{
    if(!fields.length) return '';
    let f = '<div class="fields">';
    fields.forEach(([lab,val])=>{
      const isImg = /\.(webp|png)$/.test(val);
      f += '<span class="fl">'+lab+'</span><span class="val">'+(isImg ? '<img class="glyph" alt="'+lab+'" src="'+(IMG[val]||'')+'">' : val)+'</span>';
    });
    fields = [];
    return f + '</div>';
  };
  c.s.forEach((s,si)=>{
    if(s.t) h += '<h2 class="sec-h" id="s-'+ci+'-'+si+'">'+s.t+'</h2>';
    s.b.forEach((b,bi)=>{
      const k = b[0], v = b[1], pg = b[2];
      if(k !== 'f' && fields.length) h += flushFields();
      if(k === 'e'){
        if(inEntry) h += '</article>';
        inEntry = true;
        h += '<article class="entry" id="m-'+slug(v.replace(/<[^>]+>/g,''))+'"><h3 data-b="'+bi+'">'+pageTag(pg,lastPage)+v+'</h3>';
        lastPage = pg;
      } else if(k === 'f'){
        fields.push([v[0], v[1]]);
      } else if(k === 'i'){
        h += '<figure><img loading="lazy" alt="'+(c.t)+' photograph" src="'+(IMG[v]||'')+'"><figcaption>p. '+pg+'</figcaption></figure>';
        lastPage = pg;
      } else if(k === 'h'){
        h += '<h4 data-b="'+bi+'" style="font-family:var(--sans);font-size:calc(var(--fs)*.92);margin:22px 0 6px">'+pageTag(pg,lastPage)+v+'</h4>';
        lastPage = pg;
      } else {
        h += '<p data-b="'+bi+'">'+pageTag(pg,lastPage)+v+'</p>';
        lastPage = pg;
      }
    });
  });
  if(inEntry) h += '</article>';
  if(fields.length) h += flushFields();
  const prev = ci>0 ? '<a href="#/c/'+(ci-1)+'">← '+BOOK[ci-1].t+'</a>' : '<span></span>';
  const next = ci<BOOK.length-1 ? '<a class="nx" href="#/c/'+(ci+1)+'">'+BOOK[ci+1].t+' →</a>' : '<a class="nx" href="#/">Contents →</a>';
  h += '<div class="pager">'+prev+next+'</div><div class="foot">Page tags (p. n) refer to the book\'s printed pages. Text and photographs reproduced for personal study.</div>';
  content.innerHTML = h;
  document.title = c.t + ' — Mudras of India';
  document.body.classList.toggle('idx', c.t === 'Index');
  if(isMudras) wireGallery();
  if(secIdx != null){ const el = document.getElementById('s-'+ci+'-'+secIdx); if(el) el.scrollIntoView(); }
  else window.scrollTo(0,0);
}

function wireGallery(){
  const box = $('#gallery'), az = $('#azbar');
  let open = false;
  const render = ()=>{
    box.innerHTML = '<div class="grid">' + MUD.map(m =>
      '<button class="gcard" data-m="'+slug(m.n)+'">' +
      (m.i ? '<img loading="lazy" alt="'+esc(m.n)+'" src="'+(IMG[m.i]||'')+'">' : '') +
      '<span>'+m.n+'</span></button>').join('') + '</div>';
    box.querySelectorAll('.gcard').forEach(el=>el.onclick=()=>{
      location.hash = '#/m/'+el.dataset.m;
    });
  };
  const azHtml = '<div class="az">' + 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(L=>{
    const has = MUD.some(m=>m.n.toUpperCase().startsWith(L));
    return '<button data-l="'+L+'" '+(has?'':'disabled style="opacity:.35"')+'>'+L+'</button>';
  }).join('') + '</div>';
  az.innerHTML = azHtml;
  az.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
    const L = btn.dataset.l;
    const m = MUD.find(x=>x.n.toUpperCase().startsWith(L));
    if(!m) return;
    if(!open){ open = true; render(); $('#gridBtn').classList.add('on'); }
    const card = box.querySelector('[data-m="'+slug(m.n)+'"]');
    if(card) card.scrollIntoView({block:'center'});
  });
  $('#gridBtn').onclick = ()=>{
    open = !open;
    $('#gridBtn').classList.toggle('on', open);
    if(open){ render(); box.scrollIntoView(); } else box.innerHTML = '';
  };
  $('#azBtn').onclick = ()=> az.scrollIntoView({block:'center'});
}

/* ---------- routing ---------- */
function go(hash){ if(location.hash === hash) route(); else location.hash = hash; }
function route(){
  const mCh = location.hash.match(/^#\/c\/(\d+)(?:\/s\/(\d+))?/);
  const mM = location.hash.match(/^#\/m\/([a-z0-9-]+)$/);
  if(mCh){ renderChapter(+mCh[1], mCh[2]!=null ? +mCh[2] : null); }
  else if(mM){ jumpMudra(mM[1]); }
  else renderHome();
  closeDrawer();
}
function jumpMudra(sl){
  const mi = MUD.findIndex(m=>slug(m.n) === sl);
  const ci = BOOK.findIndex(c=>c.t === 'The Mudras');
  if(mi < 0 || ci < 0){ renderHome(); return; }
  if(curCh !== ci) renderChapter(ci, null);
  const el = document.getElementById('m-'+sl);
  if(el){
    el.scrollIntoView({block:'start'});
    el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1700);
    document.title = MUD[mi].n + ' — Mudras of India';
  }
}
window.addEventListener('hashchange', route);

/* ---------- search ---------- */
let INDEX = null;
function buildIndex(){
  INDEX = [];
  BOOK.forEach((c,ci)=>c.s.forEach((s,si)=>s.b.forEach((b,bi)=>{
    if(b[0] !== 'p' && b[0] !== 'h' && b[0] !== 'e') return;
    const raw = b[1].replace(/<[^>]+>/g,'');
    INDEX.push({c:ci,s:si,b:bi,p:b[2],t:raw.toLowerCase(),raw});
  })));
  MUD.forEach(m=>INDEX.push({m:slug(m.n),t:m.n.toLowerCase(),raw:m.n,p:m.p}));
}
function snippet(raw,pos,len){
  const a = Math.max(0,pos-70), b = Math.min(raw.length,pos+len+120);
  return (a>0?'… ':'') + esc(raw.slice(a,b)) + (b<raw.length?' …':'');
}
function search(q){
  const box = $('#results');
  q = q.trim();
  if(q.length < 2){ box.classList.remove('on'); box.innerHTML=''; return; }
  if(!INDEX) buildIndex();
  const ql = q.toLowerCase(), hits = [];
  for(let i=0;i<INDEX.length && hits.length<400;i++){
    const e = INDEX[i], pos = e.t.indexOf(ql);
    if(pos >= 0) hits.push({e,pos});
  }
  let h = '';
  if(!hits.length) h = '<div class="none">No match for “'+esc(q)+'”.</div>';
  else {
    h = '<div id="count">'+hits.length+(hits.length>=400?'+':'')+' results</div>';
    hits.slice(0,60).forEach(({e,pos})=>{
      const where = e.m ? ('Mudra · p. '+e.p) : (BOOK[e.c].t + ' · p. ' + e.p);
      h += '<div class="res" data-m="'+(e.m||'')+'" data-c="'+(e.c??'')+'" data-s="'+(e.s??'')+'" data-b="'+(e.b??'')+'">' +
        '<div class="where">'+esc(where)+'</div><div class="snip">'+snippet(e.raw,pos,ql.length)+'</div></div>';
    });
    if(hits.length>60) h += '<div class="none">Showing first 60 — refine to narrow it.</div>';
  }
  box.innerHTML = h; box.classList.add('on');
  box.querySelectorAll('.res').forEach(el=>{
    el.onclick = ()=>{
      $('#results').classList.remove('on'); $('#q').value='';
      if(el.dataset.m){ location.hash = '#/m/'+el.dataset.m; return; }
      const c=+el.dataset.c, s=+el.dataset.s, b=+el.dataset.b;
      location.hash = '#/c/'+c+'/s/'+s;
      setTimeout(()=>jumpBlock(c,s,b), 70);
    };
  });
}
function jumpBlock(ci,si,bi){
  const el = document.getElementById('s-'+ci+'-'+si);
  if(!el) return;
  let n = el.nextElementSibling, target = null;
  while(n && !(n.classList && n.classList.contains('sec-h'))){
    if(n.dataset && +n.dataset.b === bi){ target = n; break; }
    n = n.nextElementSibling;
  }
  (target || el).scrollIntoView({block:'center'});
  if(target){ target.classList.add('flash'); setTimeout(()=>target.classList.remove('flash'),1700); }
}

/* ---------- chrome ---------- */
const q = $('#q'); let tmr;
q.addEventListener('input', ()=>{ clearTimeout(tmr); tmr = setTimeout(()=>search(q.value), 120); });
q.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ $('#results').classList.remove('on'); q.blur(); }
  if(e.key==='Enter'){ const f = $('#results .res'); if(f) f.click(); }
});
document.addEventListener('click', e=>{ if(!e.target.closest('.searchbox')) $('#results').classList.remove('on'); });
document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement!==q){ e.preventDefault(); q.focus(); q.select(); }
  if(e.altKey && e.key==='ArrowRight' && curCh>=0 && curCh<BOOK.length-1) location.hash='#/c/'+(curCh+1);
  if(e.altKey && e.key==='ArrowLeft' && curCh>0) location.hash='#/c/'+(curCh-1);
});
function closeDrawer(){ sidebar.classList.remove('open'); }
$('#menuBtn').onclick = ()=>sidebar.classList.toggle('open');
$('#thBtn').onclick = ()=>{
  const b = document.body, order = ['','dark','sepia'];
  let i = order.indexOf(b.classList.contains('dark')?'dark':b.classList.contains('sepia')?'sepia':'');
  i = (i+1)%3;
  b.classList.toggle('dark', order[i]==='dark'); b.classList.toggle('sepia', order[i]==='sepia');
  localStorage.setItem('mud-theme', order[i]);
};
let fs = +(localStorage.getItem('mud-fs')||18);
function applyFs(){ document.documentElement.style.setProperty('--fs', fs+'px'); localStorage.setItem('mud-fs', fs); }
$('#fsUp').onclick = ()=>{ fs = Math.min(24, fs+1); applyFs(); };
$('#fsDown').onclick = ()=>{ fs = Math.max(14, fs-1); applyFs(); };
$('#pgBtn').onclick = ()=>{ document.body.classList.toggle('nopages'); localStorage.setItem('mud-pg', document.body.classList.contains('nopages')?'0':'1'); };
$('#toTop').onclick = ()=>window.scrollTo({top:0,behavior:'smooth'});
window.addEventListener('scroll', ()=>{
  const h = document.documentElement;
  $('#progress').style.width = (h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight)*100)+'%';
  $('#toTop').style.display = h.scrollTop > 900 ? 'block' : 'none';
}, {passive:true});
if(window.innerWidth < 900) $('#menuBtn').style.display='block';
window.addEventListener('resize', ()=>{ $('#menuBtn').style.display = window.innerWidth<900?'block':'none'; });
const st = localStorage.getItem('mud-theme');
if(st){ document.body.classList.toggle('dark', st==='dark'); document.body.classList.toggle('sepia', st==='sepia'); }
if(localStorage.getItem('mud-pg')==='0') document.body.classList.add('nopages');
applyFs();
buildSidebar();
route();
</script>
</body>
</html>
