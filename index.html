ce”"],250],["f",["Devanagari","deva250.webp"],250],["f",["Transliteration","trans250.webp"],250],["p","<b>Description <\/b><i>Svastikamukha Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) noted in the <i>Natya Shastra <\/i>and<i> Abhinaya Darpana. <\/i>The patron deity associated with it is<i> Guha<\/i>.46",250],["p","<b>Technique <\/b>Form <i>Tripataka Mudra<\/i> (p.253) with each hand. The right hand is held to the outside of the right shoulder, palm facing away from you, with fingers pointing upward. The left palm faces you with fingers pointing to your right. Bring the palms together.",250],["p","<b>Application <\/b>Used in the dance tradition to denote the <i>Kalpa<\/i> tree (“wishing tree”) and mountains.",250],["e","Talamukha Mudra",251],["i","i1001.webp",251],["f",["English","“palms facing”"],251],["f",["Devanagari","deva251.webp"],251],["f",["Transliteration","trans251.webp"],251],["p","<b>Description <\/b><i>Talamukha Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) noted in the <i>Natya Shastra <\/i>and in the<i> Abhinaya Darpana. <\/i>The patron deity associated with it is<i> Vinayaka<\/i> (<i>Ganesha<\/i>).",251],["p","<b>Technique <\/b>Hold the hands about 2 feet apart at hip height, with the palms facing each other at about a 45-degree angle, as if holding a <i>pakhawaj<\/i> (doubleheaded hand drum).",251],["p","<b>Application <\/b>Primarily used by performing artists to denote the following: embrace, stout, large pillar, and the lovely sounds of the drum.",251],["e","Tamrachuda Mudra",252],["i","i1005.webp",252],["f",["English","“rooster”"],252],["f",["Devanagari","deva252.webp"],252],["f",["Transliteration","trans252.webp"],252],["p","<b>Description <\/b><i>Tamrachuda Mudra <\/i>is the twenty-seventh hand gesture of the twenty-eight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>. According to mythology, this mudra came to exist when the three <i>Vedas<\/i> assumed physical form and stood before <i>Brahama<\/i> to make an exposition. The associated sage is <i>Indra<\/i>, race is <i>Deva<\/i>, color is mother-of-pearl, and patron deity is <i>Brihaspati<\/i>.",252],["p","<b>Technique <\/b>Cover the nails of the middle, ring, and little finger under the tip of the thumb. Bend the index finger like a hook.",252],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Kukkuta<\/i> (“cock”); <i>Bhaka<\/i> (“crane”); Kaka (“crow”); <i>Ushtra<\/i> (“camel”); <i>Vathsa<\/i> (“calf”); <i>Lekhanam <\/i> (“writing instrument”).",252],["p","<b>Note <\/b><i>Tamrachuda Mudra<\/i> is also noted in the <i>Natya Shastra<\/i>. However, its definition and application is identical to <i>Trishula Mudra<\/i> of the <i>Abhinaya Darpana<\/i>.",252],["e","Tattva Mudra",253],["i","i1009.webp",253],["f",["English","“principle,” “elemental quality,” or “elemental property”"],253],["f",["Devanagari","deva253.webp"],253],["f",["Transliteration","trans253.webp"],253],["p","<b>Description <\/b><i>Tattva Mudra<\/i> is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the Hindu tradition. It is used in the context of rites or rituals to signify truth, to indicate energy points on the body, traits of a deity, or to bring awareness to a given implement or sacred object.",253],["p","<b>Technique <\/b>Extend the middle finger and bend the remaining fingers toward the palm, covering the nails with the thumb.",253],["p","<b>Application <\/b>In the Hindu and yogic traditions, pointing with the index finger is considered disrespectful (since the index finger is associated with the ego). Therefore, the <i>Tattva Mudra<\/i> is used during ritual worship, <i>puja<\/i> or <i>yajna<\/i>, where pointing at sacred objects is called for.",253],["p","<b>Benefits <\/b>Nurtures self-respect and virtuous conduct, increases mindfulness.",253],["e","Trimukha Mudra",254],["i","i1013.webp",254],["f",["English","“three faces”"],254],["f",["Devanagari","deva254.webp"],254],["f",["Transliteration","trans254.webp"],254],["p","<b>Description <\/b><i>Trimukha Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the sixth gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>.",254],["p","<b>Technique <\/b>With the palms facing each other, join the tips of the middle, ring, and little fingers.",254],["p","<b>Application <\/b>In a comfortable seated position, lengthen the spine, relax the shoulders, and breathe naturally. Hold the mudra in front of the solar plexus for 5 to 45 minutes.",254],["p","<b>Benefits <\/b>Increases devotion and spiritual resolve, activates the body’s selfhealing power, reduces headaches, improves concentration.",254],["e","Tripataka Mudra",255],["i","i1017.webp",255],["f",["English","“three parts of the flag”"],255],["f",["Devanagari","deva255.webp"],255],["f",["Transliteration","trans255.webp"],255],["p","<b>Additional Name <\/b><i>Arjuna<\/i>",255],["p","<b>Description <\/b><i>Tripataka Mudra <\/i>is the second hand gesture of the twenty-eight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>. It is also noted in the <i>Natya Shastra<\/i> and <i>Abhinaya Chandrika<\/i>. According to mythology, <i>Indra<\/i> held his weapon, the <i>vajra <\/i>(“thunderbolt”), with this hand gesture. The associated sage is <i>Guha<\/i>, race is <i>Kshatriya<\/i>, color is red, and patron deity is <i>Shiva<\/i>.",255],["p","<b>Technique <\/b>Raise your hand to face outward with your fingers collected and extended upward. Bend the ring finger 90 degrees at the middle joint.",255],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Makute<\/i> (“crown”); <i>Vrikshya-bhava<\/i> (“holy tree”); <i>Vajra<\/i> (“thunderbolt”); <i>Tat-dhara-vasava<\/i> (<i>Indra <\/i> “god of heaven”); <i>Katakikusuma<\/i> (“screw-pine flower”); <i>Deepam<\/i> (“oil lamp”); <i>Vanhi-jwala-vijrumbhana<\/i> (“rising flames”); <i>Kapotham<\/i> (“pigeon” or “cheeks”); <i>Patra-lakayam<\/i> (“to draw designs” or “write a letter”); <i>Bana-artha<\/i> (“arrow”); <i>Parivartaka<\/i> (“circular movement”); <i>Stri-pumsayoh-samayoge<\/i> (“union of woman and man”). Additional usages are: invocation, descent, supporting the face, bending down, recognition, disrespect, doubt, stroking the hair, marking the third eye, wearing a turban, disgust of a bad odor or harsh sound, rubbing a horse, and flight of a bird.",255],["e","Trishula Mudra",256],["i","i1021.webp",256],["f",["English","“trident”"],256],["f",["Devanagari","deva256.webp"],256],["f",["Transliteration","trans256.webp"],256],["p","<b>Description <\/b><i>Trishula Mudra <\/i>is the twenty-eighth hand gesture of the twentyeight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana<\/i>. It is also a ritual hand position common to the Indian Tantric and the Japanese Buddhist traditions (<i>Vajrayana, Mantrayana<\/i>). It is used during the rites of the<i> Garbhadhatu Mandala <\/i>and <i>Vajradhatu Mandala.<\/i>",256],["p","<b>Technique <\/b>Raise your hand with the palm facing forward. Place the pad of the thumb over the nail of the little finger. Extend and separate the index, middle, and ring fingers.",256],["p","<b>Application <\/b>In the dance and theater tradition, it is used to denote: <i>Bilva-patra <\/i> (“bilva leaf”); <i>Trithva-yukta<\/i> (“trinity”). Additional usages: the three worlds, trident, number three, wiping out tears, and the three <i>Vedas<\/i>. According to the Tantric Buddhist tradition, the mudra denotes a trident (spiritual weapon) and represents the extinguishing of obstacles to spiritual awakening.",256],["p","<b>Benefits <\/b>Serves as a spiritual weapon against ignorance, laziness, doubt, egoism, excessive attachment, and aversion.",256],["p","<b>Note <\/b>In the <i>Natya Shastra<\/i>, this gesture is called<i> Tamrachuda Mudra<\/i>.",256],["e","Ubhaya Kartari Mudra",257],["i","i1025.webp",257],["f",["English","“both scissors”"],257],["f",["Devanagari","deva257.webp"],257],["f",["Transliteration","trans257.webp"],257],["p","<b>Description <\/b><i>Ubhaya Kartari Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) noted in the <i>Abhinaya Chandrika<\/i>.",257],["p","<b>Technique <\/b>Form <i>Kartarimukha Mudra I<\/i> (p.115) with each hand and touch the two hands at the tips of the collected thumb, ring, and little fingers.",257],["p","<b>Application <\/b>Used in Odissi Dance to denote a passionate kiss or the act of love-making between lovers.",257],["e","Upadana Mudra",258],["i","i1029.webp",258],["f",["English","“oblation/present”"],258],["f",["Devanagari","deva258.webp"],258],["f",["Transliteration","trans258.webp"],258],["p","<b>Description <\/b><i>Upadana Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) common to Odissi Dance.",258],["p","<b>Technique <\/b>Place one hand over the other, palm to back, with the fingers pointing toward the wrists. Bend both wrists so the hands are vertical in front of your torso.",258],["p","<b>Application <\/b>Used to accentuate the<i> lasya <\/i>(feminine grace) of the dancer. Mostly used in <i>Pallavis<\/i> (“pure dance”).",258],["e","Urnanabha Mudra",259],["i","i1033.webp",259],["f",["English","“spider”"],259],["f",["Devanagari","deva259.webp"],259],["f",["Transliteration","trans259.webp"],259],["p","<b>Description <\/b><i>Urnanabha Mudra <\/i>is a single-hand gesture (<i>asamyukta hasta<\/i>) noted in the <i>Natya Shastra<\/i> and <i>Abhinaya Chandrika<\/i>. According to mythology, it originated from <i>Narasimha<\/i> (the half-man–half-lion incarnation of <i>Vishnu<\/i>) when he was tearing apart the chest of the demon <i>Hiranyakasipu<\/i>. The associated sage is <i>Sardulaka<\/i>, race is <i>Kshatriya<\/i>, color is red, and patron deity is <i>Adikurma.<\/i>47",259],["p","<b>Technique <\/b>Separate and curl all five fingers toward the palm in the shape of a claw.",259],["p","<b>Application <\/b>Used by performing artists to denote: scratching the head, theft, <i>Narasimha<\/i>, deer face, lion, monkey, tortoise, the <i>karnikara<\/i> flower, breast, fear, and blood.",259],["e","Ushas Mudra",260],["i","i1037.webp",260],["f",["English","“dawn” or “break of day”"],260],["f",["Devanagari","deva260.webp"],260],["f",["Transliteration","trans260.webp"],260],["p","<b>Description <\/b><i>Ushas Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is used to open the doorway to new opportunities and courses of action.",260],["p","<b>Technique <\/b>Clasp the hands with the left index finger on top. Bring the tips of the thumbs and index fingers toward each other, forming two open rings.",260],["p","<b>Application <\/b>This mudra may be practiced while seated, standing, or lying down. For added benefit, practice outside at sunrise facing east. Let the gentle light of the rising sun fall on your skin. Feel yourself in harmony with the fresh energy of the new day.",260],["p","<b>Benefits <\/b>Awakens body and mind in the morning hours, increases creativity and productivity, benefits the pelvis and reproductive organs, increases mental clarity and alertness, harmonizes the endocrine system.",260],["e","Utsanga Mudra",261],["i","i1041.webp",261],["f",["English","“embrace”"],261],["f",["Devanagari","deva261.webp"],261],["f",["Transliteration","trans261.webp"],261],["p","<b>Description <\/b><i>Utsanga Mudra <\/i>is the seventh hand gesture of the twenty-four joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>. It is also noted in the <i>Natya Shastra.<\/i> The patron deity associated with this mudra is <i>Gautama<\/i>.",261],["p","<b>Technique <\/b>There are several variations of this gesture. Form <i>Mrigashirsha <\/i> (p.158), <i>Arala<\/i> (p.46), or<i> Chatura Mudra <\/i>(p.73) with each hand. Cross the wrists with the palms facing you, and place the hands on the outer part of the upper chest.",261],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Alingana<\/i> (“embrace”); <i>Lajayam <\/i> (“modesty” or “shyness”); <i>Angasa-adi-pradarshana<\/i> (“showing armlets or the body”); <i>Balanam-shikahana<\/i> (“nursing a baby”). It is often used to express anything to do with touch, as well as effort or anger.",261],["p","<b>Note <\/b>The subtle specifics of this hand gesture, as well as the exact placement on the body, vary from one classical text to another.",261],["e","Uttarabodhi Mudra I",262],["i","i1045.webp",262],["f",["English","“supreme awakening” or “perfect knowledge of the truth”"],262],["f",["Devanagari","deva262.webp"],262],["f",["Transliteration","trans262.webp"],262],["p","<b>Description <\/b><i>Uttarabodhi Mudra I<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to yoga tradition where it is used to connect with the source of one’s inspiration.",262],["p","<b>Technique <\/b>Interlace the fingers with the tips of the thumbs and index fingers touching. Then, press the hands together, making the opening taller and more slender.",262],["p","<b>Application <\/b>Hold the mudra in front of the chest, with the thumbs pointing down near the end of the sternum, and index fingers pointing up. You can practice while standing, seated, or lying down. Hold for 5 to 45 minutes.",262],["p","<b>Benefits <\/b>Soothes the nervous system, tones the large intestine (improving absorption and elimination), benefits the lungs and heart, serves as conductor of inspiration and new energy.",262],["p","<b>Note <\/b>This mudra may also be held in front of the pelvis with the tips of the index fingers pointed forward and slightly down.",262],["e","Uttarabodhi Mudra II",263],["i","i1049.webp",263],["f",["English","“supreme awakening” or “perfect knowledge of the truth”"],263],["f",["Devanagari","deva263.webp"],263],["f",["Transliteration","trans263.webp"],263],["p","<b>Description <\/b><i>Uttarabodhi Mudra II<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the Hindu and Buddhist (<i>Vajrayana<\/i>) traditions, where it denotes attainment of the highest enlightenment.",263],["p","<b>Technique <\/b>Clasp the hands together with the index fingers joined and extended upward. Cross the left thumb over the right.",263],["p","<b>Application <\/b>In a comfortable seated position, lengthen the spine, relax the shoulders and chest, and breathe naturally. Rest the mudra against the sternum, with the index fingers pointing upward. Feel the top of your head extending upward and your tailbone rooting to the center of the Earth. Feel a sense of openness in body and mind. Relax in stillness and hold for 5 to 45 minutes.",263],["p","<b>Benefits <\/b>Increases mental clarity, strengthens willpower, clears the central channel (<i>sushumna nadi<\/i>), makes the body feel light and rooted at the same time, works like a lightning rod to attract inspiration and insight.",263],["e","Vairagya Mudra",264],["i","i1053.webp",264],["f",["English","“conscious detachment” or “absence of worldly desires”"],264],["f",["Devanagari","deva264.webp"],264],["f",["Transliteration","trans264.webp"],264],["p","<b>Additional Name <\/b><i>Veragya<\/i>",264],["p","<b>Description <\/b><i>Vairagya Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana<\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the third gesture in the sub-set of eight mudras practiced after meditation or recitation of the <i>Gayatri Mantra<\/i>.",264],["p","<b>Technique <\/b>Join the tips of the thumbs and index fingers of each hand. Place the hands lightly on the thighs, palms facing upward.",264],["p","<b>Application <\/b>In a comfortable seated position, lengthen the spine, relax the shoulders and belly, and breathe naturally. Focus inward, feeling the hands like the two sides of a scale. Notice the feeling in your body and mind as you adjust your posture subtly to balance this scale. Hold for 5 to 45 minutes.",264],["p","<b>Benefits <\/b>Improves memory, imparts a sense of balance and equanimity, increases mental and emotional flexibility, improves one’s ability to flow with changing circumstances, serves as an energy seal during meditation.",264],["e","Vajra Mudra",265],["i","i1057.webp",265],["f",["English","“thunderbolt” or “adamantine”"],265],["f",["Devanagari","deva265.webp"],265],["f",["Transliteration","trans265.webp"],265],["p","<b>Description <\/b><i>Vajra Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition, where it is used to focus the mind and direct <i>prana <\/i> (vital energy).",265],["p","<b>Technique <\/b>Clasp the hands with the index fingers extended. Lightly press the sides of the thumbs together, touching the pads to the outsides of the index fingers.",265],["p","<b>Application <\/b><i>Vajra Mudra<\/i> may be practiced standing, seated, or lying down. Hold the mudra in front of the chest. Relax the shoulders and breathe naturally. Hold for 5 to 45 minutes.",265],["p","<b>Benefits <\/b>Aligns and opens the central channel (<i>sushumna nadi<\/i>), directs energy upward to the higher centers in the body, improves concentration, and strengthens willpower.",265],["p","<b>Note <\/b>One of the most effective ways to practice this mudra is to kneel on the floor in <i>Vajrasana <\/i> (thunderbolt pose), holding the mudra overhead, with the index fingers pointing skyward.",265],["e","Vajrapradana Mudra",266],["i","i1061.webp",266],["f",["English","“unswerving trust” or “unshakable confidence”"],266],["f",["Devanagari","deva266.webp"],266],["f",["Transliteration","trans266.webp"],266],["p","<b>Additional Name <\/b><i>Vajrashraddha<\/i>",266],["p","<b>Description <\/b><i>Vajrapradana Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition where it is used to show unshakable trust in the <i>Dharma<\/i>.",266],["p","<b>Technique <\/b>Interlace the fingers at the top knuckle. The thumbs remain extended upward.",266],["p","<b>Application <\/b>In a comfortable seated position, lengthen the spine, relax the shoulders and belly, and breathe naturally. Focus inward, feeling confidence arise in your chosen path or spiritual practice. Hold for 5 to 45 minutes.",266],["p","<b>Benefits <\/b>Increases spiritual confidence, promotes humility, increases one’s commitment to spiritual life.",266],["p","<b>Note <\/b>This mudra can be used during prayer, especially while expressing desire for spiritual guidance or assistance on the path of spiritual cultivation.",266],["e","Valita Mudra",267],["i","i1065.webp",267],["f",["English","“bent around” or “cooperation”"],267],["f",["Devanagari","deva267.webp"],267],["f",["Transliteration","trans267.webp"],267],["p","<b>Description <\/b><i>Valita Mudra<\/i> is a joint-hand dance gesture (<i>samyukta hasta<\/i>) noted in the <i>Natya Shastra. Valita Mudra<\/i> creatively frames the face to accentuate theatrical expressions.",267],["p","<b>Technique <\/b>Cross the arms at the elbows. Maintain flat palms with the fingers extended and collected. Palms face to the sides as they frame the face.",267],["p","<b>Application <\/b>Used as an esthetically pleasing formation in <i>Nritta<\/i> (“pure dance”).",267],["e","Varada Mudra",268],["i","i1069.webp",268],["f",["English","“wish fulfilling”"],268],["f",["Devanagari","deva268.webp"],268],["f",["Transliteration","trans268.webp"],268],["p","<b>Description <\/b><i>Varada Mudra <\/i>is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the Hindu and Buddhist traditions. It signifies offering, welcome, charity, giving, compassion, and sincerity.",268],["p","<b>Technique <\/b>With the palm facing forward and the fingers collected, turn the tips of the fingers to point toward the ground.",268],["p","<b>Application <\/b>Usually used in the context of rites or rituals, such as an initiation ceremony or taking of vows. It is most commonly seen in iconographic depictions (painting and sculpture) of a deity, sage, or saint, where it is generally held with the left hand, while another gesture—often <i>Abhaya <\/i> <i>Mudra—<\/i>is formed with the right.",268],["p","<b>Benefits <\/b>The benefit of <i>Varada Mudra<\/i> is traditionally associated with the onlooker witnessing the mudra instead of the person performing it. In this case, the mudra becomes like a <i>yantra<\/i> or <i>mandala<\/i>, and can be used as an object of contemplation",268],["p","<b>Note <\/b>In the dance tradition, the combination of <i>Varada<\/i> and <i>Abhaya Mudra<\/i> is often used to depict <i>Parvati<\/i> or any of the other various emanations of the goddess.",268],["e","Varaha Mudra I",269],["i","i1073.webp",269],["f",["English","“boar”"],269],["f",["Devanagari","deva269.webp"],269],["f",["Transliteration","trans269.webp"],269],["p","<b>Description <\/b><i>Varaha Mudra I<\/i> is the nineteenth hand gesture of the twenty-four joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya Darpana.<\/i>",269],["p","<b>Technique <\/b>Place the right palm over the back of the left hand. Bend the index, middle, and ring fingers at the base joint, maintaining extended and collected fingers. Stretch the little fingers directly forward to represent the tusks of the boar, and extend your thumbs sideways to represent the ears of the boar.",269],["p","<b>Application <\/b>Used by performing artists to denote a boar. <i>Varaha is<\/i> known in the Hindu tradition as the third incarnation (“<i>avatara<\/i>”) of <i>Vishnu<\/i>. To indicate the movement of the boar, undulate the wrists in an up-and-down motion.",269],["e","Varaha Mudra II",270],["i","i1077.webp",270],["f",["English","“boar”"],270],["f",["Devanagari","deva270.webp"],270],["f",["Transliteration","trans270.webp"],270],["p","<b>Description <\/b><i>Varaha Mudra II<\/i> is a less common variation of the nineteenth hand gesture of the twenty-four joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>.",270],["p","<b>Technique <\/b>Bring the backs of the hands together with fingers pointing upward. Interlock the thumbs and little fingers. Curve the index, middle, and little fingers of each hand.",270],["p","<b>Application <\/b>Used by performing artists to denote a wild boar.",270],["e","Varaha Mudra III",271],["i","i1081.webp",271],["f",["English","“boar”"],271],["f",["Devanagari","deva271.webp"],271],["f",["Transliteration","trans271.webp"],271],["p","<b>Description <\/b><i>Varaha Mudra III<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the twentieth gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>.",271],["p","<b>Technique <\/b>Hold the left hand with the palm facing you. Curl the middle, ring, and little fingers toward the palm with the index finger pointing to the right and the thumb extended upward. With the right hand, clasp the curled fingers of the left. Connect the right index finger to the left thumb. The left index finger rests on the outside of the right little finger.",271],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the chest. Lengthen the spine, relax the shoulders and belly, and breathe naturally. Hold for 5 to 45 minutes.",271],["p","<b>Benefits <\/b>Activates the body’s self-healing power, balances the immune system, increases courage and resourcefulness.",271],["e","Vardhamana Mudra",272],["i","i1085.webp",272],["f",["English","“increasing”"],272],["f",["Devanagari","deva272.webp"],272],["f",["Transliteration","trans272.webp"],272],["p","<b>Description <\/b><i>Vardhamana Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) noted in the <i>Abhinaya Darpana<\/i> and <i>Natya Shastra.<\/i> The patron deity associated is <i>Vasuki<\/i>.48",272],["p","<b>Technique <\/b>Form<i> Hamsapaksha Mudra <\/i>(p.95) with each hand, fingers pointing downward, hands separated in front of your body.",272],["p","<b>Application <\/b>Indicates the opening of things such as curtains, as well as the violent act of tearing a demon’s chest apart by a fierce deity or protector.49 The dynamic action requires the turning of the palms upward.",272],["e","Varuna Mudra I",273],["i","i1089.webp",273],["f",["English","“of the sea” or “god of the sea”"],273],["f",["Devanagari","deva273.webp"],273],["f",["Transliteration","trans273.webp"],273],["p","<b>Description <\/b><i>Varuna Mudra I<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of sixteen <i>Deva Hastas, <\/i> denoting Hindu gods and goddesses as described in the <i>Abhinaya Darpana. <\/i> It indicates the form and character of the Hindu deity <i>Varuna<\/i>.",273],["p","<b>Technique <\/b>Assume <i>Shikhara Mudra <\/i>(p.225) with your left hand and <i>Pataka <\/i> <i>Mudra <\/i>(p.186) with your right hand. Hold both hands in front of your chest.",273],["p","<b>Application <\/b>It is used to indicate <i>Varuna<\/i>, the god of the oceans, water, and sky (“celestial ocean”).",273],["p","<b>Note <\/b>There are several combinations of mudras used to express the various traits and emblems of <i>Varuna Deva<\/i>. The one indicated here appears to be the most common.",273],["e","Varuna Mudra II",274],["i","i1093.webp",274],["f",["English","“of the sea” or “god of the sea”"],274],["f",["Devanagari","deva274.webp"],274],["f",["Transliteration","trans274.webp"],274],["p","<b>Description <\/b><i>Varuna Mudra II<\/i> is single-hand gesture (<i>asamyukta hasta<\/i>) common to the yoga tradition. It is used in the <i>Yoga Tattva Mudra Vijnana <\/i> form to access the intelligence of the Water Element, and to increase the abundance of love, passion, and wholesome sexual expression.",274],["p","<b>Technique <\/b>Lightly join the tips of the thumb and little finger, leaving the remaining fingers relaxed.",274],["p","<b>Application <\/b>In a comfortable seated position, form the mudra with each hand and rest the hands on the thighs, palms facing up. With gratitude, connect with the spirit of water, feeling your body and mind become pure and fresh, like a cool mountain stream. Hold for 5 to 45 minutes.",274],["p","<b>Benefits <\/b>Cooling and calming, cures excessive thirst, reduces wrinkles and dryness of the skin, increases overall suppleness of the body, benefits the tendons, ligaments, and muscles, strengthens kidneys and bladder, nourishes and cleanses the blood and lymph, improves memory, tones the sexual organs and assists healing from trauma related to sexual abuse or shame around sexuality, awakens inner joy and vitality, enhances overall physical beauty.",274],["e","Vastra Mudra",275],["i","i1097.webp",275],["f",["English","“cloth” or “clothing”"],275],["f",["Devanagari","deva275.webp"],275],["f",["Transliteration","trans275.webp"],275],["p","<b>Description <\/b><i>Vastra Mudra <\/i>is a single-hand gesture (<i>asamyukta hasta<\/i>) noted in the <i>Abhinaya Chandrika<\/i>. It is common to the Odissi Dance tradition.",275],["p","<b>Technique <\/b>With the palm facing forward and the fingers extended, bend the middle finger 90 degrees at the second joint.",275],["p","<b>Application <\/b>Used to denote items of clothing.",275],["e","Vayu Mudra I",276],["i","i1101.webp",276],["f",["English","“wind” or “air”"],276],["f",["Devanagari","deva276.webp"],276],["f",["Transliteration","trans276.webp"],276],["p","<b>Additional names <\/b><i>Vata<\/i>, <i>Pavana<\/i>, <i>Prana<\/i>",276],["p","<b>Description <\/b><i>Vayu Mudra I <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of sixteen<i> Deva Hastas<\/i>, denoting Hindu gods and goddesses as described in the <i>Abhinaya Darpana. <\/i> It indicates the form and character of the Hindu deity <i>Vayu<\/i>.",276],["p","<b>Technique <\/b>Form <i>Ardhapataka Mudra <\/i>(p.50) with your left hand and <i>Arala <\/i> <i>Mudra<\/i> (p.46) with your right. Hold both hands in front of your chest.",276],["p","<b>Application <\/b>Used to indicate <i>Vayu<\/i>, the god of air and wind.",276],["p","<b>Note <\/b>There are several combinations of mudras used to express the various traits and emblems of <i>Vayu Deva<\/i>. The one indicated here appears to be the most common.",276],["e","Vayu Mudra II",277],["i","i1105.webp",277],["f",["English","“wind” or “air”"],277],["f",["Devanagari","deva277.webp"],277],["f",["Transliteration","trans277.webp"],277],["p","<b>Description <\/b><i>Vayu Mudra II<\/i> is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form where it is used to treat complications related to the Air Element by controlling and balancing <i>Vata Dosha<\/i> (see Appendix A).",277],["p","<b>Technique <\/b>Touch the tip of the index finger to the base of the thumb, with the thumb covering the index finger. Keep the other three fingers extended and relaxed.",277],["p","<b>Application <\/b><i>Vayu Mudra<\/i> may be used anytime in any position: walking, standing, sitting, or lying down. It is more effective to hold the mudra with each hand. For treatment of health conditions, it is ideal to practice 2 to 3 sessions per day of 10 to 45 minutes. Once the desired effects have been attained, discontinue regular practice of <i>Vayu Mudra<\/i> and continue a daily practice of <i>Prana Mudra<\/i>, <i>Varuna Mudra<\/i> and/or <i>Prithivi Mudra.<\/i>",277],["p","<b>Benefits <\/b>Reduces gas, bloating, and belching, relieves headache, reduces symptoms of paralysis, treats diseases such as polio, gout, arthritis, sciatica, and muscular trembling (as is common in Parkinson’s disease).",277],["p","<b>Note <\/b><i>Vayu Mudra<\/i> yields improved results when practiced after <i>Prana Mudra <\/i>in a given session.",277],["e","Vayu Mudra III",278],["i","i1109.webp",278],["f",["English","“wind” or “air”"],278],["f",["Devanagari","deva278.webp"],278],["f",["Transliteration","trans278.webp"],278],["p","<b>Description <\/b><i>Vayu Mudra III<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the Buddhist <i>Vajrayana<\/i> tradition. It is a Tantric mudra held by priests during performance of the <i>Garbhadhatu Mandala<\/i> (“Womb Realm”) and the <i>Vajradhatu Mandala<\/i> (“Diamond Realm”) rites, where it symbolizes the auspicious wind that scatters delusion and clears obstacles.",278],["p","<b>Technique <\/b>Touch the tip of the thumb to the base of the ring finger, and close the middle, ring, and little finger over the thumb. Hook the two index fingers at the first knuckle.",278],["p","<b>Application <\/b>In a comfortable seated position, lengthen the spine, relax the shoulders and belly, and breathe naturally. Hold for 5 to 45 minutes.",278],["p","<b>Benefits <\/b>Removes obstacles on the spiritual path, such as laziness, doubt, ignorance, egoism, excessive craving and aversion, and so on.",278],["e","Venu Mudra",279],["i","i1113.webp",279],["p","<b>English <\/b>“flute”",279],["f",["Devanagari","deva279.webp"],279],["f",["Transliteration","trans279.webp"],279],["p","<b>Description <\/b><i>Venu Mudra<\/i> is common to the Odissi Dance tradition where it is used to express the character of <i>Krishna<\/i>. It can be performed with one or two hands.",279],["p","<b>Technique <\/b>With each hand, join the tips of the middle and ring fingers with the tip of the thumb, forming a circle. Keep the little finger and index finger extended upward and slightly curved. Hold the hands to the right side of the mouth, as if playing a flute.",279],["p","<b>Application <\/b>Used exclusively to depict <i>Krishna<\/i>, as the <i>venu<\/i> flute is his most common icon.",279],["e","Vighneshvara Mudra",280],["i","i1117.webp",280],["f",["English","“remover of obstacles”"],280],["f",["Devanagari","deva280.webp"],280],["f",["Transliteration","trans280.webp"],280],["p","<b>Additional names <\/b><i>Ganesha<\/i>, <i>Ganapati<\/i>, <i>Gajanana<\/i>, <i>Vighnarat<\/i>, <i>Vinayaka<\/i>",280],["p","<b>Description <\/b><i>Vighneshvara Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of sixteen <i>Deva <\/i> <i>Hastas,<\/i> denoting Hindu gods and goddesses as described in the <i>Abhinaya <\/i> <i>Darpana<\/i>. It indicates the form and character of the Hindu deity <i>Ganesha<\/i>.",280],["p","<b>Technique <\/b>Form <i>Kapittha Mudra <\/i>(p.106) with each hand, held about 6 inches in front of the hips.",280],["p","<b>Application <\/b>Used to indicate <i>Ganesha<\/i>, the remover of obstacles.",280],["p","<b>Note <\/b>There are several combinations of mudras used to express the various traits and emblems of <i>Ganesha Deva.<\/i> The one indicated here appears to be the most common.",280],["e","Vishnu Mudra I",281],["i","i1121.webp",281],["f",["English","“god of preservation”"],281],["f",["Devanagari","deva281.webp"],281],["f",["Transliteration","trans281.webp"],281],["p","<b>Description <\/b><i>Vishnu Mudra I <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of sixteen<i> Deva Hastas<\/i>, denoting Hindu gods and goddesses as described in the<i> Abhinaya Darpana. <\/i> It indicates the form and character of the Hindu deity <i>Vishnu<\/i>.",281],["p","<b>Technique <\/b>Assume <i>Tripataka Mudra<\/i> (p.253) with each hand. Stand with your feet hip width apart. Hold the hands in front of the shoulders with the elbows at shoulder height, bending the wrists so your palms face away from you.",281],["p","<b>Application <\/b>Used to indicate <i>Vishnu<\/i>, who is worshipped as the supreme god in the <i>Vaishnava<\/i> tradition of Hinduism.",281],["p","<b>Note <\/b>There are several combinations of mudras used to express the various traits and emblems of <i>Vishnu Deva<\/i>. The one indicated here appears to be the most common. <i>Vishnu<\/i> is also represented through the mudras of the ten incarnations (<i>Dashavatara<\/i>). See Appendix C.",281],["e","Vishnu Mudra II",282],["i","i1125.webp",282],["f",["English","“god of preservation”"],282],["f",["Devanagari","deva282.webp"],282],["f",["Transliteration","trans282.webp"],282],["p","<b>Description <\/b><i>Vishnu Mudra II<\/i> is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the yoga tradition. It is used primarily during the practice of <i>pranayama<\/i> (breathing exercises) to control the left and right nostrils during techniques such as <i>Nadi Shodhana Pranayama.<\/i>50",282],["p","<b>Technique <\/b>Raise the right hand and fold the index and middle fingers into the palm. Extend the thumb, ring, and little fingers.",282],["p","<b>Application <\/b>Use <i>Vishnu Mudra<\/i> to control the volume of air passing through the nostrils during breathing exercises.51",282],["p","<b>Benefits <\/b>Provides a comfortable and elegant way to employ the delicate pressure required to control the opening and closing of the nostrils during the practice of <i>pranayama<\/i>.",282],["p","<b>Note <\/b>In the dance tradition, the same hand gesture is used to denote the <i>amalaka<\/i> tree. It is known as <i>Samyama Nayaka Mudra <\/i>in the <i>Abhinaya Darpana<\/i>.",282],["e","Vishuddha Chakra Mudra",283],["i","i1129.webp",283],["f",["English","“purified”"],283],["f",["Devanagari","deva283.webp"],283],["f",["Transliteration","trans283.webp"],283],["p","<b>Description <\/b><i>Vishuddha Chakra Mudra<\/i> is a joint-hand gesture (<i>samyukta <\/i> <i>hasta<\/i>) used in Tantric Yoga and Japanese martial arts to open the <i>Vishuddha <\/i> <i>Chakra<\/i> (the throat energy center) and improve communication.",283],["p","<b>Technique <\/b>Interlace the fingers of the hands with the tips pointing in toward the palms. Join the tips of the index fingers and thumbs, forming two interlocking rings.",283],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the throat. Place the tip of the tongue on the upper palate, and relax the shoulders and chest. Bring your attention to the spacious feeling inside the throat and neck. Settle into stillness and listen to the inner silence. Hold for 5 to 45 minutes.",283],["p","<b>Benefits <\/b>Improves the health of the thyroid and parathyroid glands, benefits the voice, reduces tension in the neck, improves communication with self and others, increases sensitivity to the thoughts and feelings of others.",283],["e","Vistara Mudra",284],["i","i1133.webp",284],["f",["English","“expansion”"],284],["f",["Devanagari","deva284.webp"],284],["f",["Transliteration","trans284.webp"],284],["p","<b>Additional Name <\/b><i>Vistritam<\/i>",284],["p","<b>Description <\/b><i>Vistara Mudra<\/i> is a joint-hand gesture (<i>samykta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i>form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the fourth gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>.",284],["p","<b>Technique <\/b>Raise the hands in front of the belly, palms facing the midline, about 10 inches apart.",284],["p","<b>Application <\/b>In a comfortable seated position, lengthen the spine and relax the belly. Adjust your breathing to be slow and deep, feeling the belly expand with the inhalation and contract with the exhalation. With the mudra in front of your abdomen, feel a sense of thickness between your hands. Allow the hands to move ever so slightly apart as you inhale, and back toward each other as you exhale. Practice this way for 5 to 20 minutes.",284],["p","<b>Benefits <\/b>Reduces arthritic pain in the hands, increases sensitivity to energy, improves blood circulation, awakens the body’s self-healing capacity, improves healing abilities.",284],["p","<b>Note <\/b>It is ideal to practice <i>Vistara Mudra<\/i> after you develop sensitivity to the feeling of energy through the practice of <i>Vitita Mudra<\/i>.",284],["e","Vitita Mudra",285],["i","i1137.webp",285],["f",["English","“bloom”"],285],["f",["Devanagari","deva285.webp"],285],["f",["Transliteration","trans285.webp"],285],["p","<b>Description <\/b><i>Vitita Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana<\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the third gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>.",285],["p","<b>Technique <\/b>Raise the hands in front of the belly, palms facing the midline, about 3 inches apart.",285],["p","<b>Application <\/b>In a comfortable seated position, lengthen the spine and relax the shoulders, chest, and belly. Adjust your breathing to be slow, smooth, deep, and even. Feel the belly expand with the inhalation and contract with the exhalation. With the mudra held in front of your abdomen, feel a sense of thickness between your hands. Allow the hands to move ever so slightly apart as you inhale, and back together as you exhale. Practice this way for 5 to 20 minutes.",285],["p","<b>Benefits <\/b>Reduces arthritic pain in the hands, increases sensitivity to energy, improves blood circulation, activates the body’s self-healing power, strengthens healing abilities.",285],["e","Vyana Mudra",286],["i","i1141.webp",286],["f",["English","“all-pervading,” “outward flowing,” or “integrated”"],286],["f",["Devanagari","deva286.webp"],286],["f",["Transliteration","trans286.webp"],286],["p","<b>Description <\/b><i>Vyana Mudra<\/i> is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana<\/i> form where it is used primarily to lower blood pressure.",286],["p","<b>Technique <\/b>Join the tips of the thumb and index finger. Touch the tip of the middle finger to the middle line of the thumb. Extend the ring and little fingers upward.",286],["p","<b>Application <\/b>In a comfortable seated position, form the mudra with each hand and place the hands in the lap, palms up. Lengthen the spine, relax the shoulders and belly, and breathe naturally. Hold for 5 to 45 minutes.",286],["p","<b>Benefits <\/b>Regulates the blood pressure, purifies the blood, decreases restlessness and insomnia, reduces redness and burning of the eyes.",286],["e","Vyapak Anjali Mudra",287],["i","i1145.webp",287],["f",["English","“all-pervading offerings”"],287],["f",["Devanagari","deva287.webp"],287],["f",["Transliteration","trans287.webp"],287],["p","<b>Description <\/b><i>Vyapak Anjali Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the eleventh gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>.",287],["p","<b>Technique <\/b>With the palms facing upward, curve the hands slightly and join the outer edges of the little fingers to create a basket-like shape in front of the heart center.",287],["p","<b>Application <\/b>In a comfortable seated position, lengthen the spine and relax the shoulders. Adjust your breathing to be slow and deep. With the mudra held in front of your heart, visualize filling your hands with all the love, compassion, and good will you can imagine. With utmost sincerity, make an offering of these virtues to benefit all beings in limitless time and space. See a connection from your heart to each individual being. Continue making offerings this way for 5 to 45 minutes (or until tears of compassion run down your cheeks).",287],["p","<b>Benefits <\/b>Lifts depression and cures excessive self-consciousness and even selfhatred, ignites the heart of true compassion for self and others, increases devotion and commitment to honestly living a spiritual life.",287],["p","<b>Note <\/b>In the version shown here, the hands are slightly cupped. However, the mudra is often seen practiced with the hands in a more flat position, resembling an offering platter.",287],["e","Yama Mudra",288],["i","i1149.webp",288],["f",["English","“god of death”"],288],["f",["Devanagari","deva288.webp"],288],["f",["Transliteration","trans288.webp"],288],["p","<b>Additional Name <\/b><i>Yamaraja<\/i>",288],["p","<b>Description <\/b><i>Yama Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of sixteen <i>Deva Hastas<\/i>, denoting Hindu gods and goddesses as described in the <i>Abhinaya Darpana. <\/i> It indicates the form and character of the Hindu deity <i>Yama.<\/i>",288],["p","<b>Technique <\/b>Form <i>Tamrachuda Mudra<\/i> (p.250) with your left hand and <i>Suchi <\/i> <i>Mudra <\/i>(p.240) with your right hand. Hold the left hand in front of your waist, slightly to your left. Point to the left hand with the right index finger.",288],["p","<b>Application <\/b>It is used to indicate <i>Yama<\/i>, the Hindu god of death. The left hand simulates a hook, which denotes the way death “hooks” his victims when they are ready to submit themselves to the inevitable.",288],["p","<b>Note <\/b>There are several combinations of mudras used to express the various traits and emblems of <i>Yama Deva<\/i>. The one indicated here appears to be the most common.",288],["e","Yamapasha Mudra",289],["i","i1153.webp",289],["f",["English","“noose of death”"],289],["f",["Devanagari","deva289.webp"],289],["f",["Transliteration","trans289.webp"],289],["p","<b>Description <\/b><i>Yampasha Mudra<\/i> is a joint-hand gesture (s<i>amyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the thirteenth gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>.",289],["p","<b>Technique <\/b>On each hand, extend the index fingers and join the remaining fingers together with the thumb. Hook the index fingers, with the left hand facing up and the right hand facing down.",289],["p","<b>Application <\/b>In a comfortable seated position, lengthen the spine and relax the shoulders, chest, and belly. Adjust your breathing to be slow, smooth, and even. Hold the mudra in front of your heart for 5 to 20 minutes.",289],["p","<b>Benefits <\/b>Opens the airways, strengthens the lungs and large intestine, stimulates the immune system, evokes the spiritual insight of the interdependent nature of all phenomena (death creates life, life creates death).",289],["e","Yoni Mudra I",290],["i","i1159.webp",290],["f",["English","“vulva” or “origin”"],290],["f",["Devanagari","deva290.webp"],290],["f",["Transliteration","trans290.webp"],290],["p","Back",290],["p","<b>Description <\/b><i>Yoni Mudra I<\/i> is an intricate joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the fourth gesture in the sub-set of eight mudras practiced after meditation or recitation of the <i>Gayatri Mantra<\/i>.",290],["p","<b>Technique <\/b>Join the palms together in front of the chest. Cross the ring fingers and open the hand like a book. Place the right ring finger on top of the left middle finger. Place the left ring finger on top of the right middle finger. Hook the tip of the right ring finger with the left index, and hook the tip of the left ring finger with the right index. Close the hands slowly, bringing the pads of the middle fingers together. The little fingers are crossed in back and the thumbs are parallel.",290],["i","i1157.webp",290],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the heart or pelvis. Place the tip of the tongue on the upper palate, and relax the shoulders and chest. Bring your attention to the spacious feeling inside the heart and watery feeling inside the pelvis. Settle into stillness and, without judging or interfering, simply be receptive to whatever arises. Hold for 5 to 45 minutes.",290],["p","Front <b>Benefits <\/b>Improves the health of the sexual organs, invites a healthy sense of sacredness around sexuality, increases receptivity, fluidity, and emotional sensitivity, serves as a gateway to embrace what we can’t understand (mystery), creates a physical mandala to worship the Divine Feminine.",291],["p","<b>Note <\/b>The effects of practicing <i>Yoni Mudra<\/i> can be enhanced by chanting traditional mantras associated with <i>Shakti<\/i> or <i>Devi<\/i>, or by singing <i>bhajans<\/i> (spiritual songs) dedicated to the Divine Mother or any of the many aspects of the goddess.",291],["e","Yoni Mudra II",292],["i","i1165.webp",292],["f",["English","“vulva” or “origin”"],292],["f",["Devanagari","deva292.webp"],292],["f",["Transliteration","trans292.webp"],292],["p","<b>Description <\/b><i>Yoni Mudra II <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the Hindu and Buddhist <i>Vajrayana<\/i> traditions. It is a Tantric mudra usually employed by priests or devotees during performance of sacred rites or rituals.",292],["p","<b>Technique <\/b>Extend the index fingers and thumbs of each hand, folding the remaining fingers into the palm. Join the tips of the extended fingers, forming a triangular shape.",292],["p","<b>Application <\/b>There are two main applications of this mudra: (1) hold the gesture in front of the heart with the index fingers pointing upward; (2) hold the mudra in front of the pelvis with the index fingers pointing downward. Ideally, the upward (masculine) and downward (feminine) versions of the mudra are practiced together in a single session. Start by practicing 5 minutes in each position, and build up time, as you feel ready. So long as your breathing remains calm and natural, and your shoulders and chest stay relaxed, you may practice for as long as you like.",292],["p","<b>Benefits <\/b>Harmonizes the sexual and spiritual energies within the body, creates a connection between the heart (love) and the sexual glands (creative energy).",292],["e","Yoni Mudra III",293],["i","i1169.webp",293],["f",["English","“vulva” or “origin”"],293],["f",["Devanagari","deva293.webp"],293],["f",["Transliteration","trans293.webp"],293],["p","<b>Description <\/b><i>Yoni Mudra III<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana<\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the fourth gesture in the sub-set of eight mudras practiced after meditation or recitation of the <i>Gayatri Mantra<\/i>.",293],["p","<b>Technique <\/b>Turn the palms upward and join the hands at the outer edges. Cross the right ring finger over the left, join the tips of the middle fingers, and connect the outer edges of the little fingers. Touch the tips of the thumbs to the bases of the little fingers.",293],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the heart. Place the tip of the tongue on the upper palate, and relax the shoulders and chest. Bring your attention to the spacious feeling inside the heart and watery feeling inside the pelvis. Settle into stillness and, without judging or interfering, simply be receptive to whatever arises. Hold for 5 to 45 minutes.",293],["p","<b>Benefits <\/b>Improves the health of the kidneys and bladder, benefits the sexual glands (testes in men, ovaries in women), reduces dryness in the body, increases the luster of the skin and hair, strengthens connection with the principal of the Divine Feminine, increases devotion and loving kindness.",293],["p","<b>Note <\/b>Although they are different in appearance, <i>Yoni Mudra III<\/i> and <i>Yoni Mudra I<\/i> are considered to have similar healing properties and spiritual significance, and are used interchangeably in different traditions of yoga.",293]]}]},{"t":"Benefits of Hand Mudras","p":294,"s":[{"t":"","p":294,"b":[["p","Below is an index of specific health conditions and categories of benefit in alphabetical order. Each category has a group of mudras that address the specific concern. Since many of the mudras have a wide range of benefits, and numerous mudras have overlapping benefits, gestures frequently appear in more than one group.",294],["p","When exploring the mudras in a certain group, with the intent of addressing a desired outcome, it is important to remember that mudras are not an exact science, and that intuition and investigation are a part of the journey. You might first acquaint yourself with all the mudras on a particular list. Then, decide which ones you resonate most strongly with and continue regular practice of those. After some time, your sensitivity and condition may change. Keep revisiting the list to discover new mudras that yield unforeseen results. Above all, trust your inner guidance and have fun!",294]]},{"t":"Addiction","p":294,"b":[["p","Kaleshvara Mudra Karana Mudra Rudra Mudra Sahasrara Mudra Samputa Mudra II",294]]},{"t":"Anxiety","p":294,"b":[["p","Abhaya Mudra II Hridaya Mudra Jnana Mudra Kashyapa Mudra Mushti Mudra Mushtika Mudra Panchamukha Mudra Pralamba Mudra Purna Jnana Mudra Rudra Mudra Sahasrara Mudra Shakti Mudra Shukri Mudra Uttarabodhi Mudra I Vyana Mudra",295]]},{"t":"Arthritis","p":295,"b":[["p","Apana Mudra Jnana Mudra Rudra Mudra Shukri Mudra Surabhi Mudra Vayu Mudra Vistara Mudra Vitita Mudra",295]]},{"t":"Bones / Healing From Broken Bone","p":295,"b":[["p","Akasha Mudra Shankha Mudra II Shanmukha Mudra Sumukha Mudra",295]]},{"t":"Brain","p":295,"b":[["p","Kaleshvara Mudra Mahashirsha Mudra Nirvana Mudra Panchamukha Mudra Purna Jnana Mudra Sahasrara Mudra Uttarabodhi Mudra I Uttarabodhi Mudra II",295]]},{"t":"Cancer","p":295,"b":[["p","Abhaya Hrdaya Mudra Chonmukha Mukha Mudra Granthita Mudra Kurma Mudra III Mahakranta Mudra",295],["p","Mritsamjivani Mudra Mudgara Mudra Pallava Mudra II Samputa Mudra II Shanmukha Mudra Simhakranta Mudra Varaha Mudra III Vistara Mudra Vitita Mudra",296]]},{"t":"Chakras","p":296,"b":[["p","Ajna Chakra: Mahashirsha Mudra, Nirvana Mudra Anahata Chakra: Mritsamjivani Mudra, Padma Mudra Manipura Chakra: Adhomukha Mudra, Garuda Mudra II,",296],["p","Manipura Chakra Mudra, Rudra Mudra, Surabhi Mudra Muladhara Chakra: Gada Mudra, Muladhara Chakra Mudra, Mushti Mudra II Sahasrara Chakra: Sahasrara Mudra Svadhisthana Chakra: Kamajayi Mudra, Shakti Mudra, Svadhisthana Chakra Mudra Vishudha Chakra: Granthita Mudra, Vishuddha Chakra Mudra",296]]},{"t":"Common Cold","p":296,"b":[["p","Abhaya Hrdaya Mudra Linga Mudra Prana Mudra Purna Jnana Mudra Samputa Mudra II Shanmukha Mudra Shukri Mudra Simhakranta Mudra Surabhi Mudra Surya Mudra Yamapasha Mudra",296]]},{"t":"Concentration","p":296,"b":[["p","Abhaya Mudra Ajna Chakra Mudra Bhairava Mudra Chin Mudra",296],["p","Mahashirsha Mudra Panchamukha Mudra Sahasrara Mudra Shankha Mudra II Shanmukhi Mudra Sumukha Mudra Trimukha Mudra Uttarabodhi Mudra I Uttarabodhi Mudra II Vajra Mudra",297]]},{"t":"Constipation","p":297,"b":[["p","Apana Mudra Chakra Mudra II Rudra Mudra Samputa Mudra II",297]]},{"t":"Courage","p":297,"b":[["p","Chakra Mudra II Ganesha Mudra Garuda Mudra II Linga Mudra Mudgara Mudra Simhakranta Mudra Varaha Mudra III",297]]},{"t":"Depression ","p":297,"b":[["p","Chin Mudra Hamsi Mudra Jnana Mudra Kaleshvara Mudra Linga Mudra Phupphusamocana Mudra Rudra Mudra Sahasrara Mudra Surya Mudra Uttarabodhi Mudra I Uttarabodhi Mudra II Vyapak Anjali Mudra",297]]},{"t":"Detox","p":298,"b":[["p","Adhomukha Mudra Apana Mudra Garuda Mudra II Hamsi Mudra Karana Mudra Samputa Mudra II Surya Mudra Uttarabodhi Mudra I Vyana Mudra",298]]},{"t":"Devotion","p":298,"b":[["p","Anjali Mudra Avahana Mudra Kilaka Mudra II Mandala Mudra Nirvana Mudra Shanmukha Mudra Simhakranta Mudra Surabhi Mudra Trimukha Mudra Vajrapradana Mudra Vyapak Anjali Mudra",298]]},{"t":"Digestion","p":298,"b":[["p","Abhaya Hrdaya Mudra Adhomukha Mudra Apana Mudra Ashvaratna Mudra Avahana Mudra Chakra Mudra II Kangula Mudra Manipura Chakra Mudra Prana Mudra Prithivi Mudra Shankha Mudra Surabhi Mudra Vayu Mudra Vayu Mudra II",298]]},{"t":"Ears (earache, travel sickness, improved hearing)","p":299,"b":[["p","Shunya Mudra",299]]},{"t":"Emotional Balance","p":299,"b":[["p","Anahata Chakra Mudra Hridaya Mudra Mushti Mudra II Prithivi Mudra Samputa Mudra II Shukri Mudra Uttarabodhi Mudra I",299]]},{"t":"Endocrine System","p":299,"b":[["p","Abhaya Hrdaya Mudra Ajna Chakra Mudra Gada Mudra Kamajayi Mudra Muladhara Chakra Mudra Sahasrara Mudra Ushas Mudra Vairagya Mudra Vishuddha Chakra Mudra",299]]},{"t":"Eyes","p":299,"b":[["p","Mahashirsha Mudra Prana Mudra Vyana Mudra",299]]},{"t":"Fatigue / Weakness","p":299,"b":[["p","Abhaya Hrdaya Mudra Ashvaratna Mudra Kamajayi Mudra Linga Mudra Mushti Mudra II Prana Mudra Prithivi Mudra Rudra Mudra Shukri Mudra",299]]},{"t":"Fear","p":300,"b":[["p","Abhaya Mudra I Abhaya Hrdaya Mudra Chakra Mudra II Kashyapa Mudra Kilaka Mudra II Mushti Mudra II Uttarabodhi M Mudra Muladhara Chakra Mudra Shakti Mudra Shankha Mudra II Svadhisthana Chakra Mudra Ushas Mudra Varuna Mudra II Yoni Mudra I Yoni Mudra II Yoni Mudra III",303]]},{"t":"Skin Health","p":303,"b":[["p","Apana Mudra Karana Mudra Prithivi Mudra Varuna Mudra II",303]]},{"t":"Sleep","p":303,"b":[["p","Kilaka Mudra II Kurma Mudra III Mushti Mudra II Vyana Mudra",303]]},{"t":"Spine","p":303,"b":[["p","Gada Mudra Uttarabodhi Mudra II Vajra Mudra",303]]},{"t":"Spiritual Awakening","p":303,"b":[["p","Ajna Chakra Mudra Anjali Mudra Bam Mudra Bhairava Mudra Dharmachakra Mudra Dhyana Mudra Kubera Mudra II Mandala Mudra Mushtika Mudra Nirvana Mudra Purna Jnana Mudra Shankhavarta Mudra Trishula Mudra Uttarabodhi Mudra II Vajra Mudra",303],["p","Vayu Mudra III Vyapak Anjali Mudra Yamapasha Mudra",304]]},{"t":"Stress Reduction ","p":304,"b":[["p","Hridaya Mudra Kurma Mudra III Padma Mudra Samputa Mudra II",304]]},{"t":"Travel","p":304,"b":[["p","Mushti Mudra Prana Mudra Prithivi Mudra Shunya Mudra",304]]},{"t":"Tremors","p":304,"b":[["p","Vayu Mudra II",304]]},{"t":"Voice / Stuttering","p":304,"b":[["p","Granthita Mudra Matangi Mudra Shankha Mudra II Vishuddha Chakra Mudra",304]]},{"t":"Weight Loss","p":304,"b":[["p","Linga Mudra Rudra Mudra Surya Mudra",304]]},{"t":"Willpower","p":304,"b":[["p","Linga Mudra Manipura Chakra Mudra Uttarabodhi Mudra I Uttarabodhi Mudra II Vajra Mudra",304]]},{"t":"Women’s Health","p":304,"b":[["p","Anahata Chakra Mudra Apana Mudra Gada Mudra",304],["p","Kapittha Mudra II Kilaka Mudra II Mahatrika Mudra Muladhara Chakra Mudra Shakti Mudra Shankha Mudra II Svadhisthana Chakra Mudra Ushas Mudra Varuna Mudra II Yoni Mudra I Yoni Mudra II Yoni Mudra III",305]]}]},{"t":"Appendix A: Energy Anatomy","p":306,"s":[{"t":"","p":306,"b":[["e","<i>Energy Anatomy<\/i>",306]]},{"t":"The Seven Chakras of Indian Tantric Yoga","p":306,"b":[["p","1. <b>Muladhara Chakra<\/b>—<i>mula<\/i> (“base” or “root”), <i>adhara<\/i> (“support”)",306],["p","Location: Perineum, below genitals, above anus, base of spine",306],["p","Element: Earth",306],["p","Number of Petals: 4",306],["p","Elemental Color: Shining yellow1",306],["p","Ruling Planet: Mars",306],["p","Governs: Feet, legs, anus, and elimination",306],["p","Positive Attributes: Stability, loyalty",306],["p","Negative Attributes: Stubbornness, heavy mindedness",306],["p","2. <b>Svadhishthana Chakra<\/b>—<i>sva<\/i> (“self”), <i>adhisthana<\/i> (“dwelling place”)",306],["p","Location: Genital region",306],["p","Element: Water",306],["p","Number of Petals: 6",306],["p","Elemental Color: Light blue",306],["p","Ruling Planet: Mercury",306],["p","Governs: Reproductive system, power to create",306],["p","Positive Attributes: Flexibility, openness, intuitiveness",306],["p","Negative Attributes: Ungrounded-ness, unconscious leakage of sexual energy 3. <b>Manipura Chakra<\/b>—<i>mani<\/i> (“jewel”), <i>pura<\/i> (“filled with” or “city”)",307],["p","Location: Behind navel, toward spine",307],["p","Element: Fire",307],["p","Number of Petals: 10",307],["p","Elemental Color: Sunrise red",307],["p","Ruling Planet: Sun",307],["p","Governs: Digestion, assimilation",307],["p","Positive Attributes: Zest for life, vitality, self-control",307],["p","Negative Attributes: Ruthlessness, abuse of power, self-abuse",307],["p","4. <b>Anahata Chakra<\/b>—(“un-struck sound”)",307],["p","Location: Heart region of the spine",307],["p","Element: Air",307],["p","Number of Petals: 12",307],["p","Elemental Color: Smoky grey",307],["p","Ruling Planet: Venus",307],["p","Governs: Heart, diaphragm, lungs, arms, and hands",307],["p","Positive Attributes: Devotion, love, compassion",307],["p","Negative Attributes: Attachment, rampant emotions, hate",307],["p","5. <b>Vishudha Chakra<\/b>—(“pure”)",307],["p","Location: Throat area",307],["p","Element: Ether/Space",307],["p","Number of Petals: 16",307],["p","Elemental Color: White (like the full moon)",307],["p","Ruling Planet: Jupiter",307],["p","Governs: Speech, thyroid, parathyroid",307],["p","Positive Attributes: Expansiveness, silence, deep calm",307],["p","Negative Attributes: Spacey-ness, boredom, restlessness 6. <b>Ajna Chakra<\/b>—(“enhanced knowledge”)",308],["p","Location: Point between eyebrows, base of skull",308],["p","Element: Mind",308],["p","Number of Petals: 2",308],["p","Elemental Color: Pure white",308],["p","Ruling Planet: Saturn",308],["p","Governs: Intellect, seat of enlightenment",308],["p","Positive Attributes: Alignment, radiant joy, wisdom",308],["p","Negative Attributes: Overly intellectual, coldly rational",308],["p","7. <b>Sahasrara Chakra<\/b>—(“thousand petalled”)",308],["p","Location: Above the top of the head",308],["p","Element: None",308],["p","Number of Petals: Infinite",308],["p","Elemental Color: Clear light, colorless",308],["p","Ruling Planet: None",308],["p","Governs: Doorway to non-duality",308],["p","Attributes: Non-duality, beyond positive/negative, infinite",308]]},{"t":"The Five Vayus","p":308,"b":[["p","Through thousands of years of research into the functioning of the human bodymind, ancient yogis discovered that <i>prana<\/i> flows in distinct ways in certain areas of the body. They likened these patterns to the way currents and eddies function in a moving river, and found these unique energies play important roles in the functioning of related tissues and organs. Their findings are summarized in what is called the theory of the Five Winds (<i>Pancha Vayu<\/i>).",308],["p","1. <i>Apana Vayu<\/i> (“downward wind”)—resides in the pelvis and legs, governs",308],["p","the organs of elimination and reproduction.",308],["p","2. <i>Prana Vayu<\/i> (“vital wind”)—resides in the chest region (from the throat",308],["p","to the navel), governs the heart and lungs and serves to “fill” all the other <i>vayus<\/i> with vigor.",308],["p","3. <i>Samana Vayu<\/i> (“stable wind”)—resides in the abdomen, governs the organs",308],["p","of digestion and assimilation.",308],["p","4. <i>Udana Vayu <\/i>(“rising wind”)—resides in the head and neck, governs",309],["p","speech, swallowing, the eyes, brain, and hair.",309],["p","5. <i>Vyana Vayu<\/i> (“pervading wind”)—the roaming <i>vayu<\/i>; located everywhere",309],["p","in the body, this <i>vayu<\/i> serves to coalesce and harmonize the other four into a cohesive whole.",309]]},{"t":"Five Fingers and Five Elements","p":309,"b":[["p","The element and finger associations are listed below according to the<i> Yoga <\/i> <i>Tattva Mudra Vijnana<\/i> system, the most prominent Indian system informing the practice of hand mudras for healing and spiritual development. There are other systems where the fingers are given different elemental associations than the ones employed here.",309]]},{"t":"Finger  — Finger  — Element  — Element ","p":309,"b":[]},{"t":"(English) — (Sanskrit) — (English) — (Sanskrit)","p":309,"b":[["p","Thumb — <i>Angushtha<\/i> — Fire — <i>Agni<\/i>",309],["p","Index — <i>Tarjani<\/i> — Air — <i>Vayu<\/i>",309],["p","Middle — <i>Madhya<\/i> — Ether/Space — <i>Akasha<\/i>",309],["p","Ring — <i>Anamika<\/i> — Earth — <i>Prithivi<\/i>",309],["p","Little — <i>Kanishthika<\/i> — Water — <i>Apas<\/i>",309]]},{"t":"The Three Doshas","p":309,"b":[["p","<i>Dosha<\/i> literally means (“blemish”) or (“tendency toward imbalance”). The human experience is colored by the dance of three <i>doshas<\/i>: <i>Vata<\/i>, <i>Pitta<\/i>, <i>and Kapha<\/i>. The interplay of these three powers largely determines the health of the body-mind, the rate of aging, and the susceptibility to disease. In each individual, one of the three <i>doshas<\/i> predominates and determines the basic constitution, or body-mind “type.”",309],["p","1. <i>Vata<\/i> (Air + Ether/Space)—<i>Vata<\/i> literally means (“wind”). It is composed",309],["p","of air in movement and ether (space) in substance. <i>Vata<\/i> is the motivating force behind the other two <i>doshas<\/i>. It exists as the empty spaces in the body: joints, hollow organs, the bone cavities of the hips and low back. More subtly, <i>Vata<\/i> moves in the inner space of mind. Disturbed <i>Vata <\/i> produces: mental nervousness, digestive disorders (gas), low energy, drying and weakening of body tissues. Since <i>Vata<\/i> is the origin of the other two <i>doshas<\/i>, its health depends on the amount of <i>Pitta<\/i> and <i>Kapha <\/i> present to balance and stabilize it. Unstabilized <i>Vata<\/i> moves so much it burns itself out.",310],["p","2. <i>Pitta<\/i> (Fire + Water)—<i>Pitta<\/i> literally means (“cooking”) or (“digesting",310],["p","power”). Since fire cannot exist directly in the body, <i>Pitta<\/i> is the fire held in the water and oil of the cells. It is the heat of transformation and digestion held in the body’s tissues. More subtly, it is the force that allows for “digestion” and “assimilation” of life’s experiences to create meaning and understanding. Imbalanced <i>Pitta<\/i> can manifest as excess toxic buildup, infection, inflammation, acid, and irritability. The health of <i>Pitta <\/i> depends on <i>Vata<\/i> for smooth movement and <i>Kapha<\/i> for grounding.",310],["p","3. <i>Kapha<\/i> (Water + Earth)—<i>Kapha<\/i> literally means (“what makes things stick",310],["p","together”). <i>Kapha<\/i> is the power of cohesion. <i>Kapha<\/i> is water held in the medium of earth. In the body, <i>Kapha’<\/i>s root is the plasma, and its presence can be noted in the mucous linings, the heavy oily substances of the body. Imbalanced <i>Kapha<\/i> can manifest as excess mucus, fat, sluggishness, dull mind, swollen glands, or feeling stuck in life. <i>Kapha<\/i> depends on <i>Vata<\/i> for its stimulus to move, and <i>Pitta<\/i> to keep it warm enough to move at all. Simply put, if <i>Kapha<\/i> doesn’t move, it stagnates and develops into disease.",310],["p","Each person has a unique blend of the three <i>doshas<\/i>. The presence of each dosha in varying amounts makes up their signature constitution. For example, a person with a dominance of <i>Pitta<\/i> as well as a high level of <i>Vata<\/i> would be considered a <i>Pitta Vata<\/i> type. There is no one type that is better or more desirable; each has its benefits and difficulties. What is paramount to take from the theory of <i>doshas<\/i>, and its relationship to mudras, is that we can use the methods of yoga and Ayurveda to skillfully bring our unique constitution into balance to sustain a life of radiant health and happiness.",310]]}]},{"t":"Appendix B: The Gayatri Mudras","p":311,"s":[{"t":"","p":311,"b":[["e","<i>The Gayatri Mudras<\/i>",311],["p","The thirty-two <i>Gayatri Mudras<\/i> listed below are a traditional set of Vedic hand gestures corresponding to the practice of <i>Gayatri Japa<\/i> (recitation of the <i>Gayatri <\/i> <i>Mantra<\/i>). For many ardent devotees of the Vedic tradition, performance of <i>Gayatri sadhana<\/i> (“devoted practice”) is done three times per day: sunrise, noon, and sunset. Slow, rhythmic execution of the <i>mudras<\/i>, along with the chanting of the mantra, is said to completely balance body and mind, impart good health and longevity, and illuminate the spirit of the <i>sadhaka<\/i> (practitioner). The <i>Gayatri <\/i> <i>Mantra<\/i> has twenty-four syllables and there are twenty-four <i>Gayatri Mudras<\/i> that correspond to the mantra, plus eight additional mudras that are practiced at the conclusion of chanting and meditation.",311]]},{"t":"Twenty-Four Pre-Meditation Mudras","p":311,"b":[["p","1. Sumukha",311],["p","2. Samputa",311],["p","3. Vitita",311],["p","4. Vistara",311],["p","5. Dvimukha",311],["p","6. Trimukha",311],["p","7. Chaturmukha",311],["p","8. Panchamukha",311],["p","9. Shanmukha",311],["p","10. Adhomukha",311],["p","11. Vyapak Anjali",311],["p","12. Shakata",311],["p","13. Yampasha 14. Granthita",312],["p","15. Chonmukha Mukha",312],["p","16. Pralamba",312],["p","17. Mushtika",312],["p","18. Matsya",312],["p","19. Kurma",312],["p","20. Varaha",312],["p","21. Simhakranta",312],["p","22. Mahakranta",312],["p","23. Mudgara",312],["p","24. Pallava",312]]},{"t":"Eight Post-Meditation Mudras","p":312,"b":[["p","1. Surabhi",312],["p","2. Purna Jnana",312],["p","3. Vairagya",312],["p","4. Yoni",312],["p","5. Shankha",312],["p","6. Padma",312],["p","7. Linga",312],["p","8. Nirvana",312]]}]},{"t":"Appendix C: Dance Mudra Sets","p":313,"s":[{"t":"","p":313,"b":[["e","<i>Dance Mudra Sets<\/i>",313],["p","Several established sequences of dance mudras are classified in the <i>Abhinaya <\/i> <i>Darpana<\/i> and <i>Natya Shastra<\/i>. As an aid to studying these various sets, we have included some of the most common sequences below.",313]]},{"t":"Dashavatara Hastas: Hand Mudras Representing","p":313,"b":[]},{"t":"the Ten Incarnations of Vishnu","p":313,"b":[["p","<i>Dashavatara <\/i>refers to the ten principal incarnations of <i>Vishnu<\/i> or sometimes <i>Krishna<\/i>. Depicting these ten incarnations and their symbolic hand gestures is a common theme in Classical Indian Dance and other art forms in India. The concept of <i>Dashavatara<\/i> is innermost to <i>Vaishnavaite<\/i> Hinduism, and has deep and encompassing implications on this culture’s worldview, spirituality, and art. The <i>Avatara<\/i> doctrine was first clearly articulated in the <i>Bhagavadgita<\/i>, and elaborated upon in the <i>Puranas<\/i>, <i>Giga Govinda<\/i>, <i>Abhinaya Darpana<\/i>, and numerous other texts throughout India. It denotes those <i>avataras<\/i> most prominent in terms of their importance in Hindu mythology. The tenth is predicted to appear at the end of the <i>Kali Yuga<\/i>. According to the <i>Vishnu Purana<\/i> and the <i>Bhagavata Purana<\/i>, <i>Kali Yuga<\/i> will end with the apparition of <i>Kalki Avatara<\/i>, who will defeat evil, liberate the virtuous, and initiate a new era.",313],["p","<b>Sanskrit<\/b> — <b>English<\/b> — <b>Primary Mudras<\/b> — <b>Notes<\/b>",313],["p","Moving the hands in <i>Matsya Mudra<\/i> held at <i>Matsya<\/i> — Fish — a zigzag motion lik
