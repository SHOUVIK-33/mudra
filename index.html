<style>
:root{

}

  --bg:#131211; --panel:#1a1917; --ink:#eae6dd; --muted:#9c968b; --line:#2b2925;
  --accent:#e0a267; --accent-soft:#241d16; --mark:#4a3a12; --shadow:0 1px 2px rgba(0,0,0,.5);
}

  --accent:#8a4b1c; --accent-soft:#efe2c8; --mark:#f3d98a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}

header.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;

  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.spacer{flex:1}
.searchbox{position:relative;flex:0 1 400px;min-width:110px}
.searchbox input{width:100%;padding:9px 12px 9px 34px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:14px;font-family:var(--sans)}
.searchbox input:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:1px}
.searchbox .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;
  padding:7px 10px;font-size:13px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.btn.icon{padding:7px 9px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;z-index:60}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 57px)}
aside{position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;border-right:1px solid var(--line);
  background:var(--panel);padding:12px 8px 70px}
aside h4{margin:10px 10px 6px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
.navch{width:100%;text-align:left;border:0;background:none;color:var(--ink);font-family:var(--sans);
  font-size:13.5px;padding:8px 10px;border-radius:7px;cursor:pointer;line-height:1.3;display:flex;gap:8px}
.navch:hover{background:var(--accent-soft)}
.navch .num{color:var(--muted);font-size:12px;min-width:16px;font-variant-numeric:tabular-nums}
.navch.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.secs{display:none;margin:0 0 6px 26px;padding:0;list-style:none;border-left:1px solid var(--line);max-height:52vh;overflow:auto}
.navch-wrap.open .secs{display:block}
.secs a{display:block;font-size:12.5px;color:var(--muted);padding:4px 8px;line-height:1.35;border-radius:5px}
.secs a:hover{color:var(--ink);background:var(--accent-soft);text-decoration:none}
main{padding:0 0 120px;min-width:0}
.wrap{max-width:860px;margin:0 auto;padding:0 28px}
.hero{padding:48px 0 10px;border-bottom:1px solid var(--line);margin-bottom:26px}
.hero h1{font-family:var(--serif);font-size:clamp(28px,4.2vw,44px);line-height:1.08;margin:0 0 6px;letter-spacing:-.6px}
.hero .sub{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:16px;margin:0 0 16px}
.hero p{color:var(--muted);margin:0 0 18px;font-size:15px;line-height:1.6;max-width:64ch}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin:0 0 24px}
.stat b{display:block;font-family:var(--serif);font-size:22px}
.stat span{font-size:11.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:36px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:14px 15px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .12s,border-color .12s;text-align:left;color:var(--ink);font-family:var(--sans)}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.card .k{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.card h3{margin:0 0 6px;font-size:15.5px;line-height:1.3}
.card .meta{font-size:12px;color:var(--muted)}
.chead{padding:34px 0 14px;border-bottom:2px solid var(--ink);margin-bottom:10px}
.chead .kicker{font-size:11.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--accent);margin-bottom:8px}

.chead .meta{color:var(--muted);font-size:13px}

  border-bottom:1px solid var(--line);scroll-margin-top:76px}
main p{font-family:var(--serif);font-size:var(--fs);line-height:1.7;margin:0 0 13px;hyphens:auto}

main b{font-weight:700}

.entry figcaption{font-family:var(--sans);font-size:10.5px;color:var(--muted);text-align:center;margin-top:4px}
.fields{background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin:0 0 16px;
  display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 12px;align-items:center;font-family:var(--sans);font-size:13.5px}
.fields .val{overflow-wrap:anywhere}
.fields .fl{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--accent);font-weight:700;white-space:nowrap}
.fields .val{font-family:var(--serif);font-size:15px}
.fields img.glyph{height:26px;max-width:100%;width:auto;display:block;background:#fff;padding:1px 4px;border-radius:4px}
/* gallery */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin:16px 0 30px}
.gcard{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px;cursor:pointer;
  text-align:center;font-family:var(--sans);color:var(--ink);box-shadow:var(--shadow)}

.gcard img{width:100%;height:auto;border-radius:6px;display:block;background:#fff}
.gcard span{display:block;font-size:11.5px;line-height:1.25;margin-top:6px;color:var(--ink)}
.az{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0 4px}
.az button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;
  font-size:12px;padding:3px 8px;cursor:pointer;font-family:var(--sans)}
.az button:hover{background:var(--accent-soft)}
.pager{display:flex;justify-content:space-between;gap:12px;margin:48px 0 0;padding-top:20px;border-top:1px solid var(--line)}
.pager a,.pager span{font-family:var(--sans);font-size:13.5px;max-width:46%}
.pager .nx{text-align:right;margin-left:auto}
.foot{margin:48px 0 0;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);
  font-family:var(--sans);font-size:12px;line-height:1.6}
mark{background:var(--mark);color:inherit;padding:0 1px;border-radius:3px}
.flash{animation:fl 1.6s ease}
@keyframes fl{0%{background:var(--mark)}100%{background:transparent}}
#results{position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:66vh;overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);z-index:50;display:none}
#results.on{display:block}
.res{padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.res:last-child{border-bottom:0}
.res:hover{background:var(--accent-soft)}
.res .where{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.res .snip{font-size:13px;color:var(--ink);line-height:1.45;font-family:var(--serif)}
.res .none,#results .none{padding:14px;color:var(--muted);font-size:13.5px}
#count{font-size:12px;color:var(--muted);padding:8px 13px;border-bottom:1px solid var(--line);background:var(--bg)}
#toTop{position:fixed;right:18px;bottom:18px;z-index:35;display:none}

  .layout{grid-template-columns:1fr}
  aside{position:fixed;inset:57px 0 0 0;height:auto;width:86%;max-width:330px;z-index:45;
    transform:translateX(-102%);transition:transform .22s;box-shadow:var(--shadow)}
  aside.open{transform:none}
  .wrap{padding:0 16px}

}

@media print{
  header.top,aside,#toTop,.pager,#progress,.chead .tools,.az{display:none}

  .entry figure{float:right;width:32%}
}

<script id="bookdata" type="application/json">{"chapters":[{"t":"Foreword","p":11,"s":[{"t":"","p":11,"b":[["p","Hand mudras or hand gestures have an important role in yogic thought and Indian culture, where they have probably been explained in more detail than perhaps any other tradition. Yet this knowledge can be helpful to all of us in bringing more meaning into our awareness and into our expression. The hands are the focus of most of what we do, reflecting how we relate to life and how we touch the world. When our energy is strong, clear, and creative in the hands, our vitality and attention, are similarly energized and directed in a positive manner. When there is no focus or attention in our hands, our lives also often lack focus and proper motivation.",11],["p","Hand mudras have three main places of traditional usage in India, which are all covered in the present detailed book. The first, and most commonly known in the West, is in yoga practice, to channel higher energies into the body and mind. Mudras play a role along with asanas, pranayama, mantra and meditation in Raja Yoga and Hatha Yoga, and are becoming part of regular yoga classes. The second place for mudras is in ritual, in which various gestures relate to different deities or their powers. Most Hindu and Buddhist rituals employ mudras as an integral part of their practice, along with special mantras and offerings. Such rituals can be part of yoga practice as well, particularly in devotional practices. In this way, mudras are not simply a means of personal expression or self-empowerment, but ways of communicating with the deity, often in meditation, and drawing divine grace in our lives. The third is in Indian dance and drama, in which mudras reflect various types of meaning and have a symbolic value, particularly for projecting certain attitudes and emotions, or representing various powers or deities. Mudras are part of an artistic language of poetry, gesture, and dance and aid in a deeper self-expression and creative unfoldment. The hands are our seat of pranic connection and expansion in Ayurvedic medicine, and much of healing is through the hands. Mudras can help direct higher pranic energies into the body and link us with beneficial pranic currents in nature and in the universe as a whole. Mudras relate to the marmas and nadis, the energy points and currents in the physical and subtle bodies. This can afford them tremendous healing powers and the ability to change how our energy moves and works. Mudras can be brought into various types of massage and bodywork for great benefit.",11],["p","Mudras can be used along with pranayama in order to direct the prana in various ways, both internally and externally, whether to different parts of our own bodies or to the pranic fields of other people. In fact, the more power of prana one has, the greater the power one can direct through mudras. The mudra forms a vehicle for one’s prana, and helps both activate and exercise the prana that one has. One can heal through mudras alone, either as directed by the practitioner or as practiced by the patient. Mudras, especially those of the hand, are prominent in the Tantric aspect of the greater yoga tradition, and are sometimes regarded as an entire branch of practice, like asana, pranayama, mantra, or yantra. Mudras are often used along with different asanas, particularly sitting poses, where they have specific powers to energize the asanas at a deeper level. Mudras can also serve to focus the mind and direct its power of attention. As such, mudras help prepare the mind for meditation and can reinforce certain meditational attitudes. Hand mudras can be seen like hand mantras as ways of energizing our expression. They can be used like yantras or geometrical devises for organizing our subtle energy patterns. Certain mudras are used for teachers while teaching students to focus the power of the mind, as teaching gestures. The mudra itself can project the knowledge and awareness of the teacher, like the famous Chin Mudra or “gesture of consciousness.” <i>Mudras of India<\/i> by Cain and Revital Carroll is a well-referenced guide to mudra practice, with numerous quotes from important traditional Sanskrit sources and yoga texts. It covers the full diversity of approaches to mudras found in the various spiritual traditions of India. It clearly explains how to perform particular mudras, with ease and clarity, and outlines their various levels of application, including their yogic and healing usages. The book covers all aspects of mudra practice with depth, simplicity, and precision. It is also quite detailed and lists a large number of mudras, including the most important ones commonly used, perhaps more than any other available publication. <i>Mudras of India<\/i> is an important handbook for mudra practice, helpful to any yoga or health practitioner. It is well-illustrated and very practical in its design, making it useful for a wide variety of students and scholars. It is probably the most detailed book on the subject in the English language and the best organized, making the science of mudra accessible to everyone. There have been a number of books on mudras done in recent years, of varying degrees of value. However, if there is a single book on mudra that one could recommend, I would recommend this book to start with.",12],["p","<i>Dr. David Frawley<\/i> <i>Director, American Institute of Vedic Studies (www.vedanet.com)<\/i> <i>Author of <\/i>Yoga and Ayurveda <i>and<\/i> Yoga for Your Type",12]]}]},{"t":"Acknowledgments","p":13,"s":[{"t":"","p":13,"b":[["p","We are grateful to all the yogis and dancers who have carried forth the rich tradition of hand mudras throughout the centuries, and to all of the talented and inspiring people who helped us bring this project to fruition. Thank you to Reed Rahn for his magic with the camera during our Phoenix photo shoots, to Phil Timper for all his work rendering the mudra images (and Nancy Timper for not breaking the bank), to Dilip Kumar Dhirsamant for his endurance and patience during our long photo shoot in Bhubaneswar, to Sanskrit scholar, Nicolai Bachman, for his editorial suggestions and rendering of the Devanagari and transliteration of the mudra names, to Dr. Mandakranta Bose for her wise counsel and editorial suggestions, and to our publisher, Jessica Kingsley, for her sincere interest in seeing this book come to life, and the whole team at Singing Dragon for their patience, flexibility, and professionalism.",13]]},{"t":"From Cain","p":13,"b":[["p","I am deeply grateful to all of my teachers, and the generations of lineage masters who came before, who have inspired and informed my practice of mudras and the many other dimensions of internal cultivation: Baba Hari Das, Satjivan Singh, Ari Singh, Yogi Das, Dr. Yogi Vikeshanand, Banambar Baba, Master Zhongxian Wu, Liu Shan, Daoist Yogi Ramkohea, Dr. Matt Schlechten, and Sun Yogi Umashankar. I offer my heartfelt gratitude to all of my family and friends who lift me up with their unending support, to my friend and colleague, Laraine Herring, for all her helpful writing tips, playful encouragement, and mostly for being a living example of a “writing warrior,” and to all of my students who continue to inspire me with their sincere desire to learn and practice the yogic arts. Special thanks to my loving wife and coauthor, Revital Carroll, for being my trusted partner in this book project and in our everyday life together.",13]]},{"t":"From Revital","p":13,"b":[["p","I extend my heartfelt gratitude to all my teachers who took the time to share their vast knowledge of hand mudras with me. I extend special thanks to my first Odissi Dance teacher, the late Guru Gangadhar Pradhan, and his senior disciple Sri Lingaraj Swain, for initially introducing me to the art of dance mudras and their proper usage, and for instilling in me the passion to always aspire to expand my knowledge and remain an eternal student. My deepest gratitude goes to Guru Bichitrananda Swain and Sri Pabhitra Kumar Pradhan for their willingness to engage in conversation about the subtle meanings of the numerous mudras applications. I am grateful to my dance teachers: Sri Yudishtir Nayak, Smt. Sujata Mohapatra, Guru Rathikant Mohapatra, and Smt. Niharika Mohanty, from whom I am continuously learning more about the form, grace, and proper usage of hand mudras in Classical Indian Dance. I am filled with infinite appreciation to Guru Kelucharan Mohapatra, whom I never had the grace of meeting in person, but who influences my dance journey multifold through all of my teachers, and through the Odissi Research Institute, with its immense contribution to the study of hand gestures. I thank all of my yoga and meditation teachers for stoking the fire of spiritual aspiration within me, and for continuing to inspire me to follow my intuition, passion, and devotion as I deepen my practice. My special thanks to Clive Sheridan, my first teacher of Tantric hand mudras, whom I met while wandering through India in the early 1990s. I offer my sincere appreciation to Kali Ray for sharing her unique and inspirational relationship with the practice of hand mudras, and intriguing me to deepen my intuitive relation to the power in my hands. I thank all of my students, colleagues, and friends for encouraging and inspiring me to continue to learn and share my knowledge with them. And last but not least, I thank my husband, Cain Carroll, for his vision, unwavering support and encouragement, and for believing in me.",14]]}]},{"t":"Sanskrit Pronunciation Guide","p":15,"s":[{"t":"","p":15,"b":[["e","<i>Standard Academic Transliteration<\/i>",15],["p","In an effort to uphold the rich tradition of Sanskrit as the language of yoga and Indian dance, we have selected to render the names of each mudra in English, Devanagari, and Transliteration (English with standard academic diacritical markings). For the convenience of the lay reader we have chosen to separate many of the longer Sanskrit names and titles into separate words for easier readability. For example, — becomes Abhaya Hrdaya Mudra, with the latter being the standard way we reference the mudra throughout the text. Most Sanskrit words in the body of the text are italicized, immediately followed by the word’s literal English translation in parentheses and quotation marks.",15]]},{"t":"Vowels","p":15,"b":[["p","another",15],["p","father (2 beats)",15],["p","i — pin",15],["p","need (2 beats)",15],["p","u — flute",15],["p","mood (2 beats)",15],["p","macabre",15],["p","e — etude (2 beats)",15],["p","ai — aisle (2 beats)",15],["p","o — yoke (2 beats)",15],["p","au — flautist (2 beats)",15]]},{"t":"Special Letters","p":16,"b":[["p","hum",16],["p","out-breath",16]]},{"t":"Consonants","p":16,"b":[["p","ka — paprika",16],["p","kha — thick honey",16],["p","ga — saga",16],["p","gha — big honey",16],["p","ink",16],["p","ca — chutney",16],["p","cha — much honey",16],["p","ja — Japan",16],["p","jha — raj honey",16],["p","inch",16],["p","borscht again",16],["p","borscht honey",16],["p","shdum",16],["p","shd hum",16],["p","shnum",16],["p","ta — pasta",16],["p","tha — eat honey",16],["p","da — soda",16],["p","dha good honey",16],["p","na — banana",16],["p","pa — paternal",16],["p","pha scoop honey",16],["p","ba — scuba bha — rub honey",17],["p","ma — aroma",17],["p","ya — employable",17],["p","ra — abra cadabra",17],["p","la — hula",17],["p","va — variety",17],["p","shut",17],["p","schnapps",17],["p","sa — Lisa",17],["p","ha — honey",17],["p","In Sanskrit, when two vowels meet they will combine into something else. For example, “ — ” plus “ — ” becomes “ — ” and “ — ” plus “ — ” becomes “ — .”",17],["p","Some Sanskrit sounds are pronounced slightly differently in North and South India. The “ ” might sound like a “ ” and the “ ” or “ ” may sound like a “ — ” or a “ .” There are some differences between Sanskrit and Hindi pronunciation. In Sanskrit, when a word ends with an “ ” it is pronounced. In Hindi it is often dropped, even though it is written the same way. For example, the Sanskrit “ — ” sounds like “ — ” in Hindi.",17]]},{"t":"Sanskrit — Hindi","p":17,"b":[["p","“a” at the end of a word is often not “a” at the end of a word is pronounced pronounced",17],["p","“ ” at the end of a word is “ ” at the end of a word is long pronounced as short “a”",17],["p","“ph” can also be pronounced “ph” pronounced as an aspirated “p” like “f”",17],["p","<b>Note <\/b>Sanskrit Pronunciation Guide used with permission from Nicolai Bachman at www.sanskritsounds.com.",17]]}]},{"t":"Introduction: The History and Heritage of Mudras","p":19,"s":[{"t":"","p":19,"b":[["e","<i>The History and Heritage of Mudras<\/i>",19],["p","Our hands are a source of tremendous power. With such profound dexterity, sensitivity, and utility, the human hands may be one of our most defining features as a species. Playing guitar, delivering a baby, knitting a sweater, building a house, wielding a sword, painting intricate figures: through the use of our hands we create and shape the world we live in. Hands can heal, hands can harm. One touch can convey a wide array of thoughts, feelings, or intentions. Hands tell the story of our mood or state of mind. When we feel angry, a clenched fist; when anxious, fidgeting fingers. Even plants and animals respond to the subtle nuances of our touch.",19],["p","With the hands playing such a central role in our experience of being human, it comes as no surprise that many of the world’s great spiritual and artistic traditions have considered the hands as sacred. With five digits, twenty-seven bones, and fifteen joints—plus numerous carpal joints affording articulation of the wrist—the human hand is a masterpiece of nature. Perhaps, this is why many cultures throughout history viewed the human hand as a perfect microcosm of the universe. For example, the shaman kings (<i>Wu<\/i>) of ancient China viewed all things in the animated world as emanations of the changing relationship between five fundamental principles (commonly referred to as the Five Elements): Water, Wood, Fire, Earth, and Metal. They viewed the human hand as one of the most poignant examples of these five principles, with each of the fingers representing one the Five Elements (Earth/thumb, Metal/index, Water/little, Wood/ring, and Fire/middle). These relationships, and the character of each finger based on the theory of Five Elements, are woven into the philosophy and practice of all the traditional Chinese arts: calligraphy, Traditional Chinese Medicine, astrology, martial arts, <i>cha dao<\/i> (tea culture), classical music, dance, and theater. In many of these arts, specific hand positions and gestures are used in relationship to the precise effect desired by the practitioner. For example, a Chinese shaman might instruct a patient suffering from anxiety to tuck her thumbs into her palms and hold them firmly. Since the thumb relates to Earth, closing the other fingers around it creates an energetic seal, a mudra, which imparts a sense of safety and stability, thus reducing anxiety. In Chinese calligraphy, the brush is held firmly with the thumb, index, middle, and ring finger while the little finger is tucked slightly in and not used. This is in an effort to conserve the energy of the kidneys (Water), giving the calligrapher a certain vitality that can be seen in the <i>qi<\/i> of their brush strokes.",20],["p","A similar tradition emerged in ancient India, where Vedic sages and Tantric yogis developed a highly nuanced cosmology with the <i>Pancha Maha Bhuta <\/i> (“Five Great Elements”) as the basic foundation. The <i>Pancha Maha Bhuta<\/i> of the Indian cosmological system is similar, but not identical to, the Five Element theory used throughout East Asia.",20]]},{"t":"Pancha Maha Bhuta","p":20,"b":[]},{"t":"Element (English) — Element (Sanskrit)","p":20,"b":[["p","Fire — <i>Agni<\/i>",20],["p","Air — <i>Vayu<\/i>",20],["p","Ether/Space — <i>Akasha<\/i>",20],["p","Earth — <i>Prithivi<\/i>",20],["p","Water — <i>Apas<\/i>",20],["p","Indian <i>rishis<\/i> (seers) discovered a direct connection between the <i>Pancha Maha <\/i> <i>Bhuta <\/i>and the five fingers of the human hand. They emphasized that the relationship of the <i>Pancha Maha Bhuta <\/i>in the body should remain balanced and in harmony with the rest of the natural world. They taught that any disorder in the body or mind indicates an excess or deficiency in one or more of the Elements. Through centuries of research and experimentation with techniques used to influence the <i>bhutas<\/i>—as well as influential exchanges with other Asian traditions—they developed an elaborate system called <i>Yoga Tattva Mudra <\/i> <i>Vijnana<\/i>.1 This unique branch of Vedic wisdom clearly describes the relationship between the five fingers and Five Elements, and sets forth an extensive system of mudras whose influence is seen in many of the classical disciplines of India: dance, theater, architecture, painting, medicine (<i>Ayurveda<\/i>), martial arts, and yoga. Since all the classical arts of India were evolving within the context of Vedic and Tantric spirituality, the cosmology of the <i>Pancha Maha Bhuta<\/i> and the presence of mudras are almost ubiquitous.",20],["p","The Sanskrit word <i>mudra <\/i>means “attitude,” “gesture,” or “seal.” The most common use of the word describes the many hand gestures used in yoga, spiritual ritual, and Indian dance. It is these hand gestures (<i>hasta mudras<\/i>) that are the main focus of this book. However, it is important to understand that <i>mudra<\/i> has many other meanings used in numerous different contexts. For example, the <i>Kularnava Tantra<\/i>2 traces the word <i>mudra <\/i>to the root <i>mud <\/i>(“to delight in”) and <i>dru<\/i> (“to give” or “draw forth”). This hints at an ecstatic state of non-duality, or union with the deity, as the ultimate definition of <i>mudra<\/i>. In the <i>Siva Sutras<\/i>, one of the most important texts of Kashmir Shaivism, <i>mudra<\/i> is mentioned in two contexts: as <i>mudra-virya<\/i> and <i>mudra-krama<\/i>. <i>Mudra-virya<\/i> refers to the underlying power that reveals the ground of our experience as <i>Turya<\/i> (“pure awareness”).3 <i>Mudra-krama<\/i> is a densely loaded phrase that connotes the state in which the mind alternates between internal awareness of “self” and external awareness of “the world,” and thus cannot find a true distinction between the two. Due to this power called <i>samavesha <\/i>(“co-existence”), the practitioner’s consciousness is perfectly merged with the way things are. In this context, <i>mudra<\/i> is the sense of having united with something larger, while simultaneously knowing that such a union is primordial.",21],["p","The word <i>mudra<\/i> also refers to the large earrings worn by Kanphata Yogis4 in India, an order of <i>sadhus<\/i> (religious ascetics) who follow the teachings of Gorakhnath (a famous Nath Yogi and prolific author who lived in the tenth or eleventh century). In Indian Tantrism, <i>mudra<\/i> is also used to denote the parched grains used in Tantric ritual, and also as a subtle reference to the female consort, called <i>Shakti<\/i> or <i>Dakini<\/i>, of a Tantric yogin. The Kagyu sect of <i>Vajrayana <\/i> Buddhism uses the suffix <i>maha<\/i> (“great”) in conjunction with the term <i>mudra <\/i> to describe the lineage’s quintessential meditation practice called <i>Mahamudra <\/i> (“the Great Seal”). In this context, the word <i>mudra<\/i> refers the a specific method of meditation and its fruition. <i>Mahamudra<\/i> describes the practice of looking directly at the fundamental nature of Mind. It also denotes the highest enlightenment, where Mind and Emptiness are synonymous.5",21]]},{"t":"Mudras in the Yoga Tradition","p":21,"b":[["p","In the Hatha Yoga tradition, mudras are considered precious tools on the path of awakening. There are five classes of such mudras taught in the yoga tradition: <i>hasta<\/i> (“hand”), <i>mana <\/i>(“head”), <i>kaya<\/i> (“postural”), <i>bandha <\/i>(“lock”), and<i> adhara <\/i>(“base” or “perineal”). Although these five are different, they share the common purpose of serving as “seals” or “locks” used to affect the flow of energy in particular organs and channels of the body. The <i>Gheranda Samhita <\/i> (a seventeenth-century text on Hatha Yoga) describes twenty-five of these types of mudras.6 Each of the five classes of mudras contains numerous techniques used for different purposes. Many of the postural mudras and locks form the basis for the internal practices of Hatha Yoga that—contrary to the popular application of yoga as a fitness fad—are aimed primarily at affecting the autonomic nervous system, and have very little to do with the appearance of the musculoskeletal system.",21],["p","<i>Hasta Mudra<\/i> is the name given to the many hand gestures, such as <i>Surabhi <\/i> <i>Mudra<\/i> (see p.243), used in Hatha Yoga to regulate the flow of <i>prana<\/i> (“life force”) and ready the mind for meditation. The <i>Soma Shambhu Paddhati<\/i> (circa tenth century) describes thirty-seven hand mudras, the most common being <i>Abhaya Mudra<\/i>, <i>Anjali Mudra<\/i>, <i>Chin Mudra<\/i>, <i>Dhyana Mudra<\/i>, and<i> Jnana Mudra. <\/i> <i>Mana Mudras <\/i>work with the<i> “<\/i>seven openings” of the head (two eyes, two ears, two nostrils, and mouth). With practices such as <i>Shanmukha Mudra <\/i>(see p.222)<i>, <\/i>the various <i>Mana Mudras<\/i> are used mainly as techniques of <i>pratyahara <\/i> (“internalization of the senses”) to systematically direct consciousness inward toward the object of meditation. <i>Kaya Mudras<\/i> such as <i>Vipareetakarni <\/i>are bodily postures (<i>asanas<\/i>) combined with specific breathing techniques and visualizations. They are most commonly used to open <i>chakras<\/i> (“energy centers”) and awaken <i>Kundalini<\/i> (“serpent power”). <i>Bandha Mudras<\/i> such as <i>Maha Vedha Mudra <\/i>employ <i>bandhas<\/i> (“interior locks”) along with <i>asanas<\/i> (“postures”) and <i>kumbhaka<\/i> (“breath retention”). These are used for similar purposes as the <i>Kaya Mudras<\/i>, and are often found sequenced together in traditional sets of practice. <i>Adhara Mudras <\/i> such as <i>Ashvini Mudra<\/i> utilize various methods of contracting the musculature of the anus, sexual organs, and perineum to stimulate the endocrine system and strengthen the body’s vital energy.",22],["p","According to the doctrine of <i>Yoga Tattva Mudra Vijnana<\/i>, all diseases in the body and disturbances of mind result from the imbalance of the Five Elements and disruption of the natural flow of <i>prana<\/i>. Through centuries of use and refinement, the techniques of the five classes of mudras have been shown to be a highly effective system of self-healing and spiritual cultivation. The passage below conveys the supreme importance of mudras in the yoga tradition:",22],["p","Therefore, the goddess sleeping at the entrance of <i>Brahma’s<\/i> door should be constantly aroused with all effort by performing mudras thoroughly. <i>Maha Mudra<\/i>, <i>Maha Bandha<\/i>, <i>Maha Vedha<\/i>, <i>Khechari<\/i>, <i>Uddiyana<\/i>, <i>Mula Bandha<\/i>, <i>Jalandhara Bandha<\/i>, <i>Viparita Karani <\/i> <i>Mudra<\/i>, <i>Vajroli<\/i>, and <i>Shakti Chalana<\/i>, verily, these are the ten mudras which destroy old age and death.<i> Adinath<\/i>7 said they are the bestowers of the eight powers. They are held in high esteem by all the <i>siddhas<\/i> [adepts] and are difficult for even gods to attain. These must remain secret like precious stones, and not be talked about to anybody… (Hatha Yoga Pradipika, chapter 3, verses 5–9)8",22],["p","Of the five classes of mudras, <i>Hasta Mudras<\/i> are the most numerous and widely used throughout India. Compared with the other four classes of mudras—many of which require direct instruction from a competent teacher—most hand mudras are easy to learn and safe to practice on your own. Following common sense, intuitive guidance, and some diligent practice, hand mudras can serve as side-effect-free health care, first aid in the case of acute illness, natural treatment of chronic illness or injury, and as a do-it-yourself method of developing latent psycho-energetic potential. For example, <i>Mritsamjivani Mudra <\/i>(see p.159) is traditionally used in the case of acute heart attack, and is affectionately called the “lifesaving mudra.” <i>Apana Mudra <\/i>",23],["i","i91.webp",23],["p","(see p.45) is used to assist the ease of delivery when a woman is in labor, and can also be use daily to treat chronic constipation. For yoga students and teachers, the use of hand mudras such as <i>Prana <\/i> <i>Mudra<\/i> (see p.193) during asana practice can greatly enhance the energetic effects of poses, as well as the mental, emotional, and spiritual benefits of the practice.",23],["p","Hand mudras can be classified into four basic groups: (1) those held by deities or used in the iconographic depictions of gods, demigods, demons, or — Nirvana Mudra heroes of epic stories such as the <i>Mahabharata<\/i>; (2) those used in rites, rituals, and Tantric worship, such as <i>japa<\/i> (“repetition of prayers”), <i>avahana <\/i>(“invocations”), <i>kamya-karma <\/i>(“rites of abundance”), <i>naivedya <\/i>(“offering food”)<i>, <\/i>and<i> snana<\/i> (“bathing”); (3) those used in yogic practices for concentration, energy cultivation, healing, or evoking desired states of consciousness; and (4) those used in performance arts, such as dance and theater, for story telling and emotional expression. The four groups of hand mudras can be further divided into two sub-groups: <i>asamyukta hastas <\/i> (“single-hand gestures”) and <i>samyukta hastas<\/i> (“joint-hand gestures”). There is also a long tradition in India, mostly among esoteric yogis, of mudras occurring spontaneously during deep meditation. This unfolds through a phenomenon called <i>prana vidya <\/i>(“direct cognition of energy”), where the yogi expresses subtle internal states through unprompted gestures and movements.",23],["p","“Mudra means ‘seal’, and the mudras are concerned with the mind. Practicing the mudras keeps the mind fixed on the points over which they are applied.” (Swami Satchidananda)9",23],["p","Hand mudras are used in the religious, spiritual, and artistic traditions of many cultures throughout the world. The emblem of the Jain religion is called the “Jain Hand,” an iconic depiction of <i>Abhaya Mudra<\/i> with images of a <i>dharmachakra <\/i> (“wheel of dharma”) and the word <i>ahimsa<\/i> (“non-violence”) in the center of the palm. Hand mudras are common in Jain symbolism and mentioned in spiritual literature such as the <i>Bhairav Padmavati Kalp<\/i>.",24],["p","Tantric hand gestures are commonly seen in Bhutan, Tibet, Nepal, China, and Japan. Ritual hand mudras and meditation gestures are seen in Burma, Vietnam, Thailand, and Laos. Dramatic hand mudras are seen in the dance and theater traditions of India, Nepal, Thailand, Sri Lanka, and Bali. In iconographic images of Jesus Christ giving benediction, he",24],["i","i99.webp",24],["p","is often seen with his right hand in a specific gesture—not unlike <i>Prana Mudra<\/i> (see p.193) in yoga or <i>Ardhapataka Mudra <\/i>(see p.50) in dance —where the thumb, index, and middle fingers are extended upward, and the ring and little finger bent toward the palm. Mother",24],["p","Jain Hand Mary is frequently depicted with her hands to her sides, palms facing forward and slightly up in a receptive position. This gesture evokes a similar sentiment of bestowing blessings as <i>Varada Mudra <\/i>(see p.266), commonly seen in Southeast Asian depictions of the Buddha. Throughout the Middle East and North Africa, the <i>Hamsa<\/i> is used as an amulet and universal sign of protection. The Arabic word <i>hamsa<\/i> literally means “five.” The emblem relates to the five senses, the five daily prayers, and hints at the idea of “five fingers in the eye of evil,” a cultural reference to the perceived power generated by",24],["i","i101.webp",24],["p","specific hand positions. The <i>Hamsa<\/i> emblem of a downward-facing right hand is the source of profound symbolism for numerous religious groups. It is called the “Hand of Miriam” by the Jewish, the “Hand of Fatima” by Muslims, and the “Hand of Mary” by Christians. It is interesting to note that the <i>Hamsa<\/i> represents a feminine quality across traditions. Worn on the body as jewelry, or placed on a door or window, it serves a similar purpose of dispelling fear, granting good fortune, and repelling negative energies as <i>Abhaya Mudra <\/i> Hamsa — (see p.34) in Hindu and Buddhist traditions.",24]]},{"t":"Mudras in Classical Indian Dance","p":25,"b":[["p","In Classical Indian Dance there",25],["i","i105.webp",25],["p","is a significant emphasis on the conscious formation of hand gestures. The hands are always held in an intentional manner and in a definite mudra. The ground for such a unique feature in a dance form lies in the cultural context it emerged within. Indian dance was developed side by side with the spiritual–religious philosophy of the subcontinent, valuing the potentiality in our hands to generate and direct energy. The prominent role hand gestures play in Indian dance strongly links them to the other arts and spiritual traditions of India.",25],["p","Mudras are used in Classical Indian Dance for story telling and Odissi Dancer at Rajarani — expressing the subtleties of human Temple emotion and relationship. Similar to the yoga tradition, they are also used following the view of Tantra, for the purposes of transformation and evolution by stimulating the flow of <i>shakti<\/i> (“primal force”) in the organs, glands, and nerve channels of the body. A clear understanding of how hand gestures are used in Indian dance would not be possible without a basic familiarity with the origin and scope of practice of Classical Indian Dance as a whole. Dance has been an important component of Indian society for millennia, and it is associated as a form of expression and celebration of all the significant moments of human life: birth, death, courtship, marriage, victory, defeat, and so on. It is utilized as a form of spiritual and devotional practice, a medium for communication and communion with the Divine, and as a channel to carry forth the spiritual and religious teachings of an era. While the feet form a stable foundation and set the rhythm of the dance, the hands—being at the end of the creative channels (<i>nadis<\/i>) of the arms—are the most potent body part to convey the expressional aspect of the dance/drama tradition. The ancient texts on drama and dance refer to hand gestures as <i>hastas<\/i>, whereas the term <i>mudra<\/i> has historically denoted hand gestures connected with religious ritual. In the recent past, since",26],["i","i109.webp",26],["p","Classical Indian Dance was revived in the earlier part of the twentieth century, we find that the term <i>hasta <\/i> is no longer widely used to describe hand gestures by practicing dancers. The general term <i>mudra<\/i> is now commonly used by both dancers and spiritual practitioners. Although <i>hasta<\/i> is technically the correct term for dance hand gestures, we have chosen to use <i>mudra<\/i> in reference to all gestures since it is the more broadly known term.",26],["p","Many dance traditions have emerged throughout India, each",26],["p","Mrigashirsha Mudra with its own regional texts. However, the earliest and most influential of all texts on dance is the <i>Natya Shastra<\/i>. It is generally believed to have been written between 200 bce and 200 ce by Bharata Muni, and is considered the original treatise on music, dance, and theatre. According to the <i>Natya Shashtra<\/i>, the four forms of <i>abhinaya<\/i> (“expression”) in Indian dance and drama are classified as:",26],["p","1. <i>Vachika<\/i>—verbal (song)",26],["p","2. <i>Angika<\/i>—bodily, mainly mudras",26],["p","3. <i>Aharya<\/i>—costume and makeup",26],["p","4. <i>Satvika<\/i>—mood and sentiment, mainly expressed through the face.",26],["p","A number of other texts follow closely after the<i> Natya Shastra. <\/i>Among them is the <i>Abhinaya Darpana<\/i> of Nandikeshvara, the first practical text solely devoted to dance. This is perhaps the most influential text in the field of dance technique, and extensively deals with the use of hand gestures for communication and expression. As such, we have chosen to follow the variations of hand mudras listed in the <i>Abhinaya Darpana<\/i>, while using the <i>Natya Shastra<\/i> as a secondary resource. Over the centuries, primarily from the thirteenth century onwards, many regions in India developed their own manuals of dance and unique technique that vary slightly from the standard versions of the mudras. In the spirit of thoroughness, we have included some of these commonly used mudras from regional texts. However, it would be overwhelming and confusing to try to include them all, since often they are almost identical to the original texts with slight variations or name changes.",26],["p","Classical Indian Dance technique",27],["i","i113.webp",27],["p","is generally divided into<i> nritta<\/i> (pure technical dance, that does not express any particular mood or conveys a narrative), and <i>nritya<\/i> (expressive dance, accompanying the unfolding of a story and meaning of song lyrics). <i>Natya<\/i> is yet another category mentioned in the <i>Natya Shastra<\/i> and other treatises, and it exclusively corresponds to drama. The vast majority of dance mudras have a versatile scope of usage and are employed in context of <i>nritya<\/i> (“expression”) as well as <i>nritta<\/i> (“pure dance”). Some of the dance mudras are exclusively of the <i>nritya<\/i> category and are solely used for specific applications of expression. In the model of Classical Indian Dance, the hands are the only body part that possess — Odissi Dancer (Mayura",27],["p","Mudra) both <i>nritta<\/i> and <i>nritya<\/i> qualities. The face (eyebrows, eyes, eyelids, nose, lips, etc.) is primarily used for expression, while the feet, legs, waist, and chest carry out the technical movement. Classical Indian Dance technique views the joints as the initiators of movement, and shapers of form. Therefore, in Indian dance, rather than initiating movement from the muscles of the hands or arms, every mudra is articulated and initiated from the wrist. This change of focus imbues each mudra with a certain connectivity that carries the impact of the gesture deep into the dancer’s core and the spectator’s heart. Each mudra carries numerous possibilities of movement and is a portal for an entire language of animated gesticulation. The mudras in dance are the focal point around which everything else revolves. The verse below, from the <i>Abhinaya Darpana<\/i>, poetically describes the importance of <i>mudras<\/i>:",27],["p","<i>Yato hastas tato drishtih<\/i> <i>Yato drishitis tato manah<\/i> <i>Yato manas tato bhavo<\/i> <i>Yato bhavas tato rasah<\/i>.10",27],["p","“Where the hand goes, the eyes follow. Where the eyes go, the mind follows. Where the mind (awareness) is, mood or emotion (<i>bhava<\/i>) is",27],["p","created. Once <i>bhava <\/i>is created, sentiment (<i>rasa<\/i>) arises.”",27],["p","This verse also illustrates the central role of emotional expression in Indian dance. The intention of evoking sentiment in the viewer, largely through the use of mudras and facial expression, is built into the structure and technique of classical dance and is seen as a path to spiritual awakening. Unfortunately, many of the subtle energetics and spiritual implications of mudras in dance have been forgotten over the centuries. Dancers are often taught a complete repertoire of mudras<i>,<\/i> along with the corresponding movements and rhythmic steps, without learning the deeper spiritual heritage behind these.",28],["p","The same is true in the modern expression of yoga, where spiritually stylized fitness has taken the popular spotlight over the traditional more contemplative side of the practice. In modern times, we often see beautiful mudras being performed merely for the sake of aesthetics. Although such performances can be interesting for the eye, they fail to touch the more profound experience that is possible when the spiritual power behind mudras is accessed. The importance of the subtle inner workings of mudras, not only their outward appearance, is a value shared by yoga and Indian dance alike. It is for this reason that we have chosen to include the mudras of both dance and yoga in one book. Although yoga and Indian dance share the same heritage and spiritual values, they are distinct traditions, each with its own repository of mudras. In their classical application, mudras from dance often do not cross over to yoga, and vice versa. However, we feel strongly that each tradition has tremendous value to offer the other. Practitioners of yoga and meditation can greatly enhance their <i>sadhana<\/i> (“practice”) by learning the art of emotional expression implicit in the use of dance mudras. The emphasis placed on rousing the sentiments of the heart is a central theme in both dance and <i>Bhakti Yoga<\/i> (“path of devotion”). We have found that this important component of spiritual life is greatly enriched by working with the theatrical mudras and <i>rasas<\/i> (“moods”) used in dance. Similarly, incorporating yoga mudras into their daily training, dancers will be guided to connect with the spiritual power inherent in the ancient roots of the dance. The meditative practice of yoga mudras will improve a dancer’s overall health, increase mental clarity, and develop superior concentration for learning complex choreography. The creative capacity contained in the hands is accessible to anyone. Whether you are a dancer, yogi/yogini, spiritual seeker, or simply feel drawn to explore something new, the realm of hand mudras has much to offer. We hope you will enjoy this simple and powerful way to access your core being, nurture body and mind, and bring an added element of beauty and devotion to your life.",28]]}]},{"t":"Getting Started","p":29,"s":[{"t":"","p":29,"b":[["p","For many years we have nurtured a deep interest in the beauty and power of hand mudras. We find great joy in practicing the mudras presented here and we are delighted to share this information with you. Our desire in presenting this material is two-fold: (1) to provide an easy-to-reference encyclopedic guide to the large body of mudras used in the Indian tradition; (2) to provide a practical resource to inform and inspire readers to take up a personal practice of hand mudras. We have endeavored to include the most widely used mudras of India. However, the tradition of hand mudras in India is extremely vast, with numerous regional texts in local dialects, as well as many oral traditions that teach seemingly endless variations of mudras. Different schools and styles of dance and yoga use different hand gestures and different terms for the same mudras. Most systems, however, share a similar set of names and applications that is congruent with the information in this book. Where applicable, we have included alternate names for the mudras to help you cross-reference gestures between traditions. Below are some things to consider as you continue your journey into the fascinating realm of hand mudras.",29]]},{"t":"About the Book Format","p":29,"b":[["p","The mudras are listed A to Z by their Sanskrit name rendered in English. Below the main listing you will see the name again in Devanagari (Sanskrit script), and once more in English with academic transliteration markings to assist in correct pronunciation of the original Sanskrit. Next to each mudra listing you will see a small icon:",29],["p","means this mudra has a spiritual/religious context and it is found in one or many of the spiritual traditions that developed in India.",29],["p","means this mudra is found in texts and sources related to the dance and drama traditions of India.",29],["p","Occasionally, a mudra is shared by both traditions and will be indicated by the presence of both icons.",29],["p","You will notice some mudras have benefits listed, others do not. Since many of the dance mudras are used in the context of performing, story telling, and expression (<i>abhinaya<\/i>) they do not traditionally have associated benefits, per se. In some cases, where we have personally experienced healing benefits of a specific dance mudra, we have taken the liberty of including a short list of such benefits based on our own experience and knowledge of the <i>Yoga Tattva Mudra <\/i> <i>Vijnana<\/i>.",30]]},{"t":"General Tips on Practicing Mudras","p":30,"b":[["p","The underlying power of mudras exists in feeling the subtle energetic effects in your own body. Whether you are practicing yoga mudras for healing or spiritual cultivation, or dance mudras for emotional and aesthetic expression, the secret to taking your experience deeper is to slow down, concentrate on the subtleties of each gesture, and really feel the effects of what you are doing. Practicing singlehand (<i>asamyukta<\/i>) mudras with each hand will increase the benefits. However, if a mudra cannot be made with each hand, there is still great benefit in practicing with one hand. This is especially true in the case of injury or disease in one hand, or even the loss of a hand or arm.",30],["p","The hands in their basic resting form—open and relaxed—represent the realm of pure potential. This potential is neutral. You can select what you want to manifest by performing any number of mudras after taking a moment of stillness with the hands in their natural position. Practicing this way, you activate what is always present in the formless state. If you are new to mudras, you can practice three to four mudras at a time to create a balanced set based on your specific focus. If you are familiar with the practice of hand gestures, you can string together as many mudras as you like. There is no hard rule as to the order of mudras practiced. We encourage you to experiment, using your own intuition and sensitivity as your guide. Further information on sequences and traditional sets of mudras can be found in the Appendices. Aside from the holistic benefits of mudras, working with hand gestures is also wonderful for the health of the hands themselves. For the physical benefit of the joints, tendons, ligaments, and cartilage of the hands, it is good to extend the fingers vigorously and activate your muscular strength while holding the mudras. To stimulate the more subtle energetic effects, and to affect the whole body and mind through the Five Element finger relationships, it is better to keep the hands soft and relaxed while performing mudras. We generally recommend incorporating both methods of practice in a given session, or alternating methods each day you practice. In this way, you maximize both the physical and psychospiritual benefits of your practice. Here are a few more general recommendations:",30],["p","1. Be gentle with your fingers. Some of the mudras may challenge the",30],["p","flexibility of your finger joints, and it is not uncommon to feel a little sore after practicing some of the more complex mudras. If you have arthritis in your hands, practicing mudras is especially helpful, yet even more caution and gentleness needs to be employed.",31],["p","2. Do not practice on a full stomach.",31],["p","3. Use your mind to send energy into your hands, and become aware of",31],["p","each and every finger and part of your hands, wrists, and your entire body. Activating the energy in your hands will in turn activate the corresponding energy in your body and will make your entire being feel more alive and awake.",31],["p","4. While practicing the various hand gestures, articulate the precise form as",31],["p","described in this text to the best of your ability, while bearing in mind that we all have slightly different body proportions, and our anatomical differences will reflect in the subtle variations of our hand gestures.",31]]},{"t":"Warming up the Hands","p":31,"b":[["p","Since performing mudras is like a yoga session for your hands, it is good to take a little time to warm up the fingers before beginning to work with the mudras. Here is a simple warm-up that just takes a moment. Take a deep breath in and hold your breath. Clap the hands together firmly three times, hard enough so that they sting just a little bit. Exhale slowly through the mouth and resume natural breathing. Then, rub the hands together vigorously for about one minute, or until they feel very warm. Make sure to rub the palms and tops of the hands and fingers, warming the hands on all sides, even between the fingers. This easy warm-up will improve blood circulation to the hands and fingers, make the joints feel more supple and strong, and increase your sensitivity to the energy generated through your mudra practice.",31]]},{"t":"Tips on Practicing Yoga Mudras","p":31,"b":[["p","Traditionally, yogic mudras used for healing and spiritual cultivation are practiced while seated in a meditation posture, such as <i>padmasana<\/i> (lotus pose)1 or <i>siddhasana<\/i> (adept’s pose).2 These postures, as well as the use of a meditation bench or sturdy chair, can greatly enhance your mudra practice. It is important to always maintain an erect spine, relaxed chest, and soft shoulders. This will allow your diaphragm and ribcage to move freely as you breathe. Smooth and natural breathing is what animates the mudras with life force (<i>prana<\/i>). Any position that inhibits your ability to breath deeply and easily should not be used for the practice of mudras. The most important thing is that you feel comfortable. Following the rules of good posture and deep breathing, mudras may be practiced just about anywhere; while walking or standing, sitting, or anytime you feel inspired. One of our favorite places for extended sessions of mudras is on long airplane flights. However, it’s important to be discreet if you practice in public. Drawing attention to yourself will deter from the power of your practice. Many of the mudras may be done with your hands in your pockets, tucked under your shirt, inside mittens when it’s cold out, or covered by a shawl or scarf. Practicing while traveling on planes, trains, or buses is a fun way to pass the time while strengthening your body, calming your mind, and brightening your spirit. It’s like doing a full yoga practice without leaving your seat!",32]]},{"t":"The Three Basic Effects of Yoga Mudras","p":32,"b":[["p","Based on the knowledge of the <i>Yoga Tattva Mudra Vijnana<\/i>, there are three basic effects resulting from the practice of yoga mudras:",32],["p","1. <i>Tonifying—The tip of the thumb touches the base of any finger<\/i>. Touching",32],["p","the tip of the thumb to the base of any finger will increase the Element associated with that finger. For example, touching the thumb to the base of the ring finger will strengthen the Earth Element.",32],["p","2. <i>Sedating—Any finger covered by the thumb<\/i>. Covering any finger with the",32],["p","thumb causes a sedation of the Element associated with that finger. For example, covering the middle finger with the thumb, as in <i>Shunya Mudra <\/i> (see p.232), sedates the Ether/Space Element.",32],["p","3. <i>Balancing—The tip of the thumb joins with the tip of any finger<\/i>. Touching",32],["p","the tip of the thumb to the tip of any other finger will bring the associated Element into balance with the others.",32],["p","In the descriptions of the mudras in the main section, you will find occasional references to the benefits of a mudra based on its effect on the <i>Pancha Maha <\/i> <i>Bhuta<\/i>, <i>Pancha Vayu<\/i>, or Ayurvedic <i>dosha<\/i>. More information about these, and the Indian yogic view on energy anatomy and cosmology, can be found in Appendix A. You will also notice that many of the yoga mudras are part of a traditional set called the <i>Gayatri Mudras<\/i>. This is a series of twenty-four premeditation and eight post-meditation mudras. If you are interested in exploring a more in-depth practice incorporating this traditional set of thirty-two mudras, you can see Appendix B for the full list of <i>Gayatri Mudras<\/i>.",32]]},{"t":"Tips on Practicing Dance Mudras","p":32,"b":[["p","In the traditional application of dance mudras, less emphasis is placed on the healing benefits derived. Rather, it is the subtleties of creative expression that take center stage. The quality of articulating hand gestures in the context of dance includes a vital component of added movement, direction, and placement to communicate distinctive expression. We tap into the <i>shakti<\/i> (“primal force”) within us through the conscious formation of the various hand gestures, and we utilize that creativity as we employ a specific intention.",33],["p","The dance mudras included in this book are for the most part derived from the two most fundamental texts on Classical Indian Dance, the <i>Natya Shastra <\/i> and <i>Abhinaya Darapana<\/i>. These ancient treatises serve as the bedrock for all forms of Classical Indian Dance and drama. However, over the centuries, regional texts have sprung up throughout India, diverting, elaborating, and informing the numerous dance forms with their own unique language of mudra variations. It is important to recognize that dance is a living tradition that includes as many tributaries of expression as there are practitioners who carry it forth. The principal names and meanings we include in this book are those described in the <i>Natya Shastra<\/i> and <i>Abhinaya Darpana<\/i>. However, we reference mudras mentioned in the <i>Hasta Lakshana Deepika<\/i> (a treatise from Kerala inspiring <i>Katakhali<\/i> and <i>Mohiniyattam<\/i> usage of hand gestures), the <i>Abhinaya Chandrika<\/i> (see Glossary), as well as Mudras used exclusively within the Odissi Dance tradition. You will notice <i>Viniyoga<\/i> (applications noted in the <i>Abhinaya Darapana<\/i>) terms included under many of the dance mudra’s Application section. These are traditionally learned while training to become a dancer. The apprentice gains knowledge of the mudras by reciting the list of applications (<i>Viniyoga<\/i>) as a continuous chant, while forming the gesture with the appropriate movement and facial expression. The Sanskrit terms listed under the <i>Viniyoga<\/i> include the traditional endings such as “and,” “with,” or “etc.” when appropriate. Keep in mind meanings may vary from one dance tradition to the next. Traditionally, dance mudras are categorized into established sets and are studied as a continuous flow. The two most fundamental sets being the twentyeight “single-hand mudras” (<i>asamyukta hasta<\/i>) and twenty-four “joint-hand mudras” (<i>samyukta hasta<\/i>) as described in the <i>Abhinaya Darpana<\/i>. These, and more of the common sets of dance mudras, are provided in Appendix C. In order to get a more in-depth familiarity with any single mudra, it is best to study the main section titled “The Mudras.” However, in order to develop fluency in gesticulation, we recommend practicing the various sets in their traditional sequences. As a rule of thumb—with some exceptions—dance hand gestures are held at least a hand’s distance away from your body in order to facilitate harmonious movement in the torso and maintain connectedness in movement and grace in posture. Often, while performing, the dance gestures are held at a right angle to the arm, with the elbows lifted, arms parallel to the ground, and wrists bent. Holding the hand gestures in this manner is pleasing to the eye and arouses an unobstructed flow of creative energy to the hands and fingers.",33]]},{"t":"Direct Experience is the Common Ground","p":34,"b":[["p","Whether mudras are classified under yoga or dance, or found in various forms or sets, they all share a common ground. The essential themes found in all Vedic and Tantric arts reveal that these traditions are founded on a sincere interest in touching the heart of our humanity. In all of the great spiritual and artistic traditions of India—such as Hinduism, Buddhism, yoga, Tantra, Indian dance, drama, martial arts, etc.— one central theme emerges as paramount: How can we be free and happy? This basic human desire is the root of our shared human narrative.",34],["p","Through years of exploring the potential of mudras, and sharing them with students of all walks of life, we have come to understand that each hand gesture has an intrinsic capacity to facilitate healing, concentration, creative expression, and an expansion of consciousness that is deeply rewarding. It seems that mudras hold the power to transform raw life-energy into subtle spiritual expression. This experience of spirit is unique for each of us. Inexplicable, yet undeniable, it is inherent in the way we naturally are. It is echoed in the heart’s innermost yearnings. At the end of the day, only you know what that feels like. Direct experience is our common spiritual ground. With that said, we hope you will feel inspired by the information presented here. We invite you to make the mudras your own and to use them as utensils for savoring the preciousness of your own experience. May you enjoy exploring the multi-faceted world of mudras contained between these pages as much as we have enjoyed bringing this book to fruition. Om Shanti Shanti Shanti",34]]}]},{"t":"The Mudras","p":35,"s":[{"t":"","p":35,"b":[["e","Abhaya Mudra I",36],["i","i133.webp",36],["f",["English","“fearless” or “fear not”"],36],["f",["Devanagari","deva36.webp"],36],["f",["Transliteration","trans36.webp"],36],["p","<b>Description <\/b><i>Abhaya Mudra I <\/i>is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the yoga tradition. It is referred to as the “seal of fearlessness” and is used in Hinduism, Indian Tantrism, and Buddhism. The mudra is most commonly employed as a gesture of protection and pacification in ritual practice and in iconographic depictions of deities, sages, and saints. It is used to dispel fear and to evoke the direct experience of Openness.1 It also represents the Five Elements2 resting in their natural relationship, with the center of the palm as the <i>bindu<\/i>, or central point of focus.",36],["p","<b>Technique <\/b>Raise the right hand in front of your right shoulder, palm facing forward, relaxed, with the fingers extending upward. Keep your shoulder relaxed, elbow bent, and hand still. Feel the center of your palm warm, as if radiating a soft light. Rest the left hand in your lap with the palm up, or let it hang gently at your side during standing or walking practice.",36],["p","<b>Application <\/b>Use <i>Abhaya Mudra I <\/i>during seated meditation and self-reflection when fear and ego clinging arise. Hold the mudra for 5 to 45 minutes. Imagine that whatever causes you fear is looking directly into the center of your upheld palm. Feel that your courage and openness are unwavering, and fear is subdued by the power of your unswerving acceptance. Through regular practice in this way, fear is subliminated into fearlessness.",36],["p","<b>Benefits <\/b>Calms the mind, reduces anxiety and inner conflict, removes attachment and aversion to thoughts, emotions, and sensations.",36],["e","Abhaya Mudra II",37],["i","i137.webp",37],["f",["English","“fearless” or “fear not”"],37],["f",["Devanagari","deva37.webp"],37],["f",["Transliteration","trans37.webp"],37],["p","<b>Description <\/b><i>Abhaya Mudra II<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used in the yoga tradition. It is common to the <i>Yoga Tattva Mudra Vijnana<\/i> form where it is used to dispel fear and evoke courage.",37],["p","<b>Technique <\/b>Join the tips of the thumb and index finger on each hand. Hold the hands palms facing forward at shoulder height.",37],["p","<b>Application <\/b>Use <i>Abhaya Mudra II<\/i> during seated meditation or self-reflection when you want to dispel fear and cut through ego clinging. Hold the mudra for 5 to 45 minutes, making sure to keep the shoulders relaxed. Feel that your courage and openness are unwavering. Fear is subdued by the power of your unswerving acceptance.",37],["p","<b>Benefits <\/b>Calms the mind, reduces anxiety and inner conflict, removes attachment and aversion to thoughts, emotions, and sensations, bringing one into harmony with the way things naturally are.",37],["e","Abhaya Hrdaya Mudra",38],["i","i141.webp",38],["f",["English","“fearless heart”"],38],["f",["Devanagari","deva38.webp"],38],["f",["Transliteration","trans38.webp"],38],["p","<b>Description <\/b><i>Abhaya Hrdaya Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used in the yoga tradition as a powerful energy conductor and mind seal. It is a lesser-known Tantric gesture that, according to oral tradition, was traditionally kept secret among initiates. The mudra is known for its unique ability to rejuvenate one’s vital force and reduce fragmented thoughts and scattered energy.",38],["p","<b>Technique <\/b>Raise the hands in front of the chest, palms facing center. Cross the wrists with the backs of the hands touching, right hand closest to your body, palms facing to the sides. Firmly interlock the index, middle, and little fingers, while connecting the tips of the thumb and ring finger on both hands, forming two rings.",38],["p","<b>Application <\/b>In a seated meditation posture, hold the mudra firmly to your chest and pull down gently rooting it into the base of your sternum. Breathe naturally and hold for 5 to 45 minutes.",38],["p","<b>Benefits <\/b>Nourishes the heart and lungs, improves digestion, imparts a powerful sense of vitality and calm, can help reduce nightmares and reestablish basic sanity to a troubled mind. Use of this mudra is especially helpful during times of exhaustion, healing from debilitating illness, or regaining strength after surgery. Energetically, it allows heat to descend from the head through the chest down into the belly, thus regulating the healthy function of all the internal organs.",38],["p","<b>Note <\/b>This mudra may be performed lying down (especially in the case of recuperation after surgery or serious illness), but it is important that the upper body be slightly elevated so that the head and chest are higher than the belly. This takes pressure off the heart and regulates blood pressure.",38],["e","Adhomukha Mudra",39],["i","i145.webp",39],["f",["English","“downward facing”"],39],["f",["Devanagari","deva39.webp"],39],["f",["Transliteration","trans39.webp"],39],["p","<b>Description <\/b><i>Adhomukha Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used in the yoga tradition for healing, especially cancer. It is part of the <i>Yoga Tattva <\/i> <i>Mudra Vijnana<\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the tenth gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra.<\/i>",39],["p","<b>Technique <\/b>Join the tips of the thumbs together with the palms facing downward. Point all the other fingers down while resting the tops of the fingers and first knuckles together. Keep all fingers straight and relaxed. Hold the mudra at the level of the waist, thumbs just in front of the navel.",39],["p","<b>Application <\/b>In a comfortable meditation posture, hold the mudra for 2 to 5 minutes while focusing on the navel and evoking the sense of warmth and rootedness. For healing, especially serious illness such as cancer, hold the mudra for 20 to 45 minutes, two to three sessions per day is ideal.",39],["p","<b>Benefits <\/b>Activates the digestive fire, increases transformative and self-healing powers, reduces toxicity, readies the mind for meditation, prayer, or recitation of mantras.",39],["p","<b>Note <\/b>For women practicing during their menstrual cycle, move the position of the mudra to the heart center, with the tips of the thumbs lightly touching the base of the sternum.",39],["e","Adhomushti Mukula Mudra",40],["i","i149.webp",40],["f",["English","“downward-fist-closed”"],40],["f",["Devanagari","deva40.webp"],40],["f",["Transliteration","trans40.webp"],40],["p","<b>Description <\/b><i>Adhomushti Mukula Mudra <\/i>is a joint-hand gesture (<i>samyukta <\/i> <i>hasta<\/i>) common to the dance tradition. In the <i>Abhinaya Darpana<\/i>, it is noted as one of the gestures that indicate “wild animals.”",40],["p","<b>Technique <\/b>With the palms facing each other, fold your little, ring, and middle fingers into the palm. Forming two interlocking rings, connect the tips of the thumb and the index finger of each hand.",40],["p","<b>Application <\/b>Used in the dance tradition to denote a monkey.",40],["e","Agni Mudra",41],["i","i153.webp",41],["f",["English","“god of fire”"],41],["f",["Devanagari","deva41.webp"],41],["f",["Transliteration","trans41.webp"],41],["p","<b>Additional Name <\/b><i>Vahni<\/i>",41],["p","<b>Description <\/b><i>Agni Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of sixteen <i>Deva Hastas, <\/i> denoting Hindu gods and goddesses as described in the <i>Abhinaya Darpana<\/i>. It indicates the form and character of the Hindu deity <i>Agni<\/i>.",41],["p","<b>Technique <\/b>Assume <i>Kangula Mudra <\/i>(p.104) with your left hand, and <i>Tripataka <\/i> <i>Mudra <\/i>(p.253) with your right, held at shoulder height.",41],["p","<b>Application <\/b>It is used to indicate <i>Agni<\/i>, the Hindu god of fire.",41],["p","<b>Note <\/b>There are several combinations of mudras used to express the various traits and emblems of <i>Agni Deva<\/i>. The most common form is indicated here.",41],["e","Ajna Chakra Mudra",42],["i","i157.webp",42],["f",["English","“command wheel”"],42],["f",["Devanagari","deva42.webp"],42],["f",["Transliteration","trans42.webp"],42],["p","<b>Description <\/b><i>Ajna Chakra Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used in Indian Tantric Yoga and Japanese martial arts to open the “third eye.” It employs the relationship of Fire (thumb) and Air (index) Elements to focus attention and intensify energy in an effort to awaken inner vision.",42],["p","<b>Technique <\/b>Extend the left index finger and curl the other fingers into the palm. Use the left thumb to cover the nails of the other three fingers. Grasp the extended index finger with your right hand, using your right thumb to press gently on the outer corner of the nail bed of the left index finger.",42],["p","<b>Application <\/b>In a seated meditation posture, hold the mudra in your lap and focus lightly on the space between your eyebrows. For increased intensity, bring the mudra a few inches in front of your forehead, pointing the tip of the extended index finger toward the third eye center. Hold for 1 to 2 minutes, then lower the mudra back into the lap.",42],["p","<b>Benefits <\/b>Awakens the <i>Ajna Chakra<\/i>, opens spiritual vision, stimulates the pituitary gland, clarifies the mind, improves concentration and intuition.",42],["p","<b>Caution <\/b>Do not hold the mudra in front of the eyebrow center for more than 2 minutes. This is a powerful mudra that is best learned under the guidance of a competent teacher. If used inappropriately, it can generate excess heat in the head that can be harmful to the brain, eyes, and nervous system.",42],["e","Alapadma Mudra",43],["i","i161.webp",43],["f",["English","“fully opened lotus”"],43],["f",["Devanagari","deva43.webp"],43],["f",["Transliteration","trans43.webp"],43],["p","<b>Additional Names <\/b><i>Sola-padma<\/i>, <i>Ala-pallava<\/i>, <i>Chakravaka<\/i>",43],["p","<b>Description <\/b><i>Alapadma Mudra <\/i>is the twentieth hand gesture of the twentyeight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana<\/i>. It is noted in the <i>Natya Shastra<\/i> as <i>Ala-pallava<\/i>. According to mythology, the mudra originates from <i>Shri Krishna<\/i>, referring to the time when he was a young child stealing butter and milk. The associated sage is <i>Vasanta<\/i>, race is <i>Gandharva<\/i>, color is dusky, and deity is <i>Surya<\/i>, the sun.",43],["p","<b>Technique <\/b>Turn your palm to face upward, stretching the fingers apart. Bring your little finger toward your palm and fan out the rest of the fingers evenly away from the little finger, with the thumb extended 90 degrees to the index finger.",43],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Vikacha-abja<\/i> (“a fully bloomed lotus”); <i>Kapittha-diphala<\/i> (“wood apple”); <i>Avarthaka<\/i> (“circular movement”); <i>Kucha <\/i>(“breast”); <i>Viraha<\/i> (“yearning to the beloved”);<i> Mukura<\/i> (“mirror”); <i>Poorna-chandra<\/i> (“full moon”); <i>Saundarya-bhavana<\/i> (“beautiful form”); <i>Dhamilla<\/i> (“hair-knot”); <i>Chandra-shala<\/i> (“moon pavilion”); <i>Grama <\/i>(“village”); <i>Udru-thakopa<\/i> (“great anger”); <i>Tataka<\/i> (“pond” or “lake”); <i>Shakata <\/i>(“cart”); <i>Chakravaka <\/i>(“type of bird”); <i>Kala-kalarava<\/i> (“murmuring sound”); <i>Slagana <\/i> (“praise”). Additional usages are fresh ghee, sweets, head, crown, braided hair, cluster of flowers, ball, dancing, fort, palace, and sweetness.",43],["p","<b>Benefits <\/b>Stimulates all five fingers and therefore activates all Five Elements in the body, improves circulation and benefits the heart, boosts vitality, and energizes body and mind.",43],["e","Anahata Chakra Mudra",44],["i","i165.webp",44],["f",["English","“wheel of un-struck sound”"],44],["f",["Devanagari","deva44.webp"],44],["f",["Transliteration","trans44.webp"],44],["p","<b>Description <\/b><i>Anahata Mudra<\/i> is a complex joint-hand gesture (<i>samyukta hasta<\/i>) used in Tantric Yoga and Japanese martial arts to open the heart center. The mudra beautifully weaves the Five Elements into a <i>yantra<\/i>, a visual symbol representing the essence of potentiality. The Elements of Fire (thumb), Air (index), and Water (little finger) express outwardly, while Ether (middle) and Earth (ring) interlock in the middle of the mudra. <i>Anahata<\/i> means “un-struck sound,” and this mudra is a gateway into the silent openness of the human heart.",44],["p","<b>Technique <\/b>Place the right ring finger in the web of the index/middle of the left hand. Place the left ring finger in the web of the index/middle of the right hand. Curl the middle fingers downward locking the ring fingers into place. Touch the tips of the thumbs, index, and little fingers together and extend them upward.",44],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the chest while gazing inwardly at the heart center (at the base of the sternum). Relax the chest, shoulders, and belly. Rest in stillness for 5 to 45 minutes.",44],["p","<b>Benefits <\/b>Improves the health of the heart, lungs, and breasts, regulates breathing, expands feelings of compassion and love, increases healing abilities.",44],["e","Angaraka Mudra",45],["i","i169.webp",45],["f",["English","“planet Mars”"],45],["f",["Devanagari","deva45.webp"],45],["f",["Transliteration","trans45.webp"],45],["p","<b>Additional Names <\/b><i>Kuja<\/i>, <i>Bhauma<\/i>, <i>Mangala<\/i>",45],["p","<b>Description <\/b><i>Angaraka Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of the nine planets (<i>Nava-Graha Hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>. It indicates the character of the planet Mars.",45],["p","<b>Technique <\/b>Assume <i>Suchi Mudra<\/i> (p.240) with your left hand and <i>Mushti <\/i> <i>Mudra <\/i>(p.163) with your right hand. Place your hands in front of your chest and stand in <i>sama <\/i>position (straight and elongated posture). Evoke a fierce gaze.",45],["p","<b>Application <\/b>To denote the planet Mars.",45],["e","Anjali Mudra",46],["i","i173.webp",46],["f",["English","“prayer” or “salutation”"],46],["f",["Devanagari","deva46.webp"],46],["f",["Transliteration","trans46.webp"],46],["p","<b>Description <\/b><i>Anjali Mudra<\/i> is commonly used in yoga and Indian dance. It is the first hand gesture of the twenty-four joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya Darpana.<\/i> It is also noted in the <i>Natya Shastra<\/i>, <i>Abhinaya Chandrika<\/i>, and <i>Hasta Lakshana Deepika<\/i>.3 The associated patron deity is <i>Ksetrapala<\/i>.4",46],["p","<b>Technique <\/b>Join the hands palm to palm in front of the chest, with the fingers collected and extended upward.",46],["p","<b>Application <\/b><i>Namaskaram<\/i> (“to bow or salute”). Used to bow to deities (“<i>Devata<\/i>”), teachers (“<i>Guru<\/i>”), and highly regarded people (“<i>Vipranam<\/i>”). The gesture is held above the head for deities, in front of the face for elders and teachers, and in front of the chest for general respect. It is also used to show obedience, to clap a beat, to indicate the form of <i>Shiva<\/i>, for meditation, and to await instruction from one’s guru. <i>Anjali Mudra <\/i>is used extensively as part of the spiritual cultures of East and West as a gesture of prayer, to show respect, humble oneself, and surrender to the greatness of life.",46],["p","<b>Benefits <\/b>Calming and centering, facilitates connection to the heart and central channel (<i>sushumna-nadi<\/i>), evokes feelings of humility, reverence, and devotion.",46],["e","Apana Mudra",47],["i","i177.webp",47],["f",["English","“downward moving air”
