 or “downward force”"],47],["f",["Devanagari","deva47.webp"],47],["f",["Transliteration","trans47.webp"],47],["p","<b>Description <\/b><i>Apana Mudra<\/i> is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the <i>Yoga Tattva Mudra Vijnana <\/i>form<i>. <\/i>It is used in the yogic tradition to regulate the downward rooting energy in the body; the energetic force governing elimination and purification.",47],["p","<b>Technique <\/b>Join the tips of the ring and middle fingers together with the thumb. Keep the index and little finger extended.",47],["p","<b>Application <\/b>In a comfortable seated position, form the mudra with each hand and rest the hands on the thighs. Soften the belly and breath naturally. Move your attention to the navel center. Smile inwardly and hold for 5 to 45 minutes.",47],["p","<b>Benefits <\/b>General detoxifying effect on the body, improves elimination, reduces constipation, benefits the urinary bladder and uterus, regulates menstruation, and clarifies the skin.",47],["p","<b>Note <\/b>To increase the self-healing effects of this mudra, practice 2 to 3 sessions per day. In the last month of pregnancy the mudra may be used to improve tone and suppleness of the pelvic girdle and birth canal, thereby assisting ease of delivery.",47],["p","<b>Caution <\/b><i>Apana Mudra<\/i> is contraindicated in the first eight months of pregnancy.",47],["e","Arala Mudra",48],["i","i181.webp",48],["f",["English","“bent” or “crooked”"],48],["f",["Devanagari","deva48.webp"],48],["f",["Transliteration","trans48.webp"],48],["p","<b>Description <\/b><i>Arala Mudra<\/i> is the seventh hand gesture of the twenty-eight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya Darpana. <\/i> It is also noted in the <i>Natya Shastra<\/i> and <i>Hasta Lakshana Deepika<\/i>. According to mythology, this mudra originated from the sage <i>Agastya<\/i>5 while he was drinking the seven seas. Its color is red, race is mixed, and patron deity is <i>Vasudeva.<\/i>6",48],["p","<b>Technique <\/b>Hold your hand facing outward with all fingers collected and pointing upward, including the thumb. Bend your index finger 90 degrees at the middle joint.",48],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states and specific actions. <i>Viniyoga<\/i>: <i>Vishadhyam Amritam Panay <\/i> (“drinking poison” or “drinking nectar”); <i>Prachanda Pavana<\/i> (“violent wind”); <i>Aposana<\/i> (“sipping water”). Additional expressions include: benediction, loathing a friend, dressing the hair, wiping sweat from the brow, applying kajal to the eyes, a woman’s self-admiration, and the courage and dignity of a man.",48],["e","Archaka Mudra",49],["i","i185.webp",49],["f",["English","“worshipping”"],49],["f",["Devanagari","deva49.webp"],49],["f",["Transliteration","trans49.webp"],49],["p","<b>Description <\/b><i>Archaka Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) described in the<i> Abhinaya Chandrika.<\/i>7",49],["p","<b>Technique <\/b>Separate the fingers of each hand and connect the fingertips of the two hands, matching corresponding fingers.",49],["p","<b>Application <\/b>Utilized in the dance tradition to express worshipping of deities and expressing respect to divine nature.",49],["p","<b>Benefits <\/b>Improves concentration, calms the nerves, balances left and right hemispheres of the brain.",49],["e","Ardhachandra Mudra",50],["i","i189.webp",50],["f",["English","“half-moon”"],50],["f",["Devanagari","deva50.webp"],50],["f",["Transliteration","trans50.webp"],50],["p","<b>Description <\/b><i>Ardhachandra Mudra <\/i>is the sixth hand gesture of the twenty-eight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>. It is also noted in the <i>Natya Shastra<\/i> and the <i>Abhinaya Chandrika. <\/i>According to mythology, this gesture originated from <i>Shiva’s<\/i> desire for ornaments, of which the moon is one. The associated sage is <i>Atri<\/i>, race is <i>Vaishya<\/i>, color is smoky, and patron deity is <i>Mahadeva<\/i>.",50],["p","<b>Technique <\/b>Raise your hand with the palm facing forward, fingers extended upward. Stretch your thumb away from your palm at a 90-degree angle to your fingers. Maintain active fingers and a flat palm.",50],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Krishna-ashtamibhaji-chandray <\/i> (“the moon on the eighth day of its waning cycle”); <i>Gala-hastarthake<\/i> (“seizing one by the throat”); <i>Bhala-yudha<\/i> (“spear”); <i>Devathanam-abishechana-karmani <\/i> (“offerings to god”); <i>Bukpathra<\/i> (“eating plate”); <i>Udbava<\/i> (“origin” or “birth”); <i>Katyam<\/i> (“waist”); <i>Chintayam<\/i> (“thinking” or “worrying”); <i>Athma-vachakam <\/i> (“contemplation”); <i>Dhyana<\/i> (“meditation”); <i>Prathana<\/i> (“prayers”); <i>Anganam-<\/i> <i>sparsha<\/i> (“touching the limbs”); <i>Prakrutanam-namaskaram<\/i> (“greeting common people”). Additional usages of this mudra denote: a bangle, wrist, mirror, astonishment, effort, intemperance, entirety, counting rhythm, tying up the hair, supporting the cheek in grief, elephant ear, expelling evil, wiping sweat from the brow, adolescence, ability, consecration, eyebrow, cloth, bow, preeminence, tightening the girdle, making a vessel, body, movement of the feet, carrying a child, back of the body.",50],["e","Ardhamukula Mudra",51],["i","i193.webp",51],["f",["English","“half-closed”"],51],["f",["Devanagari","deva51.webp"],51],["f",["Transliteration","trans51.webp"],51],["p","<b>Description <\/b><i>Ardhamukula Mudra <\/i>is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the dance tradition. In the <i>Abhinaya Darpana<\/i>, it is noted as one of the gestures that indicate “wild animals.”",51],["p","<b>Technique <\/b>Fold the little, middle, and index fingers into the palm. Join the tips of the ring finger and thumb.",51],["p","<b>Application <\/b>Used in the dance tradition to denote a cat.",51],["e","Ardhapataka Mudra",52],["i","i197.webp",52],["f",["English","“half-flag”"],52],["f",["Devanagari","deva52.webp"],52],["f",["Transliteration","trans52.webp"],52],["p","<b>Description <\/b><i>Ardhapataka Mudra<\/i> is the third hand gesture of the twenty-eight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>. It is also found in Buddhist and Hindu ritual and art depicting or evoking a deity.",52],["p","<b>Technique <\/b>Raise your hand to face outward with your fingers collected and extended upward. Bend your thumb slightly to touch the base of the index finger. Bend the ring and little finger 90 degrees at the middle joint.",52],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states and specific actions. <i>Viniyoga<\/i>: <i>Pallava<\/i> (“tender leaf” or “new growth”); <i>Phalaka<\/i> (“wooden plank” or “panel for drawing”); <i>Theera<\/i> (“river bank”); <i>Ubayoo-rithi-Vachaka<\/i> (“two” or “two people together”); <i>Krakacha <\/i> (“saw”); <i>Churi-kayancha<\/i> (“pocket knife”); <i>Dvaja<\/i> (“temple flag”); <i>Gopura-<\/i> <i>sringayoh<\/i> (“horns on top of temple tower).",52],["e","Ardharechita Mudra",53],["i","i201.webp",53],["f",["English","“half-contraction of the eyebrow”"],53],["f",["Devanagari","deva53.webp"],53],["f",["Transliteration","trans53.webp"],53],["p","<b>Description <\/b><i>Ardharechita Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the dance tradition. It is noted in the <i>Abhinaya Darpana<\/i>. The patron deity associated with it is <i>Nandikeshvara<\/i>.",53],["p","<b>Technique <\/b>With each hand, fold the index, middle, and ring fingers under the thumb, while stretching the little finger upward. Turn your right palm to face upward, left downward. Keep your hands in front of your torso about 6 inches from the body.",53],["p","<b>Application <\/b>Used by performing artists to denote invitation, giving gifts, and concealing actions.",53],["e","Ardhasuchi Mudra",54],["i","i205.webp",54],["f",["English","“sprout”"],54],["f",["Devanagari","deva54.webp"],54],["f",["Transliteration","trans54.webp"],54],["p","<b>Additional Names <\/b><i>Ardhasuchika<\/i>, <i>Tambula<\/i>",54],["p","<b>Description <\/b><i>Ardhasuchi Mudra <\/i>is a single-hand gesture (<i>asamyukta hasta<\/i>) noted in the <i>Abhinaya Chandrika<\/i>.",54],["p","<b>Technique <\/b>Extend your index finger upward, touching the tip of the thumb to the middle joint of the index finger. The middle, ring, and little fingers are folded into the palm.",54],["p","<b>Application <\/b>Used by performing artists to denote a sprout, young bird, or large insect.",54],["e","Ashvaratna Mudra",55],["i","i209.webp",55],["f",["English","“horse-jewel”"],55],["f",["Devanagari","deva55.webp"],55],["f",["Transliteration","trans55.webp"],55],["p","<b>Description <\/b><i>Ashvaratna Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the <i>Vajrayana<\/i> Buddhist tradition where it is employed in ritual associated with the goddess <i>Tara<\/i>. It also denotes the “Precious Horse,” one of the Seven Jewels of Royal Power (<i>Saptaratna<\/i>).8",55],["p","<b>Technique <\/b>Join the palms together with the index and rings fingers interlaced. Extend the thumbs, ring fingers, and little fingers. Maintain space in the web between the ring and little fingers.",55],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the chest. Relax your shoulders and breathe naturally. Imagine you are mounting a mythical horse that gallops high into the sky, giving you a clear view of your entire life. With this “bird’s eye view,” notice what behaviors in your life are not serving your highest potential. Gathering your determination, renounce any negative habits once and for all, recommitting yourself to a life of spiritual cultivation with new resolve. Hold for 5 to 45 minutes.",55],["p","<b>Benefits <\/b>Balances Earth, Water, and Fire Elements, benefiting digestion, circulation, and overall vitality. Cuts through ego clinging and narrowmindedness, gives new perspective on your choices and life’s path.",55],["e","Avahana Mudra",56],["i","i213.webp",56],["f",["English","“invitation” or “invocation”"],56],["f",["Devanagari","deva56.webp"],56],["f",["Transliteration","trans56.webp"],56],["p","<b>Additional Name <\/b><i>Avahani<\/i>",56],["p","<b>Description <\/b><i>Avahana Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the Hindu tradition where it is used as a ritual gesture to summon the presence of a deity.",56],["p","<b>Technique <\/b>Raise the hands in front of the face, palms facing you, with the sides of the hands touching. Place the tips of the thumbs to the base of the ring fingers. Keep the outer tips of the little finger pads touching, as you splay all of the fingers.",56],["p","<b>Application <\/b>In a comfortable seated position, form the mudra with both hands, resting the hands in your lap palms up. Soften the chest and belly, allowing the ribs to move freely as you breathe in a natural rhythm. Hold for 5 to 45 minutes. To increase the healing potential, or in the case of acute symptoms, practice 3 to 5 sessions per day.",56],["p","<b>Benefits <\/b>Grounding and centering, improves digestion and assimilation, strengthens devotion and connection with one’s personal deity or principle of divinity, truth, etc.",56],["p","<b>Note <\/b>Using <i>Avahana Mudra<\/i> in conjunction with a mantra related to the deity or object of concentration you have selected can greatly enhance the effects of the practice. For general use, the seed mantra Om may be used.",56],["e","Avahita Mudra",57],["i","i217.webp",57],["f",["English","“dissimulation” or “holding things”"],57],["f",["Devanagari","deva57.webp"],57],["f",["Transliteration","trans57.webp"],57],["p","<b>Additional names <\/b><i>Lalita<\/i>, <i>Udveshtitalapadma<\/i>",57],["p","<b>Description <\/b><i>Avahita Mudra<\/i> is the twenty-fourth hand gesture of the twentyfour joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana.<\/i> It is noted in the <i>Natya Shastra<\/i> as a different variation (see “technique” below). Its patron deity is <i>Markandeya<\/i>.9",57],["p","<b>Technique <\/b>Cross two <i>Alapadma Mudras<\/i> (p.41) in front of your chest. The variation noted in the <i>Natya Shastra <\/i>employs crossed <i>Shukatunda Mudras <\/i> (p.228) with the fingers turned to point downward.",57],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Sringara-natana<\/i> (“erotic dance”); <i>Lilakanduka-dharana<\/i> (“holding a ball while playing”); <i>Kucha-artha <\/i> (“breasts”). The <i>Shukatunda<\/i> variation from <i>Natya Shastra<\/i> denotes weakness, sigh, revealing one’s body, thinness, and yearning for the beloved.",57],["p","<b>Note <\/b>The word <i>lalita<\/i> means “graceful elegance.” The <i>Lalita Mudra<\/i> version is held above the head and its patron deity is <i>Vaishnavi<\/i>. It denotes a <i>sala<\/i> tree, fort, and mountain.",57],["e","Badha Mudra",58],["i","i221.webp",58],["f",["English","“suffering”"],58],["f",["Devanagari","deva58.webp"],58],["f",["Transliteration","trans58.webp"],58],["p","<b>Description <\/b><i>Badha Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) noted in the <i>Abhinaya Chandrika<\/i>.",58],["p","<b>Technique <\/b>Clasp the hands together with the fingers firmly cupped.",58],["p","<b>Application <\/b>Utilized in the dance tradition to express suffering or disturbance, as well as pleading for help in the form of divine intervention.",58],["e","Baka Mudra",59],["i","i225.webp",59],["f",["English","“crane”"],59],["f",["Devanagari","deva59.webp"],59],["f",["Transliteration","trans59.webp"],59],["p","<b>Description <\/b><i>Baka Mudra <\/i>is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the dance tradition. In the <i>Abhinaya Darpana<\/i>, it is noted as one of the gestures used to indicate “flying creatures.” Also known as the “mingled <i>Hamsa<\/i> (swan).”",59],["p","<b>Technique <\/b>Join the tips of the index finger and thumb. Extend the middle and ring fingers upward, and fold the little finger down toward the palm.",59],["p","<b>Application <\/b>Used in the dance tradition to denote a crane and other birds.",59],["e","Bam Mudra",60],["i","i229.webp",60],["f",["English","“to bind”"],60],["f",["Devanagari","deva60.webp"],60],["f",["Transliteration","trans60.webp"],60],["p","<b>Description <\/b><i>Bam Mudra<\/i> is a lesser-known joint-hand gesture (<i>samyukta <\/i> <i>hasta<\/i>) used in Tantric Buddhism (<i>Vajrayana<\/i>) during ritual invocation of the goddess <i>Tara<\/i>. The mudra gets its name from the third syllable of the related mantra “<i>Jah Hum Bam Hoh<\/i>,” usually preceded by “<i>Om A Hum<\/i>,” and chanted in conjunction with the use of the mudra as a ritual offering.",60],["p","<b>Technique <\/b>Join the tips of the middle and ring fingers together with the pad of the thumb (both hands are identical). Lightly touch the tips of the index and little fingers, and hold the mudra in front of the throat.",60],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra for 5 to 45 minutes with the shoulders relaxed. Relax and release all interest in gaining results, remaining open to the inherent wisdom expressing spontaneously.",60],["p","<b>Benefits <\/b>Evokes the qualities of openness and acceptance. Used in conjunction with regular meditation practice, this mudra can reveal how the virtuous qualities of the various deities, in this case namely <i>Tara<\/i>, are inherent in our own original nature.",60],["p","<b>Caution <\/b>The mudras and mantras used in <i>Vajrayana<\/i> are best learned under the guidance of a qualified teacher.",60],["e","Bana Mudra",61],["i","i233.webp",61],["f",["English","“arrow”"],61],["f",["Devanagari","deva61.webp"],61],["f",["Transliteration","trans61.webp"],61],["p","<b>Additional names <\/b><i>Teera<\/i>",61],["p","<b>Description <\/b><i>Bana Mudra <\/i>is a single-hand gesture (<i>asamyukta hasta<\/i>) noted in the <i>Abhinaya Chandrika<\/i>.",61],["p","<b>Technique <\/b>Extend the little finger upward and cover the nails of the ring, middle, and index fingers with the thumb.",61],["p","<b>Application <\/b>Used to denote the number six, beautiful eye, and an arrow.",61],["e","Bhairava Mudra",62],["i","i237.webp",62],["f",["English","“fierce,” “terrifying,” or “beyond fear of death”"],62],["f",["Devanagari","deva62.webp"],62],["f",["Transliteration","trans62.webp"],62],["p","<b>Description <\/b><i>Bhairava Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It represents the force responsible for the dissolution of the universe, personified as Lord <i>Shiva<\/i>. The left and right hands represent the <i>ida<\/i> and <i>pingala nadis<\/i> respectively, the lunar and solar energy channels within the body. Joined together, the hands symbolize the innate union of the individual and supreme consciousness.",62],["p","<b>Technique <\/b>Place the right hand on top of the left, and rest both hands in the lap, palms up. Keep all fingers lightly collected, including the thumbs.",62],["p","<b>Application <\/b>In a comfortable seated position, rest the mudra in your lap. If seated in a chair, a cloth may be placed over your lap to provide a stable surface for the mudra to rest upon. Lengthen the spine, soften the belly and chest, and lightly close the eyes. In relaxed stillness, hold the mudra for 5 to 45 minutes.",62],["p","<b>Benefits <\/b>Calms the mind, serves as an aid to meditation, cuts ego clinging, and imparts the courage needed to fully embrace life as it is.",62],["p","<b>Note <\/b>The female counterpart to <i>Bhairava Mudra<\/i> is called <i>Bhairavi Mudra<\/i>, and is formed by placing the left palm on top of the right. Other details of the practice are the same. <i>Bhairavi <\/i> <i>Mudra<\/i> expresses the fierce aspect of the goddess and also symbolizes a female adept of Tantric Yoga.",62],["e","Bhartri Mudra",63],["i","i241.webp",63],["f",["English","“husband”"],63],["f",["Devanagari","deva63.webp"],63],["f",["Transliteration","trans63.webp"],63],["p","<b>Description <\/b><i>Bhartri Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of the eleven relationships (<i>Bandava Hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>. It indicates husband.",63],["p","<b>Technique <\/b>Assume <i>Hamsasya Mudra<\/i> (p.96) with your left hand and <i>Shikhara <\/i> <i>Mudra <\/i>(p.225) with your right hand, held by the throat.",63],["p","<b>Application <\/b>This gesture denotes husband.",63],["e","Bhartri Bhratri Mudra",64],["i","i245.webp",64],["f",["English","“brother-in-law”"],64],["f",["Devanagari","deva64.webp"],64],["f",["Transliteration","trans64.webp"],64],["p","<b>Description <\/b><i>Bhartri Bhratri Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of the eleven relationships (<i>Bandava Hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>. It indicates brother-in-law.",64],["p","<b>Technique <\/b>Assume <i>Shikhara Mudra<\/i> (p.225) with your left hand and <i>Kartarimukha Mudra I <\/i>(p.115) with your right hand. Hold your hands in front of your body or by your side.",64],["p","<b>Application <\/b>To denote a brother-in-law.",64],["e","Bherunda Mudra",65],["i","i249.webp",65],["f",["English","“pair of birds” or “two-headed bird”"],65],["f",["Devanagari","deva65.webp"],65],["f",["Transliteration","trans65.webp"],65],["p","<b>Description <\/b><i>Bherunda Mudra<\/i> is the twenty-third hand gesture of the twentyfour joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana.<\/i>",65],["p","<b>Technique <\/b>Form <i>Kapittha Mudra <\/i>(p.106) with each hand, joining the inner wrists in front of your chest. A variation of this mudra is performed with the wrists across from each other, so the <i>Kapittha<\/i> hands are back to back.",65],["p","<b>Application <\/b>Used to denote the <i>Bherunda<\/i>, which is a two-headed mythological bird of Hindu mythology. <i>Bherunda<\/i> is considered a fierce creature, and is the form that <i>Narasimha<\/i> (the half-lion incarnation of <i>Vishnu<\/i>) turned into during his epic battle with the demon.",65],["e","Bhramara Mudra",66],["i","i253.webp",66],["f",["English","“bee”"],66],["f",["Devanagari","deva66.webp"],66],["f",["Transliteration","trans66.webp"],66],["p","<b>Description <\/b><i>Bhramara Mudra<\/i> is used in yoga and in Classical Indian Dance. It is the twenty-second hand gesture of the twenty-eight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>. It is also noted in the <i>Natya Shastra<\/i>. According to mythology, it originated from <i>Kashyapa<\/i>, while he was preparing earrings for his wife <i>Aditi<\/i>.10 The associated sage is <i>Kapila<\/i>, race is <i>Khachara<\/i>, color is black, and patron deity is <i>Garuda<\/i>.",66],["p","<b>Technique <\/b>Curl your index finger toward the base of the thumb. Touch the tip of the thumb to the first crease of the middle finger. The ring and little fingers remain extended.",66],["p","<b>Application (yoga)<\/b> In a comfortable seated position, form the mudra with both hands, resting the hands in your lap, palms up. Soften the chest and diaphragm, feel the ribs move freely as you breathe in a natural rhythm (do not try to control the breath). In relaxed stillness, hold it for 5 to 45 minutes. To increase the healing potential, or in the case of acute symptoms, practice 3 to 5 sessions per day.",66],["p","<b>Application (dance)<\/b> Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Bhramara<\/i> (“bee”); <i>Shuka<\/i> (“parrot”); <i>Yoga<\/i> (“union”); <i>Paksha<\/i> (“wing of a bird”); <i>Sarasa<\/i> (“crane”); <i>Kokila<\/i> (“cuckoo”). Additional usages denote: vow of silence, horn, elephant tusk, picking flowers, whispering a secret, removing a thorn, and untying a belt.",66],["p","<b>Benefits <\/b>Improves the health of the lungs and large intestine, balances the immune system (particularly in cases of immune over-reaction), reduces allergic reactions to food and pollen, soothes cough and irritated lungs.",66],["e","Brahma Mudra",67],["i","i257.webp",67],["f",["English","“supreme or absolute god of creation”"],67],["f",["Devanagari","deva67.webp"],67],["f",["Transliteration","trans67.webp"],67],["p","<b>Description <\/b><i>Brahma Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of sixteen <i>Deva Hastas<\/i>, denoting Hindu gods and goddesses as described in the<i> Abhinaya Darpana<\/i>. It indicates the form and character of the Hindu deity <i>Brahma<\/i>.",67],["p","<b>Technique <\/b>Assume <i>Chatura Mudra <\/i>(p.73) with your left hand and <i>Hamsasya <\/i> <i>Mudra <\/i>(p.96) with your right. The <i>Chatura<\/i> hand is turned palm upward and held in front of the waist, while the <i>Hamsasya<\/i> hand is held in front of the heart center.",67],["p","<b>Application <\/b>Used to indicate <i>Brahma<\/i>, the Hindu god of creation. Stand with your feet apart and keep your hand gestures about 6 inches away from your body. The hand formation indicates writing with the right hand onto a book held by the left hand. This symbolizes the power of creation.",67],["p","<b>Note <\/b>There are several combinations of mudras used to express the various traits and emblems of <i>Brahma Deva<\/i>. The one indicated here appears to be the most common.",67],["e","Budha Mudra",68],["i","i261.webp",68],["f",["English","“planet Mercury”"],68],["f",["Devanagari","deva68.webp"],68],["f",["Transliteration","trans68.webp"],68],["p","<b>Additional Name <\/b><i>Soumya<\/i>",68],["p","<b>Description <\/b><i>Budha Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of the nine planets (<i>Nava-<\/i> <i>Graha Hastas<\/i>) as described in the <i>Abhinaya Darpana. <\/i>It indicates the character of the planet Mercury.",68],["p","<b>Technique <\/b>Assume <i>Mushti<\/i> (p.163) or<i> Shikhara Mudra <\/i>(p.225) with your left hand and <i>Pataka Mudra <\/i>(p.186) with your right hand. Place your hands in front of your chest and stand in <i>sama <\/i>position (straight and elongated posture). Assume a satisfied and pleasant gaze.",68],["p","<b>Application <\/b>To denote the planet Mercury.",68],["e","Cancuka Mudra",69],["i","i265.webp",69],["f",["English","“bird’s beak”"],69],["f",["Devanagari","deva69.webp"],69],["f",["Transliteration","trans69.webp"],69],["p","<b>Description <\/b><i>Cancuka Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the dance tradition.",69],["p","<b>Technique <\/b>Place your hands palm to palm in front of your face. Cross your thumbs, ring, and little fingers. Keep your middle and index fingers extended and pressed together. The tips of the index and middle fingers point outward and separate to resemble a bird’s beak.",69],["p","<b>Application <\/b>Used in the dance tradition to express the beak of <i>Garuda<\/i>, an eagle, or other birds.",69],["e","Chakra Mudra I",70],["i","i269.webp",70],["f",["English","“wheel” or “discus”"],70],["f",["Devanagari","deva70.webp"],70],["f",["Transliteration","trans70.webp"],70],["p","<b>Description <\/b><i>Chakra Mudra I<\/i> is the thirteenth hand gesture of the twenty-four joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya Darpana.<\/i>",70],["p","<b>Technique <\/b>Both hands form <i>Ardhachandra Mudra <\/i>(p.48)<i>. <\/i>Hold the right hand with the palm facing outward, fingers pointing upward at your right side. Place the left hand across the right, palm facing you.",70],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Chakra<\/i> (“discus” or “wheel”), which symbolizes <i>Vishnu<\/i>. The <i>chakra<\/i>, a sharp, spinning discus-like weapon, known as <i>Sudarshana<\/i>, is held in <i>Vishnu<\/i>’s upper right hand, symbolizing a purified mind.",70],["p","<b>Note <\/b>The name <i>Sudarshana<\/i> is derived from two words—<i>Su<\/i>, which means good, superior, and <i>Darshana<\/i>, which means vision or sight. Together this implies “superior vision,” or seeing the true nature of reality. This mudra represents destruction of one’s ignorance and realization of one’s true nature.",70],["e","Chakra Mudra II",71],["i","i273.webp",71],["f",["English","“wheel”"],71],["f",["Devanagari","deva71.webp"],71],["f",["Transliteration","trans71.webp"],71],["p","<b>Description <\/b><i>Chakra Mudra II<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) ritual mudra used in the Indian Tantric tradition and in Japanese Buddhism (<i>Vajrayana<\/i> tradition), where it is employed by priests as a gesture of offering.",71],["p","<b>Technique <\/b>Interlace the fingers of both hands. Extend the ring fingers, touching the tips of the two fingers together.",71],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the navel. Soften the belly and breathe naturally. Feel the belly grow warm, as if the sun is shining inside your abdomen. Hold for 5 to 45 minutes.",71],["p","<b>Benefits <\/b>Centering and grounding, improves digestion, assimilation and elimination, reduces gas and bloating, increases vigor and self-confidence.",71],["e","Chakravaka Mudra",72],["i","i277.webp",72],["f",["English","“a type of bird”"],72],["f",["Devanagari","deva72.webp"],72],["f",["Transliteration","trans72.webp"],72],["p","<b>Description <\/b><i>Chakravaka Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the dance tradition. In the <i>Abhinaya Darpana<\/i>, it is noted as one of the gestures that indicate “birds.”",72],["p","<b>Technique <\/b>With the palms facing outward, form <i>Alapadma Mudra<\/i> (p.41) with each hand. Hold your hands about 6 inches in front of your body.",72],["p","<b>Application <\/b>Used by performing artists to denote birds.",72],["e","Chandra Mudra",73],["i","i281.webp",73],["f",["English","“Moon”"],73],["f",["Devanagari","deva73.webp"],73],["f",["Transliteration","trans73.webp"],73],["p","<b>Additional names <\/b><i>Nisakara<\/i>, <i>Rajanikara<\/i>, <i>Sudhakara<\/i>, <i>Indu<\/i>, <i>Soma<\/i>",73],["p","<b>Description <\/b><i>Chandra Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of the nine planets (<i>Nava-Graha Hastas<\/i>) as described in the <i>Abhinaya Darpana.<\/i> It indicates the character of the Moon.",73],["p","<b>Technique <\/b>Assume <i>Alapadma Mudra <\/i>(p.41) with your left hand and <i>Pataka <\/i> <i>Mudra <\/i>(p.186) with your right hand. Place your hands by your shoulders and stand in <i>sama <\/i>position (straight and elongated posture). Keep your gaze natural and directed upward.",73],["p","<b>Application <\/b>To denote the Moon.",73],["p","<b>Note <\/b>In addition to the basic moon gesture above, there are different formations to denote the rising moon (<i>bala chandra<\/i>) and the full moon (<i>purna chandra<\/i>) as noted in the<i> Abhinaya <\/i> <i>Darpana<\/i>.11",73],["e","Chandrakala Mudra",74],["i","i285.webp",74],["f",["English","“crescent moon”"],74],["f",["Devanagari","deva74.webp"],74],["f",["Transliteration","trans74.webp"],74],["p","<b>Description <\/b><i>Chandrakala Mudra<\/i> is the fourteenth hand gesture of the twentyeight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana<\/i>.",74],["p","<b>Technique <\/b>Bend the little, ring, and middle fingers into the palm. Extend the index finger and thumb, forming a 90-degree angle.",74],["p","<b>Application <\/b>Primarily used in dance and theater to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Chandra<\/i> (“Moon”); <i>Mukha <\/i> (“face”); <i>Pradesha<\/i> (“the distance between the tip of the index finger and the thumb”); <i>Shivasya Makuta<\/i> (“<i>Shiva’<\/i>s crown”); <i>Ganganadyam<\/i> (“river Ganges”); <i>Laguda<\/i> (“axe” or “cane”).",74],["p","<b>Benefits <\/b>Stimulates the lungs, opens the airways, tones the large intestine, relieves constipation.",74],["e","Chatura Mudra",75],["i","i289.webp",75],["f",["English","“jackal” or “clever”"],75],["f",["Devanagari","deva75.webp"],75],["f",["Transliteration","trans75.webp"],75],["p","<b>Description <\/b><i>Chatura Mudra <\/i>is the twenty-first hand gesture of the twentyeight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana<\/i>. It is also noted in the <i>Natya Shastra<\/i>. According to mythology, when <i>Garuda<\/i> wished to acquire the nectar of immortality, he sought the permission of his father, <i>Kashyapa<\/i>. <i>Kashyapa<\/i> held <i>Chatura Mudra<\/i> as a sign of granting him permission. The associated sage is <i>Valakhilya<\/i>, race is mixed, color is variegated, and patron deity is <i>Garuda<\/i>. In the Hindu tradition this gesture is also known as <i>Chaturahasta<\/i>, and Shiva holds it in his form <i>Chaturatandava<\/i>.12",75],["p","<b>Technique <\/b>Raise your hand to face away from your body. Bend the ring, middle, and index fingers down 90 degrees to the palm, extend the little finger straight up, and touch the tip of the thumb to the base of the ring finger.",75],["p","<b>Application <\/b>In the Hindu tradition, it is used to denote a crafty enemy or a panderer. <i>Shiva Nataraj<\/i> is depicted holding this mudra to dispel danger and provide protection. In the dance and theater tradition, it is used to denote the following <i>Viniyoga<\/i>: <i>Kasturi<\/i> (“musk”); <i>Kimchidartha Swarna-tamra-adi-lohaka <\/i> (“some gold, copper, iron, etc.”); <i>Ardra<\/i> (“wetness”); <i>Bhede <\/i>(“sorrow”); <i>Rasa-<\/i> <i>svada<\/i> (“aesthetic pleasure”);<i> Lochana<\/i> (“eyes”); <i>Varna-bhedana<\/i> (“difference in caste or color”); <i>Sarasa<\/i> (“playful converse”); <i>Pramana<\/i> (“oath”); <i>Mandagamana <\/i> (“slow stroll”); <i>Shakalikrita <\/i>(“shuttering” or “piercing”); <i>Asana<\/i> (“seat”); <i>Ghrita-<\/i> <i>taila-adau<\/i> (“ghee, oil, etc.”). Additional usages denote: dust, concentration, camphor, earring, face, forehead, side glance, beloved, cleverness, mirror, precious stones, sufficient, moderate quantity, sword, and cheek.",75],["e","Chaturasra Mudra I",76],["i","i293.webp",76],["f",["English","“square”"],76],["f",["Devanagari","deva76.webp"],76],["f",["Transliteration","trans76.webp"],76],["p","<b>Description <\/b><i>Chaturasra Mudra I<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the dance tradition. It is noted in the<i> Abhinaya Darpana. <\/i>The patron deity associated with it is<i> Varahi<\/i>.13",76],["p","<b>Technique <\/b>Form <i>Katakamukha Mudra III<\/i> (p.122) with both hands and hold them directly in front of your chest with the shoulders and elbows relaxed, hands facing each other.",76],["p","<b>Application <\/b>This gesture is used in dance and theatre to denote the following: churning, holding, milking, covering with cloth, wearing a necklace, dragging rope, tying the girdle or bodice, holding flowers, using a fly-whisk.",76],["e","Chaturasra Mudra II",77],["i","i297.webp",77],["f",["English","“square”"],77],["f",["Devanagari","deva77.webp"],77],["f",["Transliteration","trans77.webp"],77],["p","<b>Description <\/b><i>Chaturasra Mudra II<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the dance tradition. It is noted in the<i> Natya Shastra.<\/i>",77],["p","<b>Technique <\/b>Form <i>Katakamukha Mudra I <\/i>(p.120) with both hands and hold them directly in front of your chest with the shoulders and elbows relaxed, hands facing each other.",77],["p","<b>Application <\/b>See <i>Chaturasra Mudra I<\/i>.",77],["e","Chaturmukha Mudra",78],["i","i301.webp",78],["f",["English","“four faces” or “four-faced”"],78],["f",["Devanagari","deva78.webp"],78],["f",["Transliteration","trans78.webp"],78],["p","<b>Description <\/b><i>Chaturmukha Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the seventh gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>.",78],["p","<b>Technique <\/b>Lightly touch the tips of the index, middle, ring, and little fingers. The thumbs remain apart.",78],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the solar plexus. Relax the chest and shoulders, and breathe naturally. Hold for 5 to 45 minutes.",78],["p","<b>Benefits <\/b>Readies the mind for meditation, increases feelings of devotion, generosity and surrender, harmonizes Air, Ether, Earth, and Water Elements, while calming the spirit and tempering the heart.",78],["p","<b>Note <\/b>Many mudras, <i>Chaturmukha Mudra<\/i> included, are traditionally used in flow sequences involving numerous hand positions done in procession. Used as part of a set, the power and effect of mudras can be increased. See Appendix B.",78],["e","Chin Mudra",79],["i","i1301.webp",79],["f",["English","“gesture of consciousness”"],79],["f",["Devanagari","deva79.webp"],79],["f",["Transliteration","trans79.webp"],79],["p","<b>Additional Name <\/b><i>Vitarka <\/i>(name used in Buddhist iconography)",79],["p","<b>Description <\/b><i>Chin Mudra<\/i> is perhaps the most commonly used single-hand gesture (<i>asamyukta hasta<\/i>) in the yoga tradition. Its name comes from the Sanskrit word <i>chit<\/i>, meaning “consciousness.” The middle, ring, and little fingers symbolize the three <i>gunas<\/i>: <i>rajas<\/i> “activity,” <i>tamas <\/i>“inertia,” and <i>sattva <\/i> “luminosity<i>.<\/i>” The index finger represents individual consciousness, the thumb universal consciousness. Their joining together in <i>Chin Mudra<\/i> expresses the union, or yoga, of these two aspects. This union is considered the crowning jewel of yoga practice.",79],["p","<b>Technique <\/b>Lightly join the tip of the index finger with the tip of the thumb. Keep the remaining fingers extended and relaxed.",79],["p","<b>Application <\/b>In a comfortable seated position, form the mudra with each hand and place the hands on the knees, palms facing down. Extend the spine, relax the shoulders, and breathe naturally. Lightly focus on the subtle sensations of the physical body. Rest in stillness for 5 to 45 minutes.",79],["p","<b>Benefits <\/b>Sharpens the intellect, reduces daydreaming and mental fantasy during meditation, lifts depression, opens the lower lobes of the lungs (especially when accompanied by deep diaphragmatic breathing); centering and grounding.",79],["p","<b>Note <\/b><i>Chin Mudra<\/i> and <i>Jnana Mudra<\/i> look identical and are used interchangeably in many schools of yoga. The distinction occurs when the mudra is placed on the thighs or knees during seated meditation practice. In some schools of yoga the gesture is referred to as <i>Chin Mudra <\/i> with the palms down, and <i>Jnana Mudra <\/i>when the palms are facing up. The former produces subtle feelings of rootedness, the latter a sense of lightness.",79],["e","Chonmukha Mukha Mudra",80],["i","i307.webp",80],["f",["English","“up and down face” or “face up and face down”"],80],["f",["Devanagari","deva80.webp"],80],["f",["Transliteration","trans80.webp"],80],["p","<b>Additional Name <\/b><i>Unmukhonmukham<\/i>",80],["p","<b>Description <\/b><i>Chonmukha Mukha Mudra<\/i> is a joint-hand gesture (<i>samyukta <\/i> <i>hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra <\/i> <i>Vijnana<\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the fifteenth gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>.",80],["p","<b>Technique <\/b>Collect the fingers of each hand so that the pads of the thumbs lightly touch the pads of the other four fingers. With the left hand facing down, right hand facing up, touch the two mudras together at the fingertips. Hold. Then rotate the hands so that the right hand faces down and the left hand faces up. Hold.",80],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra a few inches in front of the chest or solar plexus. Relax the shoulders and breathe naturally. Begin with the left hand facing down and the right facing up. Hold for 5 to 10 minutes. Keeping the tips of the fingers collected, and the two hands touching, rotate the mudras, bringing the right hand on top and left hand below. Hold for 5 to 10 minutes.",80],["p","<b>Benefits <\/b>Calms the mind, ignites feelings of devotion, balances solar and lunar energies in the body, harmonizes <i>apana<\/i> and <i>prana vayus<\/i>; is used in yoga therapy to aid cancer treatment and healing of autoimmune diseases.",80],["p","<b>Note <\/b>Connecting the tip of the tongue with the upper palate during practice of this mudra will significantly increase the benefits. This facilitates a natural balance between rising and descending energies in the body.",80],["e","Dampati Mudra",81],["i","i311.webp",81],["f",["English","“husband and wife”"],81],["f",["Devanagari","deva81.webp"],81],["f",["Transliteration","trans81.webp"],81],["p","<b>Description <\/b><i>Dampati Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of the eleven relationships (<i>Bandava Hastas<\/i>) as described in the <i>Abhinaya Darpana. <\/i>It indicates husband and wife.",81],["p","<b>Technique <\/b>Assume <i>Shikhara Mudra <\/i>(p.225) with your left hand and <i>Mrigashirsha Mudra <\/i>(p.158) with your right hand. Cross the wrists with the left hand held in front. The left and right hand represent male and female respectively.",81],["p","<b>Application <\/b>This gesture denotes the union of husband and wife (or, esoterically, the relating of male and female energies).",81],["e","Dhanu Mudra",82],["i","i315.webp",82],["f",["English","“bow”"],82],["f",["Devanagari","deva82.webp"],82],["f",["Transliteration","trans82.webp"],82],["p","<b>Description <\/b><i>Dhanu Mudra <\/i>is a single-hand gesture (<i>asamyukta hasta<\/i>) noted in the <i>Abhinaya Chandrika<\/i>.",82],["p","<b>Technique <\/b>Bend the index, middle, and ring fingers into the palm. Stretch the thumb and little fingers away from each other, with the thumb pointing upward and the little finger downward. Hold the hand at arm’s length in front of you, resembling holding a bow.",82],["p","<b>Application <\/b>Typically used in the dance tradition to depict characters holding the bow and arrow such as <i>Rama<\/i>, when he fights <i>Ravana<\/i> to save his wife <i>Sita<\/i>; or <i>Kamadeva<\/i>, the god of love, when he shoots the five flower arrows of the senses; <i>Shiva<\/i> as a hunter; and the goddess as huntress. The bow represents female energy while the arrow (<i>Bana<\/i>) represents the male energy. The bow and arrow represents the power of love and will.",82],["e","Dharmachakra Mudra",83],["i","i319.webp",83],["f",["English","“wheel of dharma”"],83],["f",["Devanagari","deva83.webp"],83],["f",["Transliteration","trans83.webp"],83],["p","<b>Description <\/b><i>Dharmachakra Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition where it is used to express the insight of alternation, the law of change. Birth and death, night and day, gain and loss, growth and decay, enjoyment and suffering: each of these begets the other in an ongoing cycle. In the Buddhist tradition, the mudra is used to symbolize the “turning of the wheel,” or the spreading of the Buddha’s teachings (<i>Buddha <\/i> <i>Dharma<\/i>). Through the practice of contemplation, meditation, and mudras, we can enter a more open and accepting relationship with the law of change. In the words of the <i>Ashtavakragita<\/i>,14 “Awaken to your own nature, and all delusion melts like a dream.” This is the spirit of the <i>Dharmachakra Mudra<\/i>.",83],["p","<b>Technique <\/b>Join the tips of the thumbs and index fingers of each hand. With the hands in front of your heart, touch the tip of the left middle finger to the tips of the right thumb and index. Your right palm faces forward and your left palm faces your body.",83],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of your heart center. Breathe naturally and relax your neck, shoulders, and chest. Notice the rhythm of your breathing: the alternation of the in-breath and out-breath. Hold for 5 to 45 minutes.",83],["p","<b>Benefits <\/b>Opens the chest, facilitates deep breathing, benefits the heart and lungs, balances “inner” and “outer” aspects of life (spiritual and worldly), serves as a window through which we can directly touch the inherent unity behind the veil of duality.",83],["e","Dhvaja Mushti Mudra",84],["i","i323.webp",84],["f",["English","“flag-fist”"],84],["f",["Devanagari","deva84.webp"],84],["f",["Transliteration","trans84.webp"],84],["p","<b>Description <\/b><i>Dhvaja Mushti Mudra <\/i>is a joint-hand mudra (<i>samyukta hasta<\/i>) noted in the <i>Abhinaya Chandrika<\/i>.",84],["p","<b>Technique <\/b>Form a fist with your left hand—bend your fingers inward and place your thumb over the fingers. Place your right palm on top of the fist, palm slightly cupped and facing downward.",84],["p","<b>Application <\/b>Used to express keeping a secret, containing a precious item, concealing something, sealing.",84],["e","Dhyana Mudra",85],["i","i327.webp",85],["f",["English","“meditation,” “contemplation,” or “absorption”"],85],["f",["Devanagari","deva85.webp"],85],["f",["Transliteration","trans85.webp"],85],["p","<b>Additional names <\/b><i>Samadhi<\/i>,<i> Dhyanahasta<\/i>",85],["p","<b>Description <\/b><i>Dhyana Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to many contemplative traditions throughout Asia. It represents the natural relationship between emptiness and form, and is considered one of the purest expressions of our Original Nature.",85],["p","<b>Technique <\/b>Place the left hand in the lap, palm up. Rest the back of the right hand into the palm of the left. Lightly touch the tips of the thumbs together in the shape of a hollow sphere.",85],["p","<b>Application <\/b>In a comfortable seated position, place the mudra lightly in the lap. Keep the pressure between the thumbs very gentle, as if holding a piece of paper. Maintain the hollow feeling of the mudra. Relax the shoulders and let the elbows find their natural position. Do not force the elbows forward, as this will cause unnecessary tension in the neck and shoulders. Sit up straight and, ever so slightly, draw the chin in toward the throat. Release any attempt to control the breath or concentrate the mind. Let things go their own way. Simply sit perfectly still, doing nothing at all. Hold this for as long as you like. A regular practice of 20 minutes a day is considered a basic foundation for beginners. For committed meditation practitioners (living a householder’s life) 1 to 2 hours per day is considered a sufficient life-long routine.",85],["p","<b>Benefits <\/b>Facilitates natural diaphragmatic breathing, aids efficient digestion and assimilation of nutrients, helps the earnest spiritual seeker to embody their Original Nature by releasing striving and attachment; the gesture gives tangible expression to what can’t be explained in words.",85],["p","<b>Note <\/b>If you are sitting in a chair, you can place a shawl or blanket over the lap to give the mudra a more solid foundation to rest on.",85],["e","Dola Mudra",86],["i","i331.webp",86],["f",["English","“swing”"],86],["f",["Devanagari","deva86.webp"],86],["f",["Transliteration","trans86.webp"],86],["p","<b>Description <\/b><i>Dola Mudra<\/i> is the fifth hand gesture of the twenty-four jointhand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya Darpana.<\/i> It is also noted in the <i>Natya Shastra<\/i>. The patron deity associated with it is <i>Bharati<\/i>.",86],["p","<b>Technique <\/b>There are a few variations regarding the placement of this hand gesture. The basic gesture is depicted as two drooping hands (relaxed wrists), fingers collected and extended, yet relaxed. Make sure to relax your wrists and shoulders while performing this mudra. Variation 1: Placing the relaxed hands on the thighs. Variation 2: Placing each hand by its side of the body. Variation 3: Crossing the hands at the wrists, letting them drop limp across each other.",86],["p","<b>Application <\/b>Most commonly used at the beginning of a dance piece as an expression of visual eloquence in the pre-dance position. It denotes a “beautiful hand” and adds the quality of grace and femininity (<i>lasya<\/i>) to the presentation of the dancer. This hand can represent infatuation, fainting, drunkenness, intoxication, indolence, excitement, illness, and sadness in the appropriate context.",86],["e","Dvimukha Mudra",87],["i","i335.webp",87],["f",["English","“two faces”"],87],["f",["Devanagari","deva87.webp"],87],["f",["Transliteration","trans87.webp"],87],["p","<b>Description <\/b><i>Dvimukha Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the fifth gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>.",87],["p","<b>Technique <\/b>Raise the hands in front of the abdomen, palms facing the midline. Lightly touch the tips of the little and ring fingers of both hands.",87],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the abdomen. Breathing naturally, relax the neck, shoulders, and chest. Feel the soothing, sinking quality of Water and the stable, solid quality of Earth. Hold for 5 to 45 minutes.",87],["p","<b>Benefits <\/b>Balances Water and Earth Elements, benefits the kidneys and improves memory, calms the mind and soothes the belly, activates the body’s self-healing capacity, evokes feelings of devotion and purity of heart.",87],["e","Gada Mudra",88],["i","i339.webp",88],["f",["English","“mace” or “club”"],88],["f",["Devanagari","deva88.webp"],88],["f",["Transliteration","trans88.webp"],88],["p","<b>Description <\/b><i>Gada Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used in the Indian Tantric tradition to depict a club or mace. Such a weapon is held by deities to symbolize their fierce commitment to protecting the <i>Dharma <\/i> (spiritual teachings).",88],["p","<b>Technique <\/b>Hold the hands in front of you with the palms up. Bend and interlace the little fingers and ring fingers at the second knuckle. Touch the tips of the middle fingers and extend them upward. Then, form two interlocking rings by touching the tips of the index finders and thumbs on both hands.",88],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of your pelvis, or in the lap, with the middle fingers pointed forward and slightly up. Relax your belly, breathe naturally, and hold for 5 to 45 minutes.",88],["p","<b>Benefits <\/b>Improves elimination and tones the organs of the pelvis, treats hemorrhoids and prolapsed organs, strengthens the <i>Muladhara Chakra<\/i> (root center), opens the flow of rising energy up the back of the body, evokes feelings of stability, groundedness, and safety.",88],["p","<b>Note <\/b>This mudra may also be used by healing arts practitioners, as a tool to address complaints related to the pelvis and/or feelings of fear or instability. Form the mudra and hold it a few inches above the client’s lower belly (about 3 inches below the navel).",88],["e","Gajadanta Mudra",89],["i","i343.webp",89],["f",["English","“elephant’s tusk”"],89],["f",["Devanagari","deva89.webp"],89],["f",["Transliteration","trans89.webp"],89],["p","<b>Description <\/b><i>Gajadanta Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) noted in the <i>Natya Shastra <\/i>and <i>Abhinaya Darpana. <\/i>The patron deity associated with this mudra is<i> Paramatma<\/i>.15",89],["p","<b>Technique <\/b>Both hands assume <i>Sarpashirsha Mudras <\/i>(p.213) and are crossed at the forearm, mutually touching the opposite arms between the elbow and the shoulder. (The picture here shows the initial phase of crossing the two hands.)",89],["p","<b>Application <\/b>Used by performing artists to denote the following: grasping a pillar, pulling up a stone, carrying the bride and groom on their wedding day, or lifting anything heavy.",89],["e","Ganesha Mudra",90],["i","i347.webp",90],["f",["English","“remover of obstacles”"],90],["f",["Devanagari","deva90.webp"],90],["f",["Transliteration","trans90.webp"],90],["p","<b>Description <\/b><i>Ganesha Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is used to evoke the spirit of <i>Ganesha<\/i>, the remover of obstacles, and to generate feelings of stability, confidence, and warmth.",90],["p","<b>Technique <\/b>With the left palm facing outward and the right palm facing your chest, bend the fingers to form a “hook” with each hand. Clasp the two hands together and pull gently to create a solid fit.",90],["p","<b>Application <\/b>This mudra can be used anytime, while standing, sitting, or walking. For a more concentrated practice, sit in a comfortable position with your spine erect. Roll your shoulders back and down, broaden your chest and back. Hold the mudra in front of your heart for 5 to 20 minutes.",90],["p","<b>Benefits <\/b>Opens the chest, facilitates deep breathing, benefits the heart, tones the muscles of the upper back, promotes confidence and courage, evokes the qualities of warmth and care for one’s self and others.",90],["e","Garuda Mudra I",91],["i","i351.webp",91],["f",["English","“mythological bird”"],91],["f",["Devanagari","deva91.webp"],91],["f",["Transliteration","trans91.webp"],91],["p","<b>Description <\/b><i>Garuda Mudra I<\/i> is the twentieth hand gesture of the twenty-four joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya Darpana.<\/i>",91],["p","<b>Technique <\/b>Cross the wrists with your hands facing toward your body. Then, interlock the thumbs, keeping your fingers collected. Roll your hands in a wave-like motion to express the movement of a bird’s wings in flight.",91],["p","<b>Application <\/b>Denotes an eagle or the mythological bird <i>Garuda<\/i>, who is the vehicle (“<i>vahanam<\/i>”) of <i>Vishnu.<\/i>",91],["e","Garuda Mudra II",92],["i","i355.webp",92],["f",["English","“mythological bird”"],92],["f",["Devanagari","deva92.webp"],92],["f",["Transliteration","trans92.webp"],92],["p","<b>Description <\/b><i>Garuda Mudra II<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common in Indian Tantrism and Japanese Buddhism (<i>Vajrayana<\/i>). It depicts a large mythological bird, resembling an eagle. According to tradition, when <i>Garuda<\/i> emerged from his egg he was already fully developed and very powerful. In spiritual parlance, this hints at the notion that our Original Nature is inherently complete, and that enlightenment is not an attainment, but a realization of what is always the case. The image of <i>Garuda<\/i> is a powerful symbol for many cultures throughout Asia. It is found depicted in the military, political, and religious symbolism of Indonesia, Mongolia, India, and Thailand.",92],["p","<b>Technique <\/b>Raise the hands in front of the chest, palms facing your chest. Cross and bend the thumbs, creating a firm pressure between the pads of the fingers. Fan the remaining fingers up and to the sides, in the shape of large wings.",92],["p","<b>Application <\/b><i>Garuda Mudra II<\/i> can be used anytime in any position. The mudra has a particular affinity with eagles and other birds of prey, and can be used to connect with the spirit of birds in general while walking or hiking in nature. As a protector, it can be used before a long journey, particularly in the wilderness, that may have unforeseen dangers (especially snakes). For physical health and spiritual cultivation, apply the mudra in a comfortable seated position and visualize yourself as a huge bird soaring high above the ground, observing yourself from above. Continue this practice for 5 to 45 minutes.",92],["p","<b>Benefits <\/b>Improves intelligence, increases digestive fire, activates <i>Manipura <\/i> <i>Chakra<\/i> (navel center), builds martial prowess, and, according to legend, serves as protection against snakes, snake bites, and venom in general.",93],["p","<b>Note <\/b>The image above shows the mudra as seen from the practitioner’s view.",93],["e","Gavaksha Mudra",94],["i","i361.webp",94],["f",["English","“air-hole” or “lattice”"],94],["f",["Devanagari","deva94.webp"],94],["f",["Transliteration","trans94.webp"],94],["p","<b>Description <\/b><i>Gavaksha Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to Odissi Dance.",94],["p","<b>Technique <\/b>Form <i>Pataka Mudra<\/i> (p.186) with each hand, leaving the fingers slightly separated<i>. <\/i>Hold the right hand with the palm facing outward, fingers pointing upward at your right side. Place the left hand across the right, palm facing you. The fingers are slightly separated, leaving gaps to peek through.",94],["p","<b>Application <\/b>Used by performing artists to express the shyness of the heroine, as she half hides and half peeks through this hand gesture.",94],["p","<b>Note <\/b>This mudra is very similar to <i>Chakra Mudra. <\/i>The difference is that there are spaces between the fingers, and the placement of the gesture is in front of the face, slightly off to the side.",94],["e","Granthita Mudra",95],["i","i365.webp",95],["f",["English","“knot” or “knot of maya”"],95],["f",["Devanagari","deva95.webp"],95],["f",["Transliteration","trans95.webp"],95],["p","<b>Description <\/b><i>Granthita Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the fourteenth gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>.",95],["p","<b>Technique <\/b>Clasp the hands together with the left index finger on top of the right. Lightly touch the tips of thumbs and index fingers, forming two rings.",95],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the throat. Relax the tongue, jaw, and shoulders. Soften the belly and breathe naturally. Feel the inside of the mouth and throat as a hollow space filled with clear light. Hold for 5 to 45 minutes.",95],["p","<b>Benefits <\/b>Prepares the mind for meditation, opens <i>Vishuddha Chakra<\/i> (the throat center), benefits the voice, improves thyroid function, increases the body’s self-healing capacity, especially in cases of cancer.",95],["e","Guru Mudra",96],["i","i369.webp",96],["f",["English","“planet Jupiter”"],96],["f",["Devanagari","deva96.webp"],96],["f",["Transliteration","trans96.webp"],96],["p","<b>Additional names <\/b><i>Brhaspati<\/i>, <i>Dhishana<\/i>",96],["p","<b>Description <\/b><i>Guru Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of the nine planets (<i>Nava-<\/i> <i>Graha Hastas<\/i>) as described in the <i>Abhinaya Darpana. <\/i>It indicates the character of the planet Jupiter.",96],["p","<b>Technique <\/b>Form <i>Shikhara Mudra <\/i>(p.225) with each hand, as if holding a sacred thread. The gaze is fixed upward.",96],["p","<b>Application <\/b>To denote the planet Jupiter. This gesture also indicates a sage (<i>rishi<\/i>) or a <i>Brahmin <\/i>priest.",96],["p","<b>Note <\/b>Your hands can be held as seen in the image above, or with the left thumb pointing downward by the shoulder and the right thumb pointing upward by the hip.",96],["e","Hamsapaksha Mudra",97],["i","i373.webp",97],["f",["English","“swan’s wing”"],97],["f",["Devanagari","deva97.webp"],97],["f",["Transliteration","trans97.webp"],97],["p","<b>Description <\/b><i>Hamsapaksha Mudra <\/i>is the twenty-fourth hand gesture of the twenty-eight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>. It is also noted in the <i>Natya Shastra<\/i>. According to mythology, <i>Tandu<\/i> who expounded <i>Tandava<\/i> dance used this gesture while practicing in front of <i>Shiva<\/i>. The associated sage is <i>Bharata<\/i>, race is <i>Apsara<\/i>, color is blue, and patron deity is <i>Manmatha<\/i> (aka <i>Kamadeva<\/i>, the god of love).",97],["p","<b>Technique <\/b>Hold your hand with the palm facing downward, extend your little finger upward, keeping the index, middle, and little fingers bent at 90 degrees. The tip of the thumb touches the base of the index finger on the outside.",97],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Shat-samkhyam<\/i> (“number six”); <i>Setubandha<\/i> (“constructing a bridge”); <i>Nakha-rekha-ankanam<\/i> (“nail marks”); <i>Pidhana<\/i> (“conceal”). Additional usages denote: playing the <i>veena<\/i>,16 gathering, restraining, bird’s wing, completion of work, and drawing a portrait.",97],["e","Hamsasya Mudra",98],["i","i377.webp",98],["f",["English","“swan’s face”"],98],["f",["Devanagari","deva98.webp"],98],["f",["Transliteration","trans98.webp"],98],["p","<b>Description <\/b><i>Hamsasya Mudra <\/i>is the twenty-third hand gesture of the twentyeight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana<\/i>. It is also noted in the <i>Natya Shastra<\/i>. According to mythology, this mudra is derived from <i>Dakshinamurti<\/i>17 when he was explaining the intricacies of the <i>Tattva<\/i> system.18 Its race is <i>Brahmin<\/i>, and its patron deity is <i>Brahma<\/i>.",98],["p","<b>Technique <\/b>Join the tips of the thumb and index finger, keeping both fingers straight and extended. Separate and extend the middle, ring, and little fingers.",98],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Mangalaye-sutrabandha<\/i> (“tying the marriage thread”); <i>Upadesha<\/i> (“initiation” or “ instruction”); <i>Vinischaye <\/i> (“certainty”); <i>Romancha<\/i> (“horripilation”); <i>Mauktika-adau<\/i> (“pearl necklace and the like”); <i>Dipavarti-prasarana<\/i> (“extending the wick of a lamp”); <i>Nikasha <\/i> (“touch-stone”); <i>Mallika-adau<\/i> (“Jasmine flower and the like”); <i>Chithra <\/i> (“picture”); <i>Tat-lekhana<\/i> (“drawing a picture”); <i>Damsha<\/i> (“fly bite”); <i>Jalabhanda <\/i> (“drop of water”). Additional usages denote: carrying a garland, metaphor, signifying “I am That” (<i>so’ham<\/i>)<i>, <\/i>accomplishment of a task, ritual, decision, offering, speaking, reading, singing, meditation, smell, taking aim, seal-ring.",98],["e","Hamsi Mudra",99],["i","i381.webp",99],["f",["English","“containing the spirit”"],99],["f",["Devanagari","deva99.webp"],99],["f",["Transliteration","trans99.webp"],99],["p","<b>Description <\/b><i>Hamsi Mudra<\/i> is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the Hindu and yoga traditions. It is found in the <i>Yoga Tattva <\/i> <i>Mudra Vijnana<\/i> form where it is used to relieve obstacles and restore child-like joy and laughter.",99],["p","<b>Technique <\/b>Join the tips of the middle, ring, and little fingers with the tip of the thumb. Extend the index finger.",99],["p","<b>Application <\/b>This mudra may be done in any position; while walking, standing, sitting, or reclining. It is best to approach <i>Hamsi Mudra<\/i> with the spirit of play and exploration. Hold as long as you like.",99],["p","<b>Benefits <\/b>Removes obstacles in one’s life, eases depression and sadness, evokes feelings of lightness and laughter, benefits the lungs and large intestine, improves assimilation of nutrients and elimination of waste.",99],["p","<b>Note <\/b>In India, <i>Hamsi Mudra <\/i>is commonly practiced along with the recitation of mantras or prayers. It is commonly used during ritual worship, <i>puja<\/i> or <i>yajna<\/i>, to increase the effects of the intended ritual.",99],["e","Hridaya Mudra",100],["i","i385.webp",100],["f",["English","“heart seal” or “gesture of the heart”"],100],["f",["Devanagari","deva100.webp"],100],["f",["Transliteration","trans100.webp"],100],["p","<b>Description <\/b><i>Hridaya Mudra<\/i> is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the yoga tradition. It is used to strengthen the heart and release pent-up emotions. It is almost identical in appearance and application to <i>Mritsamjivani Mudra<\/i>, with the exception of a subtle, yet important difference in the placement of the index finger.",100],["p","<b>Technique <\/b>Roll the index finger down on itself so the tip tucks into the base and the first knuckle touches the base of the thumb. Join the tips of the middle and ring fingers with the thumb. Extend the little finger.",100],["p","<b>Application <\/b>May be used anytime in any position to benefit the heart. For more powerful results, form the mudra with each hand and sit quietly in a comfortable position, hands resting palms up on the thighs. Relax the solar plexus (area below the sternum) and breathe naturally. Smile inwardly to your heart, feeling your chest open and relaxed. Hold for 5 to 45 minutes. Practice 2 to 3 sessions per day for best results.",100],["p","<b>Benefits <\/b>Rejuvenates the heart and pericardium, releases accumulated stress and emotions, regulates blood pressure and heart rate, reduces anxiety, opens <i>Anahata Chakra<\/i> (heart center).",100],["e","Indra Mudra",101],["i","i389.webp",101],["f",["English","“deity of heaven and storms”"],101],["f",["Devanagari","deva101.webp"],101],["f",["Transliteration","trans101.webp"],101],["p","<b>Additional names <\/b><i>Sakra<\/i>, <i>Devendra<\/i>, <i>Devapati<\/i>",101],["p","<b>Description <\/b><i>Indra Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of sixteen<i> Deva Hastas<\/i>, denoting Hindu gods and goddesses as described in the<i> Abhinaya Darpana<\/i>. It indicates the form and character of the Hindu deity <i>Indra<\/i>.",101],["p","<b>Technique <\/b>Assume <i>Tripataka Mudra <\/i>(p.253) with each hand. Cross the wrists and raise the hands overhead.",101],["p","<b>Application <\/b>Used to indicate <i>Indra<\/i>, the Hindu god of heaven. Hands are held above the head and symbolize a thunderstorm or mountain.",101],["e","Jnana Mudra",102],["i","i1301.webp",102],["f",["English","“seal of wisdom”"],102],["f",["Devanagari","deva102.webp"],102],["f",["Transliteration","trans102.webp"],102],["p","<b>Description <\/b><i>Jnana Mudra<\/i> is the single-hand gesture (<i>asamyukta hasta<\/i>) expressing the “seal of wisdom,” common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana<\/i> form, and is the most common mudra used for meditation on <i>pranava.<\/i>19",102],["p","<b>Technique <\/b>Lightly join the tips of the thumb and index finger, with the remaining fingers extended and relaxed.",102],["p","<b>Application <\/b>In a comfortable seated position, form the mudra with both hands and rest the hands on the thighs, palms up. Relax the chest and shoulders, and breathe naturally. Hold for 5 to 45 minutes.",102],["p","<b>Benefits <\/b>Evokes the feeling of lightness, calms the mind and brightens the spirit, opens the chest and facilitates diaphragmatic breathing, reverses the outward flow of <i>prana<\/i> and directs energy back toward the body, increases the benefits of any <i>asana<\/i> (yogic position).",102],["p","<b>Note <\/b><i>Jnana Mudra<\/i> and <i>Chin Mudra<\/i> look identical and are used interchangeably in many schools of yoga. The distinction occurs when the mudra is placed on the thighs or knees during seated meditation practice. In some schools of yoga the gesture is referred to as <i>Chin Mudra <\/i> with the palms down, and <i>Jnana Mudra <\/i>when the palms are facing up. The former produces a subtle feeling of rootedness, while the latter evokes a sense of lightness.",102],["e","Jyeshtha Kanishtha Bhratri Mudra",103],["i","i395.webp",103],["f",["English","“oldest-youngest-brothers”"],103],["f",["Devanagari","deva103.webp"],103],["f",["Transliteration","trans103.webp"],103],["p","<b>Description <\/b><i>Jyeshtha Kanishtha Bhratri Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of the eleven relationships (<i>Bandava Hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana. <\/i>It indicates brothers.",103],["p","<b>Technique <\/b>Assume <i>Shikhara Mudra<\/i> (p.225) with your left hand and <i>Mayura <\/i> <i>Mudra<\/i> (p.154) with your right hand. Move the hands forward and backward.",103],["p","<b>Application <\/b>To denote elder or younger brother.",103],["e","Kaleshvara Mudra",104],["i","i399.webp",104],["f",["English","“lord of time”"],104],["f",["Devanagari","deva104.webp"],104],["f",["Transliteration","trans104.webp"],104],["p","<b>Description <\/b><i>Kaleshvara Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It works primarily with the Elements of Fire and Ether, is used to calm the mind, and as a tool to reflect clearly on one’s actions.",104],["p","<b>Technique <\/b>Join the tips of the middle fingers and extend them forward. Fold the index, ring, and little fingers in toward the palms, touching them at the middle joints. Touch the tips of the thumbs together and point them toward the heart.",104],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the chest. Drop the shoulders and let the elbows find a natural, relaxed position. Turn your attention inward, allowing the mind to gaze upon itself. Without preference or attachment, simply notice what arises. Hold for 5 to 45 minutes.",104],["p","<b>Benefits <\/b>Calms and clears the mind, benefits the brain, strengthens the heart and pericardium, assists in the breaking of negative patterns and addictive behaviors.",104],["e","Kamajayi Mudra",105],["i","i403.webp",105],["f",["English","“conquering lust”"],105],["f",["Devanagari","deva105.webp"],105],["f",["Transliteration","trans105.webp"],105],["p","<b>Description <\/b><i>Kamajayi Mudra<\/i> is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form where it is used to subliminate sexual energy into spiritual aspirations.",105],["p","<b>Technique <\/b>Cover the nail of the thumb with the pad of the index finger. The remaining fingers stay relaxed and slightly curled.",105],["p","<b>Application <\/b>This mudra may be done in any position; while walking, standing, sitting, or reclining. It is also effective when applied during practice of yoga <i>asanas<\/i> (postures) where the arms are outstretched.",105],["p","<b>Benefits <\/b>Restrains the outflow of excess passion and sexual desire, causes sexual energy to turn inward and upward (thereby assisting the practice of meditation), strengthens digestion, assimilation, and elimination.",105],["p","<b>Note <\/b><i>Kamajayi Mudra<\/i> is traditionally used by celibate yogis while on solitary meditation retreat. It may be employed anytime you wish to temper the flames of sexual desire.",105],["p","<b>Caution <\/b>Use of this mudra should never be inspired by feelings of guilt or shame around sex or sexuality. A repressive approach to sexual energy can cause serious physiological and psychological problems. Sexual energy is one of the most beautiful and powerful sources of energy in the human body. A balanced and healthy relationship to sexuality is essential for health, longevity, and spiritual growth.",105],["e","Kangula Mudra I",106],["i","i407.webp",106],["f",["English","“tail” or “plough” or “hand”"],106],["f",["Devanagari","deva106.webp"],106],["f",["Transliteration","trans106.webp"],106],["p","<b>Additional Name <\/b><i>Langula<\/i>",106],["p","<b>Description <\/b><i>Kangula Mudra I <\/i>is the nineteenth hand gesture of the twentyeight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana<\/i>. It is also noted in the <i>Natya Shastra.<\/i> According to mythology, this mudra derived from <i>Shiva<\/i> when he made a pellet from the poison that sprang from the sea of milk and held it in his hand, forming <i>Kangula.<\/i> The associated sage is <i>Kumaraswamy<\/i>, race is <i>Siddha<\/i>, color is golden, and patron deity is <i>Lakshmi <\/i>or<i> Padma.<\/i>",106],["p","<b>Technique <\/b>Tuck the ring finger in to the center of the palm and extend the remaining fingers. In a variation of this mudra, the tips of all the remaining fingers touch (see <i>Kangula Mudra II<\/i>).",106],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states and specific actions. <i>Viniyoga<\/i>: <i>Lakuchasyapala <\/i> (“lakucha fruit”); <i>Bala-kucha<\/i> (“young girl’s breast”); <i>Kalharaka<\/i> (“white waterlily”); <i>Chakora<\/i> (“partridge”); <i>Kramuka<\/i> (“betel-nut tree”); <i>Bala-kimkinyam <\/i> (“baby’s anklets”); <i>Ghutika-adika<\/i> (“pill”); <i>Chataka<\/i> (“chataka bird”); <i>Nalikera <\/i> (“coconut”); <i>Gantika<\/i> (“bell”). Additional usages denote: grapes, <i>rudraksha <\/i> seed, holding the chin, nipples, star, balls of snow, jasmine flowers, and any small object.",106],["e","Kangula Mudra II",107],["i","i411.webp",107],["f",["English","“tail” or “plough” or “hand”"],107],["f",["Devanagari","deva107.webp"],107],["f",["Transliteration","trans107.webp"],107],["p","<b>Description <\/b><i>Kangula Mudra II<\/i> is a single-hand gesture (<i>asamyukta hasta<\/i>) used in the Hindu tradition to represent a nut, seed, or anything that is small yet contains great potential. By forming the mudra, the ring finger (Earth) is contained and concealed by all the other fingers and Elements. This is symbolic of the hidden power of the human spirit.",107],["p","<b>Technique <\/b>Curl the ring finger down into the palm. Join the tips of the index, middle, and little finger together with the thumb.",107],["p","<b>Application <\/b>In a comfortable seated position, form the mudra with each hand and place the hands on the thighs, palms up. Gather the saliva in your mouth and swallow it in three gulps. Feel the saliva travel all the way to your navel, as if you were swallowing seeds of light. Then, soften your belly and chest and breathe naturally. Rest your attention lightly on the sensation at your navel center. Hold for 5 to 45 minutes.",107],["p","<b>Benefits <\/b>Improves digestion and assimilation, activates hidden talents and gifts, awakens somatic intuition (gut feeling), harmonizes human biorhythms with the rhythms and cycles of the Earth.",107],["p","<b>Note <\/b>When endeavoring to activate hidden potential within ourselves, it is important to always cultivate a virtuous foundation first. The most foolproof way of doing this is thinking of how we can use our talents to benefit all beings. Here is a simple prayer you can use for this purpose: “May my thoughts, words, and actions be in alignment with the highest good for all beings.”",107],["e","Kapittha Mudra I",108],["i","i415.webp",108],["f",["English","“wood-apple”"],108],["f",["Devanagari","deva108.webp"],108],["f",["Transliteration","trans108.webp"],108],["p","<b>Additional Name <\/b><i>Ankusha<\/i>",108],["p","<b>Description <\/b><i>Kapittha Mudra I <\/i>is the eleventh hand gesture of the twenty-eight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>. It is also noted in the <i>Natya Shastra<\/i>, and in the <i>Abhinaya Chandrika <\/i>(as <i>Ankusha<\/i>)<i>.<\/i> According to mythology, this mudra originates from the time gods completed churning the ocean of milk to release the nectar of immortality. <i>Vishnu<\/i> then used this hand gesture to pull Mount Mandara from the waters. The associated sage is <i>Narada<\/i>, race is <i>Rishi<\/i>, color is smoky-white, and patron deity is <i>Padmagarbha <\/i>(<i>Vishnu<\/i>).",108],["p","<b>Technique <\/b>Tuck the little, ring, and middle fingers into the palm. Extend the thumb straight up, placing the pad of the index finger on the tip of the thumb.",108],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Lakshmyam<\/i> (“Goddess Lakshmi”); <i>Sarasvatyam<\/i> (“Goddess Sarasvati”); <i>Veshtane<\/i> (“winding”); <i>Taladharana<\/i> (“holding cymbals”); <i>Godohanam<\/i> (“milking cows”); <i>Anjanam <\/i> (“applying collyrium”); <i>Lilakusuma-dharana<\/i> (“holding flowers gracefully”); <i>Chelanchala-adi-grahana<\/i> (“grasping the end of a <i>saree<\/i> or a robe”); <i>Patasya-iva-<\/i> <i>avaguntana<\/i> (“covering the head with a veil”); <i>Dhupa-dipa-archanam<\/i> (“offering incense”).",108],["e","Kapittha Mudra II",109],["i","i419.webp",109],["f",["English","“elephant apple” or “wood apple”"],109],["f",["Devanagari","deva109.webp"],109],["f",["Transliteration","trans109.webp"],109],["p","<b>Description <\/b><i>Kapittha Mudra II <\/i>is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the Hindu tradition. It is usually seen depicted by a deity, and represents the ritual offering of incense or fruit (specifically a wood apple), the female sexual organ, and the act of sexual union.",109],["p","<b>Technique <\/b>Insert the thumb in the web between the index and middle fingers. Close all the remaining fingers as if making a fist.",109],["p","<b>Application <\/b>In a comfortable seated position, form the mudra with each hand. Place the left hand against the heart, and the right hand against the pubic bone. Soften the chest, throat, and belly, and breathe naturally. Focus on the feeling of unity between the sexual and spiritual aspects of your life. Hold for 5 to 45 minutes.",109],["p","<b>Benefits <\/b>Can be used as a tool for sexual healing (releasing guilt and shame around sexuality), increases sensitivity and receptivity, stimulates healthy libido, opens the connection between the pelvis and heart, expands feelings of devotion and loving kindness.",109],["e","Kapota Mudra",110],["i","i423.webp",110],["f",["English","“dove”"],110],["f",["Devanagari","deva110.webp"],110],["f",["Transliteration","trans110.webp"],110],["p","<b>Description <\/b><i>Kapota Mudra<\/i> is the second hand gesture of the twenty-four joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya Darpana.<\/i> It is also noted in the <i>Natya Shastra <\/i>and<i> Abhinaya Chandrika<\/i>. The patron deity associated with it is <i>Chitrasena<\/i>.",110],["p","<b>Technique <\/b>Join the hands palm to palm, as in <i>Anjali Mudra <\/i>(p.44), and create a hollow space between your palms by cupping them away from each other.",110],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Praname<\/i> (“bowing” or “taking oath”); <i>Guru-sambhasha<\/i> (“conversation with teachers or elders”); <i>Vinaya-<\/i> <i>angikritishu<\/i> (“agreeing humbly”). Additional usages according to the <i>Natya <\/i> <i>Shastra<\/i>: acquiescence, rows of trees, plantain flower, cold, modesty, collecting things, citron, and casket.",110],["p","<b>Benefits <\/b>Used to cultivate humbleness and inward reflection. Can be used to dispel anxiety and coldness by separating the hands quickly and repeatedly forming the gesture.",110],["e","Karagra Milita Mudra",111],["i","i427.webp",111],["f",["English","“fingertips joined”"],111],["f",["Devanagari","deva111.webp"],111],["f",["Transliteration","trans111.webp"],111],["p","<b>Additional Name <\/b><i>Lata<\/i>",111],["p","<b>Description <\/b><i>Karagra Milita Mudra <\/i>is a joint-hand gesture (<i>samyutka hasta<\/i>) mentioned in the <i>Odissi Dance Pathfinder Vol. II<\/i>. An identical mudra named <i>Lata <\/i>(“creeper”) is mentioned in several ancient texts such as the <i>Abhinaya <\/i> <i>Darpana<\/i> and the <i>Natya Shastra.<\/i> The patron deity associated is <i>Shakti<\/i>.",111],["p","<b>Technique <\/b>Place your hands about 6 inches in front of your navel, with the palms face up and middle fingers touching at the tips. Keep your shoulders relaxed and arms slightly rounded.",111],["p","<b>Application <\/b>Used at the beginning of a type of ancient South Indian dance called <i>Svabhava Natana<\/i> (“spontaneous pure dance”). Denotes swing, motionless, “heavy with drink,” lines, and union. This mudra is often used in Classical Indian Dance to initiate a graceful “
