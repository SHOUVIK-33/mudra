ya Shastra.<\/i> The <i>Abhinaya Darpana<\/i> describes it as a single-hand gesture (<i>asamyukta hasta<\/i>), while the <i>Natya Shastra <\/i>calls it a joint-hand gesture (<i>samyukta hasta<\/i>).",183],["p","<b>Technique <\/b>With the palm facing downward, bend the wrist and fan out the fingers. To form the joint-hand version, join the wrists and circle the hands around each other in a spiral-like motion. Move the hands up and down simulating leaves swirling in the wind.",183],["p","<b>Application <\/b>In the dance tradition, it is utilized in <i>Nritta<\/i> or “pure dance” to express delicate grace and beauty.",183],["e","Pallava Mudra II",184],["i","i726.webp",184],["f",["English","“leaf swaying in the wind”"],184],["f",["Devanagari","deva184.webp"],184],["f",["Transliteration","trans184.webp"],184],["p","<b>Description <\/b><i>Pallava Mudra II<\/i> is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the last gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>.",184],["p","<b>Technique <\/b>Raise the right hand in front of the right shoulder with the palm facing forward. Relax the hand and allow the fingers to separate and move slowly, as if each finger is a leaf swaying in the wind. Rest the right elbow in the left palm.",184],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra for 5 to 30 minutes. Feel that you are a mighty tree. Your lower hand (left) digs down into the earth (roots), and your upper hand (right) stretches to the sky (leaves). Feel that you are breathing with your skin and lungs. As you breathe in, <i>prana<\/i> (energy) absorbs through your skin; as you breathe out, this energy consolidates in to your belly, deeply nourishing your body.",184],["p","<b>Benefits <\/b>Harmonizes all Five Elements, balances the immune system, activates the body’s self-healing power, improves the suppleness of the joints, tendons, and ligaments.",184],["e","Panchamukha Mudra",185],["i","i730.webp",185],["f",["English","“five faces”"],185],["f",["Devanagari","deva185.webp"],185],["f",["Transliteration","trans185.webp"],185],["p","<b>Description <\/b><i>Panchamukha Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the eighth gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>.",185],["p","<b>Technique <\/b>Join the tips of all of the fingers, hollowing the palms, as if holding a ball of light between the hands.",185],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the solar plexus (below the sternum). Relax the shoulders and chest, and breathe naturally. Hold for 5 to 45 minutes.",185],["p","<b>Benefits <\/b>Balances the left and right hemispheres of the brain (by affecting the corpus callosum, which acts as a bridge between the two hemispheres), improves concentration and memory retention, benefits the tendons, activates the body’s self-healing power.",185],["e","Parvati Mudra",186],["i","i734.webp",186],["f",["English","“the divine mother”"],186],["f",["Devanagari","deva186.webp"],186],["f",["Transliteration","trans186.webp"],186],["p","<b>Description <\/b><i>Parvati Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of sixteen <i>Deva Hastas<\/i>, denoting Hindu gods and goddesses as described in the <i>Abhinaya Darpana<\/i>. It indicates the form and character of the Hindu deity <i>Parvati<\/i>.",186],["p","<b>Technique <\/b>Assume <i>Ardhachandra Mudra<\/i> (p.48) with each hand. Hold the right hand with fingers pointing upward and the left hand with fingers pointing downward; forming <i>Abhaya<\/i> (dispelling fear) and <i>Varada<\/i> (bestowing protection), respectively. Hold the hand gestures at waist height to the sides of your body about 6 inches in front of you. Assume the posture of <i>abhanga <\/i> (shifting your weight to one foot and slightly bending the torso).",186],["p","<b>Application <\/b>Used to indicate <i>Parvati<\/i>, the Hindu goddess known as the Divine Mother. She is the consort of <i>Shiva<\/i>.",186],["p","<b>Note <\/b>There are several combinations of mudras used to express the various traits and emblems of <i>Parvati Devi.<\/i> The one indicated here appears to be the most common.",186],["e","Pasha Mudra",187],["i","i738.webp",187],["f",["English","“noose”"],187],["f",["Devanagari","deva187.webp"],187],["f",["Transliteration","trans187.webp"],187],["p","<b>Description <\/b><i>Pasha Mudra<\/i> is the fifteenth hand gesture of the twenty-four joint-hand mudras (s<i>amyukta hastas<\/i>) as described in the <i>Abhinaya Darpana.<\/i>",187],["p","<b>Technique <\/b>With the pads of the thumb, touch the nails of the middle, ring, and little fingers on each hand. Extend the index fingers and hook them together with one palm facing up, the other facing down.",187],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Anyonya Kalaha<\/i> (“fighting” or “lovers’ quarrel”); <i>Pasha<\/i> (“noose”); <i>Shrinkhalayam<\/i> (“chain”).",187],["e","Pataka Mudra",188],["i","i742.webp",188],["f",["English","“flag”"],188],["f",["Devanagari","deva188.webp"],188],["f",["Transliteration","trans188.webp"],188],["p","<b>Additional Name <\/b><i>Dhvaja<\/i>",188],["p","<b>Description <\/b><i>Pataka Mudra <\/i>is the first hand gesture of the twenty-eight singlehand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>. It is also noted in the <i>Natya Shastra<\/i> and <i>Abhinaya Chandrika <\/i>(as <i>Dhvaja<\/i>)<i>.<\/i> This hand gesture is the most versatile of all dance mudras and has many meanings and usages. According to mythology, it originated when <i>Brahma<\/i> (the creator) went to <i>Parabrahma<\/i> (the supreme being) to salute him with his hand held like a flag, symbolizing victory. Since then, it has been called the “flag hand.” The associated sage is <i>Shiva<\/i>, race is <i>Brahmana<\/i>, color is white, and patron deity is <i>Parabrahma<\/i>. It is very similar to <i>Abhaya Mudra<\/i>, used in Buddhism and in the yoga tradition.",188],["p","<b>Technique <\/b>Raise your hand to face outward, with all the fingers collected and extended upward.",188],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Natya-rambha<\/i> (“beginning of the dance or drama”); <i>Varivahay<\/i> (“rain clouds”); <i>Bhana<\/i> (“forest”); <i>Vasthu <\/i> <i>Nishaydhanay<\/i> (“forbidding or avoiding things”; <i>Kuchasithala<\/i> (“bosom”); <i>Nisayam<\/i> (“night”); <i>Nadyam<\/i> (“river”); <i>Amaramandala<\/i> (“heaven”); <i>Thuranga <\/i> (“horse”); <i>Kandhana<\/i> (“cutting” or “ignoring”); <i>Vayu<\/i> (“wind”); <i>Shayana <\/i> (“sleeping” or “reclining”); <i>Gamana-udyama<\/i> (“walking” or “embarking on a long journey”); <i>Pratapa<\/i> (“prowess”); <i>Prasada<\/i> (“blessing” or “graciousness”); <i>Chandrika<\/i> (“moonlight”); <i>Gana-atapa<\/i> (“intense radiance” or “scorching sunlight”); <i>Kavata-patanam<\/i> (“opening a door”); <i>Saptha-vibakthi-artham <\/i> (“mentioning the seven cases of grammar”); <i>Tharanga<\/i> (“wave”); <i>Veethipravaysha-<\/i> <i>bhava<\/i> (“entering a street”); <i>Samathva<\/i> (“equality”); <i>Angaragaka<\/i> (“massaging” or “applying sandal paste”); <i>Athmartham<\/i> (“one’s self”); <i>Shapatham<\/i> (“taking an oath”); <i>Thushneembhava-nidharshanam<\/i> (“silence” or “secret act”); <i>Talapathra <\/i> (“palm leaf”); <i>Kayday<\/i> (“shield”); <i>Dravyadi-sparshanam<\/i> (“touching things”); <i>Aashirvada Kriyayam<\/i> (“benediction”); <i>Nrupasreshtrasya Bhavana<\/i> (“a good king or emperor”); <i>Tatra-tatra-iti-vachanam<\/i> (“this and that”); <i>Sindhu<\/i> (“ocean wave”); <i>Sukrudikrama<\/i> (“to do good deeds”); <i>Sambhodhanam<\/i> (“addressing”—a person some distance away); <i>Purogaypee<\/i> (“to move forward”); <i>Khadgasya-<\/i> <i>rupadharana<\/i> (“holding a sword”); <i>Masa<\/i> (“month”); <i>Samvathsara<\/i> (“year”); <i>Varsadhina<\/i> (“rainy day”); <i>Sammarjana<\/i> (“sweeping the floor” or “to sprinkle water”).",189],["e","Phupphusamocana Mudra",190],["i","i748.webp",190],["f",["English","“chest opening” or “lung freeing”"],190],["f",["Devanagari","deva190.webp"],190],["f",["Transliteration","trans190.webp"],190],["p","<b>Description <\/b><i>Phupphusamocana Mudra<\/i> is a single-hand gesture (<i>asamyukta <\/i> <i>hasta<\/i>) used in the yoga tradition to ease depression, strengthen the lungs, and as first aid for acute lung problems such as asthma.",190],["p","<b>Technique <\/b>Touch the little finger to the base of the thumb, ring finger to the middle of the thumb, and middle finger to the tip of the thumb. Extend the index finger.",190],["p","<b>Application <\/b>Form the mudra with both hands. Raise your arms to your sides, shoulder height, and turn palms to face away from you. Lengthen the arms with gentle inner force, as if pushing two imaginary walls apart. Extend the index finger a little more. Relax the neck and shoulders, and breathe naturally (do not hold your breath). Feel your chest open and your back wide. Create more room to breathe. Hold as long as comfortable.",190],["p","<b>Benefits <\/b>Clears the airways, opens the chest, and improves the elasticity of the ribcage, facilitating ease of breathing, strengthens the immune system, specifically reducing susceptibility to lung-related complaints, helps the processing of grief and sadness, and helps lift the heaviness of depression.",190],["p","<b>Note <\/b>In the beginning you may only be able to perform this exercise for a short time. With practice, you will learn to relax from within and let your breathing float your arms. This may be done seated or standing. Practice 3 to 5 sessions per day. Alternately, you may simply place the mudra in your lap and rest in stillness for 5 to 45 minutes.",190],["p","<b>Caution <\/b>In the case of acute lung problems, mudras and other self-healing methods are best used in conjunction with professional medical care.",190],["e","Pitri Mudra",191],["i","i752.webp",191],["f",["English","“father”"],191],["f",["Devanagari","deva191.webp"],191],["f",["Transliteration","trans191.webp"],191],["p","<b>Description <\/b><i>Pitri Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of the eleven relationships (<i>Bandava Hastas<\/i>) as described in the <i>Abhinaya Darpana.<\/i> It indicates father or son-in-law.",191],["p","<b>Technique <\/b>Assume <i>Samdamsha Mudra<\/i> (p.206) with your left hand and <i>Shikhara Mudra <\/i>(p.225) with your right hand.",191],["p","<b>Application <\/b>This gesture denotes father or son-in-law, depending on the context of the performance.",191],["e","Prabodhika Mudra",192],["i","i756.webp",192],["f",["English","“dawn”"],192],["f",["Devanagari","deva192.webp"],192],["f",["Transliteration","trans192.webp"],192],["p","<b>Description <\/b><i>Prabodhika Mudra <\/i>is a single-hand gesture (<i>asamyukta hasta<\/i>) noted in the <i>Abhinaya Chandrika<\/i>.",192],["p","<b>Technique <\/b>Extend the thumb and index fingers while bending the middle, ring, and little fingers loosely into the palm (without touching the palm).",192],["p","<b>Application <\/b>Used to convey the question, “Where are you?” usually in the context of yearning to unite with the beloved. It is similar in appearance to <i>Chandrakala Mudra<\/i>.",192],["e","Pradeepa Mudra",193],["i","i760.webp",193],["f",["English","“oil lamp”"],193],["f",["Devanagari","deva193.webp"],193],["f",["Transliteration","trans193.webp"],193],["p","<b>Description <\/b><i>Pradeepa Mudra <\/i>is a joint-hand mudra (<i>samyukta hasta<\/i>) noted in the <i>Abhinaya Chandrika<\/i>.",193],["p","<b>Technique <\/b>Make a fist with your left hand. With the fingers curved upward, place the back of the right hand on top of the left fist.",193],["p","<b>Application <\/b>Used in the dance tradition to illustrate the Hindu ritual of offering light to the deities by circling an ignited oil lamp in front of the deity.38",193],["e","Pralamba Mudra",194],["i","i764.webp",194],["f",["English","“spread offerings” or “garland”"],194],["f",["Devanagari","deva194.webp"],194],["f",["Transliteration","trans194.webp"],194],["p","<b>Description <\/b><i>Pralamba Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yogic tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the sixteenth gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>.",194],["p","<b>Technique <\/b>With the palms facing down, join the tips of the thumbs while keeping the other fingers collected.",194],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the abdomen. Soften the hands and relax the shoulders. Open your heart to hear the wishes and prayers of all beings—our shared longing to be free and happy. Respond with sincere blessings that you feel emanate from your hands like a huge garland of pearls, encircling the entire universe. Hold the mudra and visualization for 5 to 30 minutes.",194],["p","<b>Benefits <\/b>Opens the heart, calms the spirit, awakens feelings of devotion and compassion, benefits the cardiovascular system by lowering blood pressure, reduces anxiety, weakens ego grasping.",194],["e","Prana Mudra",195],["i","i768.webp",195],["f",["English","“energy seal”"],195],["f",["Devanagari","deva195.webp"],195],["f",["Transliteration","trans195.webp"],195],["p","<b>Description <\/b><i>Prana Mudra<\/i> is a single-hand gesture (<i>asamyukta hasta<\/i>) common to numerous yoga traditions throughout Asia. It is part of the <i>Yoga Tattva <\/i> <i>Mudra Vijnana<\/i> form where it is used in recuperation from injury or illness, to increase energy reserves, and bolster the effects of other mudras. In the context of Buddhism and Asian martial arts, it is called “sword finger” or the “sword of wisdom,” and is applied in a ritual manner to cut through ignorance and laziness, or in the context of martial and healing arts, to direct vital energy (<i>prana<\/i>,<i> qi<\/i>,<i> ki<\/i>).",195],["p","<b>Technique <\/b>Cover the tips of the ring and little fingers with the pad of the thumb. Extend the index and middle finger.",195],["p","<b>Application <\/b>In a comfortable seated position, form the mudra with each hand. With the extended fingers pointing forward, rest the hands against the sides of the abdomen. Lift the perineum and contract the anus firmly. Relax the chest and ribs, and adjust your breathing to be slow, smooth, and deep. Visualize a ball of golden-red light inside your abdomen. This ball of light is growing brighter with each breath. Hold in stillness for 5 to 45 minutes.",195],["p","<b>Benefits <\/b>Increases overall vitality and immunity, activates the body’s selfhealing potential, benefits the eyes, improves digestion, assimilation, and elimination, decreases the body’s susceptibility to injury and disease, improves concentration, strengthens willpower and stamina.",195],["p","<b>Note <\/b><i>Prana Mudra<\/i> may be done anytime in any position, especially when feeling tired. It is especially useful during practice of standing yoga <i>asanas<\/i> (postures) where the arms are extended. In this case, the mudra increases the energetic effects of the pose or exercise. It may also be used as a healing tool to assist the body’s innate capacity to repair itself. Hold the mudra about 6 inches away from the body with the “sword fingers” pointing toward the affected area. Breathe naturally and let go. Do not try to use your mind or will make energy move or cause a specific effect to occur. This same principle of non-action applies when using <i>Prana Mudra<\/i> for selfhealing or helping others to heal.",196],["e","Prithivi Mudra",197],["i","i774.webp",197],["f",["English","“earth”"],197],["f",["Devanagari","deva197.webp"],197],["f",["Transliteration","trans197.webp"],197],["p","<b>Description <\/b><i>Prithivi Mudra<\/i> is a joint-hand mudra (<i>samyukta hasta<\/i>) common to the yoga tradition. It is used in the <i>Yoga Tattva Mudra Vijnana<\/i> to affect the Earth Element for the purpose of improving digestion, and generally to strengthen the bodily constitution.",197],["p","<b>Technique <\/b>Lightly join the tips of the thumb and ring finger. The other fingers remain extended and relaxed.",197],["p","<b>Application <\/b>In a comfortable seated position, form the mudra with each hand. Rest the hands in the lap, palms facing up. Soften the ribs and belly, and adjust your breathing to be slow, smooth, and deep. Feel the belly rise with the inhalation and fall with the exhalation. Imagine a ball of golden-red light inside your abdomen growing brighter with each breath. Hold for 5 to 45 minutes.",197],["p","<b>Benefits <\/b>Strengthens digestion and assimilation, helps rebuild a thin and frail constitution, creates a sense of centeredness and grounding, benefits the skin, improves the disposition, helps one adjust to any kind of change or disruption to the normal schedule or routine; spiritually it establishes a sense of effortless joy.",197],["p","<b>Note <\/b><i>Prithivi Mudra<\/i> may be practiced while walking, standing, or lying down. Anytime you desire to feel more centered and grounded, such as before a presentation, exam, or long journey, you can employ this mudra discreetly.",197],["e","Purna Jnana Mudra",198],["i","i778.webp",198],["f",["English","“complete wisdom”"],198],["f",["Devanagari","deva198.webp"],198],["f",["Transliteration","trans198.webp"],198],["p","<b>Additional Name <\/b><i>Jnanam<\/i>",198],["p","<b>Description <\/b><i>Purna Jnana Mudra<\/i> is a joint-hand mudra (<i>samyukta hasta<\/i>) used in the <i>Yoga Tattva Mudra Vijnana<\/i> form. It is one of the thirty-two <i>Gayatri <\/i> <i>Mudras<\/i>, specifically the second gesture in the sub-set of eight mudras practiced after meditation or recitation of the <i>Gayatri Mantra<\/i>.",198],["p","<b>Technique <\/b>Lightly join the tips of the thumbs and index fingers of both hands.",198],["p","<b>Application <\/b>In a comfortable seated position, form the mudra with each hand. Hold the right hand in front of the heart and rest the left hand on the knee, palm facing up. Relax the shoulders and chest, and breathe naturally. Release effort and any expectation for results. Simply relax into the texture of your own direct experience. Hold for 5 to 45 minutes.",198],["p","<b>Benefits <\/b>Opens the chest for ease of breathing, calms the heart and spirit, improves intelligence and ability to concentrate, expands feelings of compassion and care for self and others, serves as a gateway for discovering the innate wisdom arising in our own direct experience.",198],["e","Pushpa Mudra",199],["i","i782.webp",199],["f",["English","“flower”"],199],["f",["Devanagari","deva199.webp"],199],["f",["Transliteration","trans199.webp"],199],["p","<b>Description <\/b><i>Pushpa Mudra <\/i>is a single-hand gesture (<i>asamyukta hasta<\/i>) noted in the <i>Abhinaya Chandrika<\/i>.",199],["p","<b>Technique <\/b>Bend the little and ring fingers and tuck them into the center of your palm. Extend the thumb, middle, and index fingers upward, forming a triangle between the fingertips.",199],["p","<b>Application <\/b>Used to denote a flower or flower offering in the dance tradition. It is also known in the Japanese Buddhist tradition as “the <i>bodhisattva<\/i> of flowers” and is used in specific rites and rituals to signify the offering of flowers.",199],["e","Pushpaputa Mudra",200],["i","i786.webp",200],["f",["English","“flower-vessel”"],200],["f",["Devanagari","deva200.webp"],200],["f",["Transliteration","trans200.webp"],200],["p","<b>Additional names <\/b><i>Pushpanjali<\/i>, <i>Kandajali<\/i>, <i>Vyapakanjalikam<\/i>",200],["p","<b>Description <\/b><i>Pushpaputa Mudra <\/i>is the sixth hand gesture of the twenty-four joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>. It is also noted in the <i>Natya Shastra.<\/i> The patron deity associated with it is <i>Ksetrapala<\/i>.",200],["p","<b>Technique <\/b>With the palms facing upward, curve the hands and join the outer side of the little fingers, as if to create a basket-like shape in front of your heart center.",200],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Nirajana-vidhau<\/i> (“offering light”); <i>Vari-phala-adigrahana<\/i> (“receiving fruit or water”); <i>Samdhyayam-<\/i> <i>arghya-dana<\/i> (“twilight offering to the sun”); <i>Mantra-pushpa<\/i> (“offering flowers while chanting”). It is generally used to offer and receive flowers, fruit, corn, rice, or water.",200],["e","Putra Mudra",201],["i","i790.webp",201],["f",["English","“son”"],201],["f",["Devanagari","deva201.webp"],201],["f",["Transliteration","trans201.webp"],201],["p","<b>Description <\/b><i>Putra Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of the eleven relationships (<i>Bandava Hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>. It indicates son. It replaces <i>Bhartri Mudra<\/i> (“husband”) in some translations of the text.",201],["p","<b>Technique <\/b>Form <i>Alapadma Mudra<\/i> (p.41) with your left hand and <i>Shikhara <\/i> <i>Mudra<\/i> (p.225) with your right hand.",201],["p","<b>Application <\/b>This gesture denotes son.",201],["e","Rahu Mudra",202],["i","i794.webp",202],["f",["English","“dragon’s head”"],202],["f",["Devanagari","deva202.webp"],202],["f",["Transliteration","trans202.webp"],202],["p","<b>Additional Name <\/b><i>Swarbhanu<\/i>",202],["p","<b>Description <\/b><i>Rahu Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of the nine planets (<i>Nava-<\/i> <i>Graha Hastas<\/i>) as described in the <i>Abhinaya Darpana. <\/i>In Hindu mythology, <i>Rahu<\/i> is the severed head of an <i>asura<\/i> (demon) that swallows the sun or moon, thus causing eclipses. He is depicted in Indian art as a serpent with no body, riding a chariot drawn by eight black horses.",202],["p","<b>Technique <\/b>Assume <i>Sarpashirsha Mudra<\/i> (p.213) with your left hand and <i>Suchi <\/i> <i>Mudra <\/i>(p.240) with your right hand. Place your hands in front of your chest<i>. <\/i> Evoke a cruel gaze.",202],["p","<b>Application <\/b>To denote the ascending (north) lunar node, <i>Rahu<\/i>.",202],["e","Ravana Mudra",203],["i","i798.webp",203],["f",["English","“demon”"],203],["f",["Devanagari","deva203.webp"],203],["f",["Transliteration","trans203.webp"],203],["p","<b>Description <\/b><i>Ravana Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the dance tradition. In the <i>Abhinaya Darpana<\/i>, it is noted as one of the gestures that indicate “famous emperors and heroes.”",203],["p","<b>Technique <\/b>Hold the hands with palms facing outward above your shoulders, near your face. Spread your fingers wide and rapidly apply a subtle shake to the hands as you move the hands out to your sides.",203],["p","<b>Application <\/b>Used by performing artists to denote the <i>rakshasa <\/i>(demon) <i>Ravana<\/i>, and other wild and ferocious characters.",203],["e","Rechita Mudra",204],["i","i802.webp",204],["f",["English","“emptied”"],204],["f",["Devanagari","deva204.webp"],204],["f",["Transliteration","trans204.webp"],204],["p","<b>Description <\/b><i>Rechita Mudra<\/i> is a joint-hand dance gesture (<i>samyukta hasta<\/i>) noted in the <i>Natya Shastra <\/i>and <i>Abhinaya Darpana. <\/i>The patron deity associated is<i> Yaksharaja<\/i>.",204],["p","<b>Technique <\/b>Assume <i>Hamsapaksha Mudra<\/i> (p.95) with each hand. Hold the hands waist height, palms facing up, in front of your body.",204],["p","<b>Application <\/b>Used by performing artists to display a painted panel or precious art. Move your hands in an arc-like motion to denote the motion of holding a young child.",204],["e","Rudra Mudra",205],["i","i806.webp",205],["f",["English","“roaring,” “howling,” or “lord of wind and storm”"],205],["f",["Devanagari","deva205.webp"],205],["f",["Transliteration","trans205.webp"],205],["p","<b>Description <\/b><i>Rudra Mudra<\/i> is a single-hand gesture (<i>asamyukta hasta<\/i>) used in the yogic tradition to open <i>Manipura Chakra<\/i> (the navel center), strengthen digestion, and improve overall vitality.",205],["p","<b>Technique <\/b>Join the tips of the index finger, ring finger, and thumb. Extend the middle and little fingers.",205],["p","<b>Application <\/b>In a comfortable seated position, form the mudra with each hand. Place the hands on the thighs, palms facing up. Bring your attention to the abdomen, visualizing a golden-red orb of light at your navel growing brighter with each breath. Hold for 5 to 45 minutes. This mudra may also be practiced while walking, standing, or reclining.",205],["p","<b>Benefits <\/b>Improves digestion, assimilation, and elimination, regulates body weight, addresses organ prolapses, heals dizziness, sluggishness, and exhaustion.",205],["p","<b>Note <\/b><i>Rudra<\/i> is identified as a pre-Vedic deity associated with storms, fire, wildness, ferocity, fertility, cattle, and other domestic animals. Eventually, the name <i>Rudra<\/i> came to represent the fierce aspect of <i>Shiva<\/i>. In post-Vedic times, the names <i>Rudra<\/i> and <i>Shiva<\/i> are often used interchangeably.",205],["e","Rupa Mudra",206],["i","i810.webp",206],["f",["English","“form” or “appearance”"],206],["f",["Devanagari","deva206.webp"],206],["f",["Transliteration","trans206.webp"],206],["p","<b>Description <\/b><i>Rupa Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the Buddhist <i>Vajrayana<\/i> tradition. It is usually held by a priest while performing specific rites or rituals, and may often be accompanied by a mantra.",206],["p","<b>Technique <\/b>Raise the hand in front of the chest, with the palms facing each other. Cross the wrists, with the left hand in front. Interlock the little fingers. Bend the middle and ring fingers, covering the nails with the pad of the thumb. Extend the index fingers upward.",206],["p","<b>Application <\/b>Usually performed to represent or evoke the form of a particular deity or protector.",206],["p","<b>Note <\/b>Since this mudra is used in the context of ritual, it is not normally associated with particular healing benefits for the individual (although the rituals themselves often have beneficial implications for the community in which they are performed).",206],["e","Sahasrara Mudra",207],["i","i814.webp",207],["f",["English","“thousand-petalled lotus”"],207],["f",["Devanagari","deva207.webp"],207],["f",["Transliteration","trans207.webp"],207],["p","<b>Description <\/b><i>Sahasrara Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used in the yogic tradition to access the connection between heaven (sun, moon, stars, and planets) and human beings. This gesture relates to the <i>Sahasrara <\/i> <i>Chakra<\/i> (crown center) and increases awareness of the spiritual dimension of life and the insight/experience of the interdependent nature of all things.",207],["p","<b>Technique <\/b>Join the tips of the index fingers and thumbs to form a diamond shape with the hands.",207],["p","<b>Application <\/b>This mudra may be practiced standing or seated, or in any position, as long as the top of the head is pointing toward the sky. Hold the mudra about 6 inches over your head. Relax the shoulders and breathe naturally. Feel as if you are receiving a shower of light from above. Let this cool light wash through your body from head to toe. Hold for 5 to 20 minutes. Multiple sets per day may be practiced.",207],["p","<b>Benefits <\/b>Improves brain function, reduces headaches, increases concentration, stimulates the pituitary and pineal glands (benefiting all of the endocrine glands), nourishes the hair, activates the body’s self-healing power, calms the spirit, induces the feeling of connection with all life.",207],["p","<b>Note <\/b>Practicing outdoors under the open sky is a great way to experience this mudra. During daylight hours, when the sun is not too intense, hold the mudra overhead and feel the gentle warmth of the sun illuminate the body from head to toe. Do not practice in direct sunlight between 10 am and 2 pm. At night, you may practice under the light of the moon and stars, feeling the “healing light of heaven” cleanse and heal the body from head to toe.",207],["e","Samdamsha Mudra",208],["i","i818.webp",208],["f",["English","“biting,” “stinging,” or “clinging”"],208],["f",["Devanagari","deva208.webp"],208],["f",["Transliteration","trans208.webp"],208],["p","<b>Description <\/b><i>Samdamsha Mudra <\/i>is the twenty-fifth hand gesture of the twentyeight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana<\/i>. It is also noted in the <i>Natya Shastra. <\/i>According to mythology, this mudra originated from the goddess<i> Sarasvati<\/i> when she held the rosary (<i>mala<\/i>) in her hand. The associated sage is <i>Visvavasu<\/i>, race is <i>Vidyadhara<\/i>, color is white, and patron deity is <i>Valmiki<\/i>.",208],["p","<b>Technique <\/b>This mudra requires motion. The starting position is identical to <i>Padmakosha Mudra<\/i> (p.180). Maintaining a hollow palm, open and close all five fingers repeatedly.",208],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Udara<\/i> (“stomach” or “generosity”); <i>Balidhana<\/i> (“sacrificial offerings”); <i>Vrana<\/i> (“wound”); <i>Kita <\/i> (“insect”); <i>Maha-bhaya<\/i> (“great fear”); <i>Archana<\/i> (“worship”); <i>Pancha-samkhayam <\/i> (“number five”). Additional usages denote: tooth, small bud, singing, <i>lasya <\/i> dance (feminine expression), brief explanation, scales, line, examining, truth, saying “no,” saying “a little,” moment, listening, poison, slowness, bug, or fly.",208],["p","<b>Note <\/b>A variation of this mudra is performed with the middle finger extended upward.",208],["e","Samdamsha Mukula Mudra",209],["i","i822.webp",209],["f",["English","“grasping bud”"],209],["f",["Devanagari","deva209.webp"],209],["f",["Transliteration","trans209.webp"],209],["p","<b>Description <\/b><i>Samdamsha Mukula Mudra <\/i>is a single-hand gesture (<i>asamyukta <\/i> <i>hasta<\/i>) common to the dance tradition. In the <i>Abhinaya Darpana<\/i>, it is noted as one of the gestures that indicate “flying creatures.”",209],["p","<b>Technique <\/b>Cover the nails of the index and middle finger with the pad of thumb. Extend the ring and little fingers upward and keep them separated. Flutter your hands to express the movement of a bird.",209],["p","<b>Application <\/b>Used in the dance tradition to denote a crow.",209],["e","Samputa Mudra I",210],["i","i826.webp",210],["f",["English","“bud” or “vessel”"],210],["f",["Devanagari","deva210.webp"],210],["f",["Transliteration","trans210.webp"],210],["p","<b>Description <\/b><i>Samputa Mudra I<\/i> is the fourteenth hand gesture of the twentyfour joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana.<\/i>",210],["p","<b>Technique <\/b>Cup your hands and join them together palm to palm. Maintain space in the center, as if holding something fragile. Hold the hands about 6 inches in front of your body.",210],["p","<b>Application <\/b>Used by performing artists to indicate a casket or a box, as well as to imply the act of concealing things (“<i>vasthvachada<\/i>”).",210],["e","Samputa Mudra II",211],["i","i830.webp",211],["f",["English","“bud” or “vessel”"],211],["f",["Devanagari","deva211.webp"],211],["f",["Transliteration","trans211.webp"],211],["p","<b>Additional Name <\/b><i>Kapota<\/i>",211],["p","<b>Description <\/b><i>Samputa Mudra II<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the second gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra.<\/i>",211],["p","<b>Technique <\/b>Join the hands palm to palm with the thumbs resting side by side. Then, create a hollow space between the palms, large enough for the thumbs to enter the opening.",211],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the heart center. Relax the shoulders and chest, and breathe naturally. Bring your attention to the space between your hands. Hold this space delicately, as if carrying a baby bird. Hold for 5 to 30 minutes.",211],["p","<b>Benefits <\/b>Balances all Five Elements, benefits the heart and lungs, reduces mental and emotional suffering, serves as a gateway to directly experiencing exquisite openness, our own Original Nature.",211],["e","Sankirna Mudra",212],["i","i834.webp",212],["f",["English","“cow”"],212],["f",["Devanagari","deva212.webp"],212],["f",["Transliteration","trans212.webp"],212],["p","<b>Description <\/b><i>Sankirna Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the dance tradition. It is listed as one of the gestures that indicate “wild animals” in the <i>Abhinaya Darpana.<\/i>",212],["p","<b>Technique <\/b>Cross the hands at the wrists, with the palms facing away from you. Bend the middle finger 90 degrees at the second joint, and keep the remaining fingers extended.",212],["p","<b>Application <\/b>Used by performing artists to denote a cow.",212],["e","Sapatni Mudra",213],["i","i838.webp",213],["f",["English","“co-wife”"],213],["f",["Devanagari","deva213.webp"],213],["f",["Transliteration","trans213.webp"],213],["p","Image I",213],["p","<b>Description <\/b><i>Sapatni Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of the eleven relationships (<i>Bandava Hastas<\/i>) as described in the <i>Abhinaya Darpana.<\/i> It indicates co-wife.",213],["p","<b>Technique <\/b>This is a progression of two",213],["i","i840.webp",213],["p","hand gestures performed one after the other. First, assume <i>Pasha Mudra<\/i> (p.185) with both hands (Image I). Then, transition to <i>Mrigashirsha Mudra <\/i>(p.158) with both hands (Image II), and place them on your belly.",213],["p","<b>Application <\/b>This gesture denotes a co-wife, a wife who has to cope with the relational challenges of sharing a household with Image II — other wives.",213],["e","Sarasvati Mudra",214],["i","i844.webp",214],["f",["English","“goddess of art and knowledge”"],214],["f",["Devanagari","deva214.webp"],214],["f",["Transliteration","trans214.webp"],214],["p","<b>Additional names <\/b><i>Bharati<\/i>, <i>Vagdevi<\/i>",214],["p","<b>Description <\/b><i>Sarasvati Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of sixteen <i>Deva Hastas<\/i>, denoting Hindu gods and goddesses as described in the <i>Abhinaya Darpana<\/i>. It indicates the form and character of the Hindu deity <i>Sarasvati<\/i>.39",214],["p","<b>Technique <\/b>Assume <i>Kapittha Mudra<\/i> (p.106) with your left hand, and <i>Suchi <\/i> <i>Mudra <\/i>(p.240) with your right hand. Hold the left hand in front of the left shoulder with the index finger of your right hand pointing toward your left hand.",214],["p","<b>Application <\/b>Used to indicate <i>Sarasvati<\/i>, the Hindu goddess of knowledge, music, art, science, and technology; consort of <i>Brahma<\/i>.",214],["p","<b>Note <\/b>There are several combinations of mudras used to express the various traits and emblems of<i> Sarasvati Devi<\/i>. The one indicated here appears to be the most common.",214],["e","Sarpashirsha Mudra",215],["i","i848.webp",215],["f",["English","“serpent head”"],215],["f",["Devanagari","deva215.webp"],215],["f",["Transliteration","trans215.webp"],215],["p","<b>Description <\/b><i>Sarpashirsha Mudra<\/i> is the sixteenth hand gesture of the twentyeight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana<\/i>. It is also noted in the <i>Natya Shastra<\/i>. According to mythology, this mudra originated from <i>Vishnu<\/i>, who used it while assuming the form of <i>Vamana<\/i> to protect the <i>Devas<\/i> against <i>Bali<\/i>.40 The associated sage is <i>Vasava<\/i>, race is <i>Deva<\/i>, color is yellow, and patron deity is <i>Shiva<\/i>.",215],["p","<b>Technique <\/b>Raise the hand with the fingers together and palm facing forward. Round the fingers slightly to form the shape of a snake hood.",215],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Chandana<\/i> (“sandal paste”); <i>Bhujaga<\/i> (“snake”); <i>Mandra<\/i> (“low pitch”); <i>Prokshana<\/i> (“sprinkling”); <i>Poshana <\/i> (“nourishing”); <i>Devasya-udakadhaneshu<\/i> (“offering water to god”); <i>Gaja-<\/i> <i>kumbhayoh Aspahala<\/i> (“flapping of elephant ears”); <i>Mallanam Bhujasthana <\/i> (“wrestler’s arms”). Additional usages denote: rouge, mud, doing <i>pranayama <\/i> (breathing practice), washing the face, charity, fondling, milk, saffron flower, bashfulness, concealing a child, image or idol, clinging, saying “very true,” and holding a woman’s breast.",215],["e","Shakata Mudra I",216],["i","i852.webp",216],["f",["English","“cart” or “carriage”"],216],["f",["Devanagari","deva216.webp"],216],["f",["Transliteration","trans216.webp"],216],["p","<b>Description <\/b><i>Shakata Mudra I <\/i>is the eleventh hand gesture of the twenty-four joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya Darpana.<\/i>",216],["p","<b>Technique <\/b>Roll the index finger into the base of the thumb on each hand. Extend the remaining fingers, connecting the tips of the thumbs and middle fingers.",216],["p","<b>Application <\/b>Used by performing artists to denote <i>rakshasas<\/i> (“demons”). In the dynamic version, the two hands are separated and moved toward the sides of the head.",216],["e","Shakata Mudra II",217],["i","i856.webp",217],["f",["English","“cart” or “carriage”"],217],["f",["Devanagari","deva217.webp"],217],["f",["Transliteration","trans217.webp"],217],["p","Image I",217],["p","<b>Description <\/b><i>Shakata Mudra II<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the twelfth gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>.",217],["p","<b>Technique <\/b>With the palms facing down, lightly join the tips of the thumbs. Variation 1: Bend the index finger 90 degrees at the middle joint, and extend the remaining fingers (Image I). Variation 2: Extend the index fingers forward and curl the other fingers in toward the palms (Image II).",217],["p","<b>Application <\/b>In a comfortable seated",217],["i","i858.webp",217],["p","position, hold the mudra in front of the solar plexus. Relax the chest, shoulders, and belly. Breathe naturally and hold for 5 to 30 minutes.",217],["p","<b>Benefits <\/b>Strengthens the immune system, facilitates breathing in the lower lobes of the lungs, improves concentration, benefits the large intestine.",217],["p","Image II",217],["e","Shakti Mudra",218],["i","i862.webp",218],["f",["English","“creative force” or “goddess of vital energy”"],218],["f",["Devanagari","deva218.webp"],218],["f",["Transliteration","trans218.webp"],218],["p","<b>Description <\/b><i>Shakti Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used in the yoga tradition to induce sleep and relax the organs and musculature of the pelvis.",218],["p","<b>Technique <\/b>With the palms facing each other, join the tips of the ring and little fingers. Fold the thumbs into the palms and cover them with the index and middle fingers.",218],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the heart center. Soften the belly and breathe naturally. Bring attention to your pelvis, noticing the sensations and emotion that arise. Without judgment or criticism, let your experience unfold spontaneously. Whatever arises during this practice, treat it with great care and tenderness. Hold for 5 to 45 minutes.",218],["p","<b>Benefits <\/b>Calms the mind, relaxes the body, induces sound sleep, reduces cramping of lower abdominal organs (especially useful for relieving menstrual cramps), releases pelvic tension, heals physical and emotional trauma associated with unconscious sex and/or sexual abuse, opens the doorway to receptivity and intimacy, serves as a powerful connection to the divine feminine, the lunar rhythm, tides, and the myriad other cycles of nature.",218],["e","Shani Mudra",219],["i","i866.webp",219],["f",["English","“planet Saturn”"],219],["f",["Devanagari","deva219.webp"],219],["f",["Transliteration","trans219.webp"],219],["p","<b>Additional names <\/b><i>Sanaischara<\/i>, <i>Manda<\/i>, <i>Sthitra<\/i>, <i>Souri<\/i>",219],["p","<b>Description <\/b><i>Shani Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of the nine planets (<i>Nava-<\/i> <i>Graha Hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>. It indicates the character of the planet Saturn.",219],["p","<b>Technique <\/b>Assume <i>Shikhara Mudra<\/i> (p.225) with your left hand and <i>Trishula <\/i> <i>Mudra <\/i>(p.254) with your right hand. Place the hands in front of your chest and stand in <i>sama <\/i>position (straight and elongated posture). Assume a menacing gaze.",219],["p","<b>Application <\/b>To denote the planet Saturn. This mudra, in its dynamic form, requires movement of the hands in a winding manner in front of the face.",219],["e","Shankha Mudra I",220],["i","i870.webp",220],["f",["English","“conch shell”"],220],["f",["Devanagari","deva220.webp"],220],["f",["Transliteration","trans220.webp"],220],["p","<b>Description <\/b><i>Shankha Mudra I<\/i> is the twelfth hand gesture of the twenty-four joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya Darpana.<\/i>",220],["p","<b>Technique <\/b>Grasp the left thumb with the right hand. Bring the hands together, with the tip of the right thumb touching the tips of the left index, middle, and ring fingers.",220],["p","<b>Application <\/b>Used by performing artists to signify the <i>Shankha <\/i>(“conch shell”), which often denotes <i>Vishnu<\/i>. It is one of the sacred emblems of the Hindu god of preservation (<i>Vishnu<\/i>). <i>Vishnu<\/i> holds the <i>Shankha<\/i> in his upper left hand, which represents his power to create and maintain the universe.",220],["e","Shankha Mudra II",221],["i","i874.webp",221],["f",["English","“conch shell”"],221],["f",["Devanagari","deva221.webp"],221],["f",["Transliteration","trans221.webp"],221],["p","<b>Description <\/b><i>Shankha Mudra II<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the fifth gesture in the sub-set of eight mudras practiced after meditation or recitation of the <i>Gayatri Mantra<\/i>.",221],["p","<b>Technique <\/b>Grasp the left thumb with the right hand. Bring the hands together, with the tip of the right thumb touching the tips of the left index, middle, and ring fingers.",221],["p","<b>Application <\/b>In a comfortable seated position, raise the mudra in front of the heart. Relax the shoulders and belly, and breathe naturally. Lengthen the spine, and become very still and quiet. Listen intently to the silence. Hold for 5 to 45 minutes.",221],["p","<b>Benefits <\/b>Improves the voice, helps reduce speech defects such as stuttering, calms the mind, improves concentration, nourishes the kidneys and sexual glands (testes and ovaries), benefits the hair and bones, has a special connection with the navel center, thereby improving digestion and increasing appetite.",221],["e","Shankhasura Mudra",222],["i","i878.webp",222],["f",["English","“name of a demon”"],222],["f",["Devanagari","deva222.webp"],222],["f",["Transliteration","trans222.webp"],222],["p","<b>Description <\/b><i>Shankhasura Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the dance tradition.",222],["p","<b>Technique <\/b>Form a fist with the left hand (with the thumb resting against the outside of the index finger), and turn the hand palm facing up. With the right hand, form <i>Bhramara Mudra <\/i>(p.64). Place your right thumb on top of the left little finger.",222],["p","<b>Application <\/b>Used by performing artists to denote a demon.",222],["e","Shankhavarta Mudra",223],["i","i882.webp",223],["f",["English","“conch livelihood”"],223],["f",["Devanagari","deva223.webp"],223],["f",["Transliteration","trans223.webp"],223],["p","<b>Description <\/b><i>Shankhavarta Mudra<\/i> is a joint-hand gesture (<i>samyukta <\/i> <i>hasta<\/i>) common to the Buddhist <i>Vajrayana<\/i> tradition. It is a Tantric mudra representing the conch shell, one of the <i>Ashtamangala<\/i>, “eight auspicious symbols,” the others being: a parasol, victory banner, golden fish, <i>dharma <\/i> (wheel), knot of wisdom, lotus flower, and treasure vase. These eight symbols represent the eight offerings made by the gods to <i>Shakyamuni Buddha<\/i> after he attained enlightenment.",223],["p","<b>Technique <\/b>Raise the hands in front of the heart, palms facing each other. Join the tips of all the fingers. Bend the right index finger about 90 degrees at the middle joint.",223],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the heart. Relax the chest and shoulders, and breathe naturally. Become very still and quiet, listening to the silence. Hold for 5 to 45 minutes.",223],["p","<b>Benefits <\/b>Quiets the mind, turns the attention inward, strengthens intuition, serves as a gateway to “hear” the wordless teachings of your own Original Nature.",223],["e","Shanmukha Mudra I",224],["i","i886.webp",224],["f",["English","“deity of war” or “six faces”"],224],["f",["Devanagari","deva224.webp"],224],["f",["Transliteration","trans224.webp"],224],["p","<b>Additional names <\/b><i>Kartikeya<\/i>, <i>Muruga<\/i>, <i>Kumaraswamy<\/i>, <i>Subrahmanya<\/i>, <i>Skanda<\/i>",224],["p","<b>Description <\/b><i>Shanmukha Mudra I<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of sixteen <i>Deva <\/i> <i>Hastas<\/i>, denoting Hindu gods and goddesses as described in the <i>Abhinaya <\/i> <i>Darpana.<\/i> It indicates the form and character of the Hindu deity <i>Shanmukha<\/i>.41",224],["p","<b>Technique <\/b>Assume <i>Trishula Mudra<\/i> (p.254) with your left hand and <i>Shikhara <\/i> <i>Mudra<\/i> (p.225) with your right hand. Hold the gestures at shoulder height, pointing upward.",224],["p","<b>Application <\/b>Used to indicate <i>Shanmukha<\/i>, the Hindu god of war.",224],["p","<b>Note <\/b>There are several combinations of mudras used to express the various traits and emblems of<i> Shanmukha Deva<\/i>. The one indicated here appears to be the most common.",224],["e","Shanmukha Mudra II",225],["i","i890.webp",225],["f",["English","“six faces”"],225],["f",["Devanagari","deva225.webp"],225],["f",["Transliteration","trans225.webp"],225],["p","<b>Description <\/b><i>Shanmukha Mudra II<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the ninth gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>.",225],["p","<b>Technique <\/b>Join the tips of the thumbs, index, middle, and ring fingers. Extend the little fingers forward.",225],["p","<b>Application <\/b>In a comfortable seated position, hold the mudra in front of the solar plexus. Relax the chest, shoulder, and abdomen. Breathe naturally. Hold for 5 to 45 minutes.",225],["p","<b>Benefits <\/b>Activates the body’s self-healing power, strengthens the immune system, improves memory, benefits the hair and bones, increases spiritual devotion.",225],["e","Shanmukhi Mudra",226],["i","i894.webp",226],["f",["English","“six faces” or “six openings”"],226],["f",["Devanagari","deva226.webp"],226],["f",["Transliteration","trans226.webp"],226],["p","<b>Description <\/b><i>Shanmukhi Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is used as a tool to assist the practice of <i>pratyahara<\/i> (interiorization of the senses).",226],["p","<b>Technique/Application <\/b>Sit in a comfortable position and raise the hands to the level of the head, palms facing your face. Take a deep breath and hold the air in. Close the ears with the thumbs, the eyes with the index fingers, the nostrils with the middle fingers, and the upper and lower lips with the ring and little fingers respectively. Closing the out-flowing of all the senses, look within. Hold the breath as long as you comfortably can without feeling strain or anxiety. Exhale silently and release the mudra. You can repeat up to 36 times. Beyond this, the guidance of a qualified teacher is recommended.",226],["p","<b>Benefits <\/b>Helps develop concentration, trains the mind to turn inward for meditation and other contemplative practices.",226],["p","<b>Caution <\/b>Press very gently on the eyelids. Breath retention is contraindicated during pregnancy, recent abdominal surgery, hernia, history of stroke, heart disease, and high blood pressure.",226],["e","Shikhara Mudra",227],["i","i898.webp",227],["f",["English","“spire” or “peak of the mountain”"],227],["f",["Devanagari","deva227.webp"],227],["f",["Transliteration","trans227.webp"],227],["p","<b>Additional Name <\/b><i>Aratrika<\/i>",227],["p","<b>Description <\/b><i>Shikhara Mudra<\/i> is the tenth hand gesture of the twenty-eight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>. It is also noted in the <i>Natya Shastra, <\/i>and in the <i>Abhinaya Chandrika<\/i> as <i>Aratika<\/i>. According to mythology, this mudra originated from <i>Chandrasekhara<\/i> (<i>Shiva<\/i>), when he held Mount Meru with this gesture as his bow. The associated sage is <i>Jihna<\/i>, race is <i>Gandharva<\/i>, color is dusky, and patron deity is the god of love (known by many names such as <i>Smara<\/i>, <i>Manmatha<\/i>, <i>Kama<\/i>, <i>Madana<\/i>).",227],["p","<b>Technique <\/b>From a fist with the thumb extended upward.",227],["p","<b>Application <\/b>Used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Madhana<\/i> (“god of love”); <i>Kamuka<\/i> (“bow”); <i>Sthamba<\/i> (“pillar”); <i>Nishchaya<\/i> (“resolve”); <i>Pithrukarmani <\/i> (“offerings to ancestors”); <i>Oshtra<\/i> (“lips”); <i>Pravishtarupa<\/i> (“pouring liquid” or “entering”); <i>Radana<\/i> (“teeth”); <i>Prashna-bhavana<\/i> (“questioning”); <i>Linga <\/i> (“masculine principle” or “phallus”); <i>Nasti-iti-vachana<\/i> (“saying no”); <i>Samarana<\/i> (“recollection”); <i>Abhinaya-anthikam<\/i> (“intimate suggestion”); <i>Kati-<\/i> <i>bandha-akarshana<\/i> (“tightening the waist band”); <i>Parirambha-vidikrama <\/i> (“embracing”); <i>Dhave<\/i> (“husband”); <i>Gantaninadha<\/i> (“sounding a bell”); <i>Peshane<\/i> (“pounding”). Additional usages denote: establishing a family, hero, hill top, friend, cleaning the teeth, fanning one’s face, difference, saying “what,” drinking water, the number four, enjoying consequences, demure of an amorous girl, bashfulness, bow, heroism, galloping, applying <i>tilaka<\/i>,42 tying the hair in a top-knot.",227],["e","Shiva Mudra",228],["i","i902.webp",228],["f",["English","“god of transformation”"],228],["f",["Devanagari","deva228.webp"],228],["f",["Transliteration","trans228.webp"],228],["p","<b>Additional names <\/b><i>Shambu<\/i>,<i> Sadashiva<\/i>, <i>Ishwara<\/i>, <i>Chandrakeshara<\/i>, <i>Ardhanarishwara<\/i>",228],["p","<b>Description <\/b><i>Shiva Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of sixteen <i>Deva Hastas<\/i>, denoting Hindu gods and goddesses as described in the <i>Abhinaya Darpana. <\/i> It indicates the form and character of the Hindu deity <i>Shiva<\/i>.",228],["p","<b>Technique <\/b>Assume <i>Mrigashirsha Mudra<\/i> (p.158) with your left hand and <i>Tripataka Mudra <\/i>(p.253) with your right hand. The left hand is turned palm facing you, held near the waistline; the right hand is held in front of the right shoulder.",228],["p","<b>Application <\/b>Used to indicate <i>Shiva<\/i>, the Hindu god of transformation. Stand with your feet apart and hold the gestures about 6 inches away from your body.",228],["p","<b>Note <\/b>There are several combinations of mudras used to express the various traits and emblems of <i>Shiva<\/i>. The one indicated here appears to be the most common.",228],["e","Shivalinga Mudra",229],["i","i910.webp",229],["f",["English","“masculine creative energy”"],229],["f",["Devanagari","deva229.webp"],229],["f",["Transliteration","trans229.webp"],229],["p","<b>Description <\/b><i>Shivalinga Mudra <\/i>is the eighth hand gesture of the twenty-four joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>.",229],["p","<b>Technique <\/b>Assume <i>Shikhara Mudra<\/i> (p.225) with your right hand and <i>Ardhachandra Mudra<\/i> (p.48) with your left hand. Place your right fist on top of your left palm, holding the gesture about 6 inches in front of your body.",229],["p","<b>Application <\/b>Primarily used by performing artists to signify <i>Shiva Lingam<\/i>, representing the deity <i>Shiva<\/i>. The <i>Lingam<\/i> is a symbol of male creative energy or the phallus. The <i>Lingam<\/i> also represents the beginning-less and endless <i>stambha<\/i> pillar,43 symbolizing the infinite nature of <i>Shiva<\/i>.",229],["e","Shukachanchu Mudra",230],["i","i917.webp",230],["f",["English","“parrot’s beak”"],230],["f",["Devanagari","deva230.webp"],230],["f",["Transliteration","trans230.webp"],230],["p","<b>Additional Name <\/b><i>Ankusha<\/i>",230],["p","<b>Description <\/b><i>Shukachanchu Mudra<\/i> is a single-hand mudra (<i>asamyukta hasta<\/i>) common to the dance tradition. It is noted in the<i> Abhinaya Chandrika<\/i>. According to mythology, it originated from the supreme goddess of love and beauty, <i>Lalita Mahatripurasundari<\/i>, depicted as holding her traditional implements: flower arrows, noose, goad, and sugarcane bow.",230],["p","<b>Technique <\/b>Touch the tip of your middle finger to the tip of the thumb. All other fingers are slightly curled in a graceful and natural manner.",230],["p","<b>Application <\/b>Used by performing artists to denote the goddess, or a beautiful and graceful woman. Typically applied with the tip of the index finger touching the side of the chin.",230],["e","Shukatunda Mudra",231],["i","i921.webp",231],["f",["English","“parrot’s beak”"],231],["f",["Devanagari","deva231.webp"],231],["f",["Transliteration","trans231.webp"],231],["p","<b>Description <\/b><i>Shukatunda Mudra<\/i> is the eighth hand gesture of the twentyeight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana<\/i>. It is also noted in the <i>Natya Shastra<\/i>. According to mythology, it originated from <i>Parvati<\/i> who used it in a lovers’ quarrel with <i>Sadashiva<\/i>. The associated sage is <i>Dhruvasa<\/i>, race is <i>Bramhana<\/i>, color is red, and patron deity is <i>Marici<\/i> (or <i>Sadashiva<\/i>).",231],["p","<b>Technique <\/b>Raise your hand to face outward with your fingers collected and extended upward. Bend the index and ring finger 90 degrees at the second joint.",231],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Bana-prayuga<\/i> (“shooting an arrow”); <i>Kuntartha<\/i> (“spear”); <i>Alayasya-smritikarma<\/i> (“remembering the past”); <i>Marmukthyam<\/i> (“mystic mood”); <i>Ugrabhava<\/i> (“ferocity”). Additional usages denote: <i>Brahma<\/i>’s weapon, nose, crookedness, change, turning around, proceeding, fighting, crossing, disrespect, lovers’ quarrel, opinion, abandonment, gambling dice, throwing a spear, ferocity, and secrecy.",231],["p","<b>Note <\/b>In the <i>Hasta Lakshana Deepika<\/i>, <i>Shukatunda Mudra<\/i> is noted as a different hand formation, identical to <i>Tamrachuda Mudra<\/i> of the <i>Abhinaya Darpana<\/i>.",231],["e","Shukra Mudra",232],["i","i925.webp",232],["f",["English","“planet Venus” or “pure”"],232],["f",["Devanagari","deva232.webp"],232],["f",["Transliteration","trans232.webp"],232],["p","<b>Additional Name <\/b><i>Bhargava<\/i>",232],["p","<b>Description <\/b><i>Shukra Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of the nine planets (<i>Nava-<\/i> <i>Graha Hastas<\/i>) as described in the <i>Abhinaya Darpana.<\/i> It indicates the character of the planet Venus.",232],["p","<b>Technique <\/b>Form <i>Mushti Mudra <\/i>(p.163) with each hand.",232],["p","<b>Application <\/b>Denotes the planet Venus. Traditionally, the left hand is raised and the right is lowered. The head moves up and down quickly and the eyes are half-closed.",232],["e","Shukri Mudra",233],["i","i929.webp",233],["f",["English","“virtuous action” or “having purity”"],233],["f",["Devanagari","deva233.webp"],233],["f",["Transliteration","trans233.webp"],233],["p","<b>Description <\/b><i>Shukri Mudra<\/i> is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, where it is used to calm the mind and restore vigor.",233],["p","<b>Technique <\/b>Join the tips of all of the fingers.",233],["p","<b>Application <\/b>This mudra may be practiced in any position: walking, standing, seated, or lying down. It may be held with one hand, or both hands. For the purposes of deeper restoration and rejuvenation, it is best to practice lying down in <i>shavasana<\/i> (corpse pose). Hold for 5 to 30 minutes.",233],["p","<b>Benefits <\/b>Balances the Five Elements, bolsters immunity, rejuvenates the organs and blood, soothes the nerves, evokes a peaceful state of mind.",233],["e","Shunya Mudra",234],["i","i933.webp",234],["f",["English","“emptiness,” “zero,” “sky,” or “hollow reed”"],234],["f",["Devanagari","deva234.webp"],234],["f",["Transliteration","trans234.webp"],234],["p","<b>Description <\/b><i>Shunya Mudra<\/i> is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the yoga tradition. It is part of the <i>Yoga Tattva Mudra Vijnana <\/i> form, where it is used to improve hearing and benefit the ears.",234],["p","<b>Technique <\/b>Fold the middle finger into the palm with the tip resting at the base of the thumb. Cover the middle finger with the thumb, and extend the remaining fingers.",234],["p","<b>Application <\/b>This mudra may be practiced in any position, while walking, standing, seated, or lying down. For a more in-depth experience, sit in a comfortable seated position with the spine erect. Relax the chest and belly, and breathe naturally. Form the mudra with each hand and rest the hands in the lap, palms facing up. Hold for 5 to 30 minutes. For best results in improving hearing, practice 2 to 3 sessions per day.",234],["p","<b>Benefits <\/b>Improves hearing, reduces ringing in the ears (tinnitus) and earache, decreases vertigo, improves balance.",234],["p","<b>Note <\/b><i>Shunya Mudra<\/i> is especially useful during travel. With air travel, it helps the ears adjust to the changing pressure during take-off and landing. During water and land travel, it helps prevent motion sickness.",234],["p","<b>Caution <\/b>Short-term use of this mudra for acute situations such as travel is perfectly safe. However, regular long-term practice of this mudra is not recommended. Once hearing has improved, or desired effects have been realized, it is best to discontinue regular practice of <i>Shunya Mudra<\/i>.",234],["e","Shvashru Mudra",235],["i","i937.webp",235],["f",["English","“mother-in-law”"],235],["f",["Devanagari","deva235.webp"],235],["f",["Transliteration","trans235.webp"],235],["p","<b>Description <\/b><i>Shvashru Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of the eleven relationships (<i>Bandava Hastas<\/i>) as described in the <i>Abhinaya Darpana. <\/i>It indicates motherin-law.",235],["p","<b>Technique <\/b>Assume <i>Ardhachandra Mudra <\/i>(p.48) with your left hand and place it on your stomach (this is the <i>stri<\/i> “feminine” hand). Form <i>Hamsasya Mudra <\/i> (p.96) with your right hand and hold it in front of your chest or throat.",235],["p","<b>Application <\/b>Used by performing artists to denote mother-in-law.",235],["e","Shvashura Mudra",236],["i","i941.webp",236],["f",["English","“father-in-law”"],236],["f",["Devanagari","deva236.webp"],236],["f",["Transliteration","trans236.webp"],236],["p","<b>Description <\/b><i>Shvashura Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of the eleven relationships (<i>Bandava Hastas<\/i>) as described in the <i>Abhinaya Darpana. <\/i>It indicates fatherin-law.",236],["p","<b>Technique <\/b>Assume <i>Hamsasya Mudra<\/i> (p.96) with your left hand and <i>Shikhara <\/i> <i>Mudra <\/i>(p.225) with your right hand. Hold both hands in front of your body.",236],["p","<b>Application <\/b>Used by performing artists to denote father-in-law.",236],["e","Simha Mudra",237],["i","i945.webp",237],["f",["English","“lion”"],237],["f",["Devanagari","deva237.webp"],237],["f",["Transliteration","trans237.webp"],237],["p","<b>Description <\/b><i>Simha Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the dance tradition. In the <i>Abhinaya Darpana<\/i>, it is noted as one of the gestures that indicate “wild animals.”",237],["p","<b>Technique <\/b>With the right hand facing away from you, cover the nails of the middle and ring fingers with the pad of the thumb. Hold the left hand with the fingers collected, palm facing you. Touch the backs of the two hands together.",237],["p","<b>Application <\/b>Used in the dance tradition to denote a lion.",237],["e","Simhakranta Mudra",238],["i","i949.webp",238],["f",["English","“lion nature”"],238],["f",["Devanagari","deva238.webp"],238],["f",["Transliteration","trans238.webp"],238],["p","<b>Additional Name <\/b><i>Singhakranta<\/i>",238],["p","<b>Description <\/b><i>Simhakranta Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the twenty-first gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>. The lion represents one of the various forms <i>Vishnu<\/i> took to benefit Earth. It denotes courage, majesty, and virtue.",238],["p","<b>Technique <\/b>Raise the hands in front of the shoulders with the palms facing forward, and fingers extending up.",238],["p","<b>Application <\/b>In a comfortable seated position, lengthen the spine, relax the shoulders, and breathe naturally. Hold the mudra with the elbows pointing downward and the hands relaxed. Hold for 5 to 30 minutes.",238],["p","<b>Benefits <\/b>Activates the body’s self-healing power, balances the immune system, increases courage (especially in the practice of self-honesty), increases devotion and loyalty.",238],["e","Simhamukha Mudra",239],["i","i953.webp",239],["f",["English","“lion face”"],239],["f",["Devanagari","deva239.webp"],239],["f",["Transliteration","trans239.webp"],239],["p","<b>Additional Names <\/b><i>Singhamukha<\/i>, <i>Mragi<\/i>",239],["p","<b>Description <\/b><i>Simhamukha Mudra<\/i> is the eighteenth hand gesture of the twenty-eight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya Darpana<\/i>.",239],["p","<b>Technique <\/b>Touch the pad of the thumb to the top joint creases of the middle and ring fingers. Extend the index and little fingers upward.",239],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Vidruma<\/i> (“coral”); <i>Mauktika<\/i> (“pearl”); <i>Sugandha<\/i> (“fragrance”); <i>Alaka-sampsarsa<\/i> (“stroking hair”); <i>Akarnane<\/i> (“hearing”); <i>Prushati<\/i> (“water drop”); <i>Hridi-samsthitah <\/i> <i>moksha-artha<\/i> (“salvation”); <i>Homa<\/i> (“fire ritual”); <i>Shasha<\/i> (“rabbit”); <i>Gaja <\/i> (“elephant”); <i>Dharba-chalana<\/i> (“waving kusha grass”); <i>Padma-damani<\/i> (“ lotus garland”); <i>Simha-anana<\/i> (“lion’s face”); <i>Vaidy-paka-sodhana<\/i> (“testing medicine preparation”).",239],["p","<b>Note <\/b><i>Simhamukha Mudra<\/i> is also known as <i>Mragi Mudra<\/i> in the yoga tradition and is found in the <i>Yoga Tattva Mudra Vijnana <\/i>form.",239],["e","Sindhuvara Mudra",240],["i","i957.webp",240],["f",["English","“type of tree”"],240],["f",["Devanagari","deva240.webp"],240],["f",["Transliteration","trans240.webp"],240],["p","<b>Description <\/b><i>Sindhuvara Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the dance tradition. It is listed as one of the mudras indicating “trees” in the <i>Abhinaya Darpana.<\/i>",240],["p","<b>Technique <\/b>With the palms facing away from you, form <i>Mayura Mudra <\/i> (p.154) with each hand and cross the wrists.",240],["p","<b>Application <\/b>Used in the dance tradition to denote the <i>sindhuvara<\/i> tree.",240],["e","Snusha Mudra",241],["i","i961.webp",241],["f",["English","“daughter-in-law”"],241],["f",["Devanagari","deva241.webp"],241],["f",["Transliteration","trans241.webp"],241],["p","<b>Description <\/b><i>Snusha Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of the eleven relationships (<i>Bandava Hastas<\/i>) as described in the <i>Abhinaya Darpana. <\/i>It indicates daughterin-law<i>.<\/i>",241],["p","<b>Technique <\/b>Form <i>Mayura Mudra<\/i> (p.154) with your left hand, palm facing upward, and <i>Mrigashirsha Mudra<\/i> (p.158) with your right hand, and place it on the stomach (this is the <i>stri<\/i> “feminine” hand).",241],["p","<b>Application <\/b>This gesture denotes daughter-in-law.",241],["e","Suchi Mudra",242],["i","i965.webp",242],["f",["English","“needle”"],242],["f",["Devanagari","deva242.webp"],242],["f",["Transliteration","trans242.webp"],242],["p","<b>Additional Name <\/b><i>Nirdeshika<\/i>",242],["p","<b>Description <\/b><i>Suchi Mudra <\/i>is the thirteenth hand gesture of the twentyeight single-hand mudras (<i>asamyukta hastas<\/i>) as described in the <i>Abhinaya <\/i> <i>Darpana<\/i>. It is also noted in the <i>Natya Shastra<\/i> and in the<i> Abhinaya Chandrika <\/i> as <i>Nirdeshika<\/i>. According to mythology, the mudra originated from <i>Brahma<\/i>, when he declared, “I’m matchless.” The associated sage is <i>Surya<\/i>, the sun, race is <i>Deva<\/i>, color is white, and patron deity is <i>Vishvakarma<\/i>.44",242],["p","<b>Technique <\/b>Extend the index finger while keeping the remaining fingers collected under the tip of the thumb.",242],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Eka-artha<\/i> (“denoting number one”); <i>Parabrahma-bhavana<\/i> (“supreme being”); <i>Shata<\/i> (“denoting hundred”); <i>Ravi<\/i> (“sun”); <i>Nagaryam<\/i> (“city”); <i>Lokartham<\/i> (“world”); <i>Tatha-iti-vachanam <\/i> (“to say ‘like that’”); <i>Yat-shabde tat-sabde<\/i> (“asking this or that?”); <i>Vyajana-<\/i> <i>artha<\/i> (“solitude”); <i>Tharjana<\/i> (“threatening”); <i>Karshya<\/i> (“growing thin”); <i>Shalaka <\/i> (“rod”); <i>Vapushi<\/i> (“body”); <i>Ascharya<\/i> (“astonishment”); <i>Venibhavana<\/i> (“braid of hair”); <i>Chatra<\/i> (“umbrella”); <i>Samartha<\/i> (“capability”); <i>Panau<\/i> (“hand”); <i>Romalayam<\/i> (“line of hair,” such as eyebrow or on the abdomen); <i>Bherivadana <\/i> (“beating a drum”); <i>Kulala-chakra-bramana<\/i> (“potter’s wheel”); <i>Rathanga-<\/i> <i>mandala <\/i>(“chariot wheel”); <i>Vivechana<\/i> (“pros and cons”); <i>Dina-anta<\/i> (“end of the day”). Also used to denote: praising, telling truth, pointing to distant place, life, walking in front, lotus stalk, sunrise and sunset, arrow, handle, listening, yearning for the beloved, recollection, nose, beak, and vision.",242],["e","Suchidhara Mudra",243],["i","i969.webp",243],["f",["English","“edge of the needle” or “holding a needle”"],243],["f",["Devanagari","deva243.webp"],243],["f",["Transliteration","trans243.webp"],243],["p","<b>Description <\/b><i>Suchidhara Mudra <\/i>is a joint-hand gesture (<i>samyukta hasta<\/i>) mentioned in the <i>Odissi Dance Pathfinder Vol. II.<\/i>",243],["p","<b>Technique <\/b>Form <i>Suchi Mudra <\/i>(p.240) with the left hand. With the thumb and index finger of the right hand, firmly hold the left index finger while keeping the other fingers tucked into the palm. Hold the gesture above the head, framing your face.",243],["p","<b>Application <\/b><i>Suchidhara Mudra<\/i> is utilized to highlight the<i> lasya <\/i>(feminine grace) of the dancer, and is frequently used by dancers in <i>Pallavis<\/i> (“pure dance” forms). It is the hand gesture of the <i>chari<\/i> (transitional phrase) titled <i>Bishama Sanchara<\/i>.",243],["e","Sumukha Mudra",244],["i","i973.webp",244],["f",["English","“good/pleasant face”"],244],["f",["Devanagari","deva244.webp"],244],["f",["Transliteration","trans244.webp"],244],["p","<b>Description <\/b><i>Sumukha Mudra<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the first gesture in the sub-set of twenty-four mudras practiced before meditation or recitation of the <i>Gayatri Mantra<\/i>.",244],["p","<b>Technique <\/b>Join the tips of all of the fingers of each hand. Touch the two hands together at the fingertips.",244],["p","<b>Application <\/b>In a comfortable seated position, lengthen the spine, and relax the shoulders, chest, and belly. Hold the mudra in front of the solar plexus (below the sternum). Breathe naturally and hold for 5 to 30 minutes.",244],["p","<b>Benefits <\/b>Balances left and right sides of the body, harmonizes all Five Elements, activates the body’s self-healing power, benefits the tendons and bones, increases concentration power, builds devotion and spiritual resolve.",244],["e","Surabhi Mudra",245],["i","i977.webp",245],["f",["English","“cow”"],245],["f",["Devanagari","deva245.webp"],245],["f",["Transliteration","trans245.webp"],245],["p","<b>Additional Name <\/b><i>Dhenu<\/i>",245],["p","<b>Description <\/b><i>Surabhi Mudra<\/i> is an intricate joint-hand gesture (<i>samyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, and is one of the traditional thirty-two <i>Gayatri Mudras<\/i>, specifically the first gesture in the sub-set of eight mudras practiced after meditation or recitation of the <i>Gayatri Mantra<\/i>.",245],["p","<b>Technique <\/b>Join the palms together in front of the chest. Cross the left middle finger behind the right. Join the tip of the left middle finger with the tip of the right index, and the tip of the right middle finger with the tip of the left index. Cross the left ring finger behind the right. Touch the tip of the left ring finger to the right little finger, and the tip of the right ring finger to the tip of the left little finger. Join the tips of the thumbs.",245],["p","<b>Application <\/b>In a comfortable seated position, lengthen the spine, and relax the shoulders, chest, and belly. Raise the mudra to the level of the heart. Breathe naturally and hold for 5 to 30 minutes.",245],["p","<b>Benefits <\/b>Balances <i>Vata Dosha <\/i>and awakens <i>Manipura Chakra <\/i>(see Appendix A), treats cough and bile disorders, improves memory, reduces inflammation (especially related to rheumatism), awakens empathy, reduces ego grasping, gives insight into one’s hidden gifts and talents (and how these can be used to benefit all beings), increases devotion and spiritual radiance.",245],["e","Surya Mudra I",246],["i","i981.webp",246],["f",["English","“sun god”"],246],["f",["Devanagari","deva246.webp"],246],["f",["Transliteration","trans246.webp"],246],["p","<b>Additional names <\/b><i>Divakara<\/i>, <i>Arka<\/i>, <i>Bhanu<\/i>, <i>Aditya<\/i>, <i>Bhaskara<\/i>",246],["p","<b>Description <\/b><i>Surya Mudra I<\/i> is a joint-hand gesture (<i>samyukta hasta<\/i>) used by performing artists. It is found in the traditional set of sixteen <i>Deva Hastas<\/i>, denoting Hindu gods and goddesses as described in the <i>Abhinaya Darpana<\/i>. It indicates the form and character of the Hindu deity <i>Surya<\/i>.",246],["p","<b>Technique <\/b>Form <i>Kapittha Mudra <\/i>(p.106) with your right hand and <i>Alapadma <\/i> <i>Mudra<\/i> (p.41) with your left hand. Place both hands around chest level and stand in <i>sama <\/i>position (straight and elongated posture). Assume a pleasant gaze.",246],["p","<b>Application <\/b>To denote the sun.",246],["p","<b>Note <\/b>In addition to this general mudra to indicate the sun, there are other hand formations mentioned in the <i>Abhinaya Darpana<\/i> that denote the rising sun, midday sun, and setting sun.45",246],["e","Surya Mudra II",247],["i","i985.webp",247],["f",["English","“sun”"],247],["f",["Devanagari","deva247.webp"],247],["f",["Transliteration","trans247.webp"],247],["p","<b>Description <\/b><i>Surya Mudra II<\/i> is a single-hand gesture (<i>asamyukta hasta<\/i>) common to the yoga tradition. It is found in the <i>Yoga Tattva Mudra Vijnana <\/i> form, where it is used for weight loss, depression, and to improve digestion.",247],["p","<b>Technique <\/b>Cover the nail of the ring finger with the pad of the thumb and extend the remaining fingers, keeping them relaxed.",247],["p","<b>Application <\/b>This mudra may be practiced in any position: while walking, sitting, standing, or lying down. For increased benefit, practice first thing in the morning on an empty stomach. Sit in a comfortable seated position with the spine erect. Form the mudra with each hand and place the hands on the thighs, palms up. Relax the chest, shoulders, and belly, and breathe naturally. Relax in stillness. Hold for 5 to 45 minutes.",247],["p","<b>Benefits <\/b>Burns excess fat, improves digestion, reduces cholesterol, detoxifies the body, increases body temperature, reduces sluggishness, mental fogginess, and depression.",247],["p","<b>Note <\/b><i>Surya Mudra II<\/i> will have increased benefits for improving digestive function if practiced while sitting in <i>Vajrasana<\/i> (thunderbolt pose). Kneel on the floor with the inner thighs together. Rest the buttocks on the heels and settle the weight down. Then, follow the directions above.",247],["e","Svadhisthana Chakra Mudra",248],["i","i989.webp",248],["f",["English","“self abode”"],248],["f",["Devanagari","deva248.webp"],248],["f",["Transliteration","trans248.webp"],248],["p","<b>Description <\/b><i>Svadhishthana Chakra Mudra<\/i> is an intricate joint-hand gesture (<i>samyukta hasta<\/i>) used in Tantric Yoga and Japanese martial arts to open the <i>Svadhishthana Chakra<\/i> (the pelvic center) and increase the ability to adapt to changing circumstances.",248],["p","<b>Technique <\/b>Cross the middle fingers over the index fingers on each hand. Interlace the ring and little fingers, folding them into the palm. Touch the tips of the index fingers together and bring the thumbs up to the tips of the middle fingers. Press the heels of the hands together, with the sides of the thumbs touching.",248],["p","<b>Application <\/b>In a comfortable seated position, lengthen the spine and relax the shoulders, chest, and belly. Place the tip of the tongue against the upper palate, and soften the inside of the mouth. Rest the mudra against your pubic bone, and breathe naturally. Hold for 5 to 45 minutes.",248],["p","<b>Benefits <\/b>Increases ability to adapt to change, opens creativity and the ability to spontaneously respond to any situation, increases capacity for intimacy with self, others, and the environment, benefits the reproductive system, improves sexual health and fertility, tonifies the blood.",248],["p","<b>Note <\/b>This mudra requires considerable flexibility in the fingers. Go easy at first, practicing for shorter durations (a minute or two is plenty), until the fingers become accustomed to the position. Once your hands feel comfortable holding the mudra, you may practice for longer periods to experience the deeper dimensions of this powerful mudra.",248],["p","<b>Caution <\/b>Contraindicated during pregnancy, unless practiced under the guidance of an expert instructor.",248],["e","Svastika Mudra",249],["i","i993.webp",249],["f",["English","“crossed”"],249],["f",["Devanagari","deva249.webp"],249],["f",["Transliteration","trans249.webp"],249],["p","<b>Description <\/b><i>Svastika Mudra<\/i> is the fourth hand gesture of the twenty-four joint-hand mudras (<i>samyukta hastas<\/i>) as described in the <i>Abhinaya Darpana. <\/i> It is also noted in the <i>Natya Shastra<\/i>. The patron deity associated with it is <i>Bharati<\/i>.",249],["p","<b>Technique <\/b>Cross the wrists with the palms resting on the upper chest. Keep the fingers extended and collected, palms flat (as in <i>Pataka Mudra<\/i>).",249],["p","<b>Application <\/b>Primarily used by performing artists to create context and express emotional states or specific actions. <i>Viniyoga<\/i>: <i>Makara-artha<\/i> (“crocodile”); <i>Bhaya-vada<\/i> (“timid speech”); <i>Vivada<\/i> (“dispute”); Kirtana (“praise”); <i>Svastikaiya<\/i> (“crossing”). The dynamic move of separating the hands apart represents movement of clouds, jungles, oceans, the earth, and vastness in general.",249],["p","<b>Note <\/b>In the <i>Natya Shastra<\/i>, a different version of this mudra is noted, where <i>Arala<\/i> is used in place of <i>Pataka<\/i>.",249],["e","Svastikamukha Mudra",250],["i","i997.webp",250],["f",["English","“cross fa
